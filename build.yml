name: Gerar APK do Karaoke

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Preparar módulo Android
        shell: bash
        run: |
          set -euo pipefail

          test -f MainActivity.java
          test -f AndroidManifest.xml
          test -f index.html

          mkdir -p app/src/main/java/br/com/ursoplayer/karaoke
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/assets/fontes
          mkdir -p app/src/main/res/drawable

          cp MainActivity.java app/src/main/java/br/com/ursoplayer/karaoke/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp index.html app/src/main/assets/index.html

          # Copia recursos opcionais caso estejam na raiz do repositório
          for ext in jpg png gif webp mp4; do
            for f in *.$ext; do
              if [[ -f "$f" && "$f" != "ic_launcher.png" ]]; then
                cp "$f" "app/src/main/assets/$f"
              fi
            done
          done

          # Copia fontes independente de a pasta se chamar 'fontes' ou 'FONTE_KARAOKE...'
          for d in fontes FONTE* Fontes*; do
            if [[ -d "$d" ]]; then
              cp -r "$d/." app/src/main/assets/fontes/
            fi
          done

          sed -i -E 's/ package="[^"]*"//' app/src/main/AndroidManifest.xml
          sed -i '/<uses-sdk[[:space:]]/d' app/src/main/AndroidManifest.xml

          if [[ -f ic_launcher.png ]]; then
            cp ic_launcher.png app/src/main/res/drawable/ic_launcher.png
          fi

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'br.com.ursoplayer.karaoke'
              compileSdk 35

              defaultConfig {
                  applicationId 'br.com.ursoplayer.karaoke'
                  minSdk 23
                  targetSdk 28
                  versionCode 12
                  versionName '2.3'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-APK-Pronto
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

