name: Gerar APK do Karaoke

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar ZIP
        run: |
          sudo apt-get install -y unzip
          for f in *.zip; do [ -e "$f" ] || continue; unzip -o "$f"; done
          if [ -d "FONTE-KARAOKE" ]; then cp -r FONTE-KARAOKE/* .; fi
          if [ ! -f "build.gradle" ] && [ ! -f "settings.gradle" ]; then
            for dir in */; do
              if [ -f "${dir}build.gradle" ] || [ -f "${dir}settings.gradle" ]; then
                cp -r "${dir}"* .
                break
              fi
            done
          fi

      - name: Corrigir Bibliotecas do Gradle (Conserta erro de download)
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Karaoke"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

      - name: Corrigir Java e Tela Preta
        run: |
          cat << 'EOF' > patch.py
          import os, glob
          for p in glob.glob('**/MainActivity.java', recursive=True):
              with open(p, 'r', encoding='utf-8') as f: j = f.read()
              if 'setMediaPlaybackRequiresUserGesture' not in j:
                  j = j.replace("super.onCreate(savedInstanceState);", "super.onCreate(savedInstanceState);\n try { if (webView != null) webView.getSettings().setMediaPlaybackRequiresUserGesture(false); } catch (Exception e) {}")
              if 'FLAG_HARDWARE_ACCELERATED' not in j:
                  j = j.replace("super.onCreate(savedInstanceState);", "super.onCreate(savedInstanceState);\n try { getWindow().setFlags(android.view.WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED, android.view.WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED); if (webView != null) webView.setLayerType(android.view.View.LAYER_TYPE_HARDWARE, null); } catch (Exception e) {}")
              with open(p, 'w', encoding='utf-8') as f: f.write(j)
          EOF
          python3 patch.py

      - name: Injetar o HTML novo dentro do APK
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          find . -name "index.html" -not -path "./.git/*" -exec cp index.html {} \;
          echo "HTML injetado com sucesso!"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Compilar APK
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper --gradle-version 8.11.1; fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-APK-Pronto
          path: app/build/outputs/apk/debug/*.apk
