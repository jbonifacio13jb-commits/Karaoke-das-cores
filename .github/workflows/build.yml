name: Build APK Karaokê Festa das Cores

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gerar Projeto Android Nativo com Ponte SAF & TV Box
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm -f /tmp/cmdline-tools.zip
          fi

          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          mkdir -p app/src/main/java/br/com/ursoplayer/karaoke
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          cp -r index.html app/src/main/assets/index.html
          [ -d fontes ] && cp -r fontes app/src/main/assets/ || true
          [ -f bgpadrao.jpg ] && cp bgpadrao.jpg app/src/main/assets/ || true

          cat << 'EOF' > settings.gradle
          rootProject.name = "KaraokeFestaDasCores"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'br.com.ursoplayer.karaoke'
              compileSdk 34
              defaultConfig {
                  applicationId "br.com.ursoplayer.karaoke"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.documentfile:documentfile:1.0.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Karaokê Festa das Cores"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/br/com/ursoplayer/karaoke/MainActivity.java
          package br.com.ursoplayer.karaoke;

          import android.app.Activity;
          import android.app.UiModeManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.content.res.Configuration;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.documentfile.provider.DocumentFile;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              private static final int REQ_FOLDER = 1001;
              private WebView webView;
              private Uri rootTreeUri;
              private boolean rockDoidoActive = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemUI();

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          SharedPreferences prefs = getSharedPreferences("karaoke_prefs", MODE_PRIVATE);
                          String savedUri = prefs.getString("tree_uri", null);
                          if (savedUri != null) {
                              rootTreeUri = Uri.parse(savedUri);
                              scanFolderAsync(false);
                          }
                      }
                  });
                  webView.addJavascriptInterface(new HostBridge(), "AndroidHost");
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  );
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FOLDER && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      rootTreeUri = data.getData();
                      final int takeFlags = data.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      try { getContentResolver().takePersistableUriPermission(rootTreeUri, takeFlags); } catch (Exception ignored) {}
                      getSharedPreferences("karaoke_prefs", MODE_PRIVATE).edit().putString("tree_uri", rootTreeUri.toString()).apply();
                      scanFolderAsync(false);
                  }
              }

              private void scanFolderAsync(final boolean silent) {
                  if (rootTreeUri == null) return;
                  new Thread(() -> {
                      try {
                          DocumentFile root = DocumentFile.fromTreeUri(this, rootTreeUri);
                          if (root == null || !root.exists()) return;
                          JSONArray arr = new JSONArray();
                          traverse(root, root.getName() != null ? root.getName() : "KARAOKE", arr, silent);
                          final String json = arr.toString();
                          runOnUiThread(() -> webView.evaluateJavascript("window.onNativeFolderLoaded(" + json + ", " + silent + ");", null));
                      } catch (Exception e) {
                          runOnUiThread(() -> webView.evaluateJavascript("if(window.onNativeFolderLoadFailed) window.onNativeFolderLoadFailed();", null));
                      }
                  }).start();
              }

              private void traverse(DocumentFile dir, String path, JSONArray out, boolean silent) throws Exception {
                  for (DocumentFile f : dir.listFiles()) {
                      String name = f.getName();
                      if (name == null) continue;
                      String curPath = path + "/" + name;
                      if (f.isDirectory()) {
                          traverse(f, curPath, out, silent);
                      } else {
                          JSONObject o = new JSONObject();
                          o.put("name", name);
                          o.put("path", curPath);
                          o.put("uri", f.getUri().toString());
                          out.put(o);
                          if (!silent && name.equalsIgnoreCase("intro.mp4")) {
                              final String introUri = f.getUri().toString();
                              runOnUiThread(() -> webView.evaluateJavascript("if(window.onIntroFoundDuringScan) window.onIntroFoundDuringScan(" + JSONObject.quote(introUri) + ");", null));
                          }
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (rockDoidoActive) return;
                  webView.evaluateJavascript("if(typeof retornarAoCicloInicial==='function') retornarAoCicloInicial();", null);
              }

              public class HostBridge {
                  @JavascriptInterface
                  public String getDeviceKind() {
                      UiModeManager uiModeManager = (UiModeManager) getSystemService(Context.UI_MODE_SERVICE);
                      if (uiModeManager != null && uiModeManager.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION) {
                          return "tv";
                      }
                      return "phone";
                  }

                  @JavascriptInterface
                  public void chooseFolder() {
                      runOnUiThread(() -> {
                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                          intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                          startActivityForResult(intent, REQ_FOLDER);
                      });
                  }

                  @JavascriptInterface
                  public void pickNewFolder() { chooseFolder(); }

                  @JavascriptInterface
                  public void refreshFolder() { scanFolderAsync(true); }

                  @JavascriptInterface
                  public void setOrientation(int mode) {
                      runOnUiThread(() -> setRequestedOrientation(mode == 1 ? ActivityInfo.SCREEN_ORIENTATION_PORTRAIT : ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE));
                  }

                  @JavascriptInterface
                  public void setRockDoidoActive(boolean active) { rockDoidoActive = active; }

                  @JavascriptInterface
                  public String readText(String uriStr) {
                      try (InputStream is = getContentResolver().openInputStream(Uri.parse(uriStr));
                           BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = br.readLine()) != null) sb.append(line).append("\n");
                          return sb.toString();
                      } catch (Exception e) { return ""; }
                  }

                  @JavascriptInterface
                  public String readDataUrl(String uriStr) {
                      try (InputStream is = getContentResolver().openInputStream(Uri.parse(uriStr));
                           ByteArrayOutputStream bos = new ByteArrayOutputStream()) {
                          byte[] buf = new byte[8192];
                          int n;
                          while ((n = is.read(buf)) != -1) bos.write(buf, 0, n);
                          String mime = getContentResolver().getType(Uri.parse(uriStr));
                          if (mime == null) mime = "application/octet-stream";
                          return "data:" + mime + ";base64," + Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP);
                      } catch (Exception e) { return ""; }
                  }

                  @JavascriptInterface
                  public boolean writeListaTxt(String content) {
                      if (rootTreeUri == null) return false;
                      try {
                          DocumentFile root = DocumentFile.fromTreeUri(MainActivity.this, rootTreeUri);
                          if (root == null) return false;
                          DocumentFile target = root.findFile("lista.txt");
                          if (target == null) target = root.createFile("text/plain", "lista.txt");
                          if (target == null) return false;
                          try (OutputStream os = getContentResolver().openOutputStream(target.getUri(), "wt")) {
                              os.write(content.getBytes(StandardCharsets.UTF_8));
                              os.flush();
                              return true;
                          }
                      } catch (Exception e) { return false; }
                  }

                  @JavascriptInterface
                  public boolean deleteFile(String uriStr) {
                      try {
                          DocumentFile df = DocumentFile.fromSingleUri(MainActivity.this, Uri.parse(uriStr));
                          return df != null && df.delete();
                      } catch (Exception e) { return false; }
                  }

                  @JavascriptInterface
                  public void exitApp() {
                      runOnUiThread(() -> finishAndRemoveTask());
                  }
              }
          }
          EOF

          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 8.5
          else
            mkdir -p gradle/wrapper
            cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew -o gradlew
            chmod +x gradlew
          fi

          ./gradlew assembleRelease

      - name: Publicar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-Festa-Das-Cores-APK
          path: app/build/outputs/apk/release/*.apk
