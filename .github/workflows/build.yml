name: Build Karaokê Festa das Cores APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Preparar pasta www do aplicativo
        run: |
          mkdir -p www
          if [ -d "KARAOKÊ" ]; then
            cp -r "KARAOKÊ/." www/
          elif [ -d "KARAOKE" ]; then
            cp -r "KARAOKE/." www/
          fi
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "www/index.html" ]; then
            echo "index.html já presente em www/"
          else
            echo "<h1>Karaoke Festa das Cores</h1>" > www/index.html
          fi

      - name: Configurar Java 17 e Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Node.js e Capacitor CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inicializar projeto Android com Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Karaoke Festa das Cores" "com.ursoplayer.karaokefestadascores" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Configurar modo paisagem e permissões para TV Box, Smart TV e Celular
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="landscape"/g' "$MANIFEST"
          fi
          MAIN_ACTIVITY=$(find android/app/src/main -name "MainActivity.java" -o -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            cat << 'EOF' > "$MAIN_ACTIVITY"
package com.ursoplayer.karaokefestadascores;

import android.content.pm.ActivityInfo;
import android.os.Bundle;
import android.view.KeyEvent;
import android.view.View;
import android.view.WindowManager;
import android.webkit.JavascriptInterface;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
        hideSystemBars();
        if (getBridge() != null && getBridge().getWebView() != null) {
            getBridge().getWebView().addJavascriptInterface(new AndroidHostBridge(), "AndroidHost");
        }
    }

    @Override
    public void onWindowFocusChanged(boolean hasFocus) {
        super.onWindowFocusChanged(hasFocus);
        if (hasFocus) {
            setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
            hideSystemBars();
        }
    }

    private void hideSystemBars() {
        View decorView = getWindow().getDecorView();
        decorView.setSystemUiVisibility(
            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
            | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
            | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
            | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
            | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
            | View.SYSTEM_UI_FLAG_FULLSCREEN
        );
    }

    @Override
    public boolean dispatchKeyEvent(KeyEvent event) {
        if (getBridge() != null && getBridge().getWebView() != null) {
            int code = event.getKeyCode();
            if (code >= KeyEvent.KEYCODE_0 && code <= KeyEvent.KEYCODE_9) {
                char digit = (char) ('0' + (code - KeyEvent.KEYCODE_0));
                if (event.getAction() == KeyEvent.ACTION_DOWN) {
                    String js = "if (window.receberTeclaNativa) window.receberTeclaNativa('" + digit + "');";
                    getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(js, null));
                }
            }
        }
        return super.dispatchKeyEvent(event);
    }

    public class AndroidHostBridge {
        @JavascriptInterface
        public String getDeviceKind() {
            boolean isTv = getPackageManager().hasSystemFeature("android.software.leanback")
                        || getPackageManager().hasSystemFeature("android.hardware.type.television");
            if (isTv) return "tv";
            int smallestWidth = getResources().getConfiguration().smallestScreenWidthDp;
            return smallestWidth >= 600 ? "tvbox" : "phone";
        }

        @JavascriptInterface
        public void setOrientation(int mode) {
            runOnUiThread(() -> {
                if (mode == 1) {
                    setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_PORTRAIT);
                } else {
                    setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
                }
            });
        }

        @JavascriptInterface
        public void exitApp() {
            runOnUiThread(() -> {
                finishAffinity();
                System.exit(0);
            });
        }
    }
}
EOF
          fi

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-festa-das-cores-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
