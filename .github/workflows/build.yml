name: Gerar APK do Karaoke

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip

          shopt -s nullglob
          for arquivo in *.zip; do
            echo "Descompactando: $arquivo"
            unzip -oq "$arquivo" -d .
          done

          if [[ ! -f settings.gradle && ! -f settings.gradle.kts ]]; then
            configuracao=$(find . -mindepth 2 -maxdepth 6 -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path './.git/*' -print -quit)

            if [[ -z "$configuracao" ]]; then
              echo "ERRO: settings.gradle não encontrado."
              exit 1
            fi

            projeto=$(dirname "$configuracao")
            cp -a "$projeto"/. .
          fi

          if [[ ! -f app/build.gradle && ! -f app/build.gradle.kts ]]; then
            echo "ERRO: módulo app/build.gradle não encontrado."
            exit 1
          fi

      - name: Injetar HTML no APK
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Garantir Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew ]]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-APK-Pronto
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
