name: Gerar APK do Karaoke com Jukebox e Ajuste do Logo

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar o arquivo ZIP automaticamente
        run: |
          sudo apt-get install -y unzip
          unzip -o *.zip
          if [ -d "FONTE-KARAOKE" ]; then
            cp -r FONTE-KARAOKE/* .
          fi
          ls -la

      - name: Injetar Jukebox e Correcao do Logo no index.html
        run: |
          python3 - << 'EOF'
          import os, glob

          html_files = glob.glob("**/app/src/main/assets/index.html", recursive=True)
          if not html_files:
              print("Arquivo index.html nao encontrado!")
              exit(0)

          html_path = html_files[0]
          print(f"Modificando automaticamente: {html_path}")

          with open(html_path, "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          # 1. Regra de CSS: Logo oculto na tela de espera, so surge ao zerar a contagem
          css_patch = """
          <style>
          #marca-agua, #idle-hero { display: none !important; }
          body.contagem-zerada #marca-agua, body.contagem-zerada #idle-hero { display: flex !important; }
          </style>
          """

          # 2. Registra os arquivos MP3 para o Jukebox
          target_mp3 = "if (emRockdoido && name.endsWith('.MP3')) {"
          replacement_mp3 = """
                  if (name.endsWith('.MP3') && !emRockdoido) {
                      window._mp3JukeboxList = window._mp3JukeboxList || [];
                      window._mp3JukeboxList.push(f);
                  }
                  if (emRockdoido && name.endsWith('.MP3')) {"""

          if target_mp3 in content:
              content = content.replace(target_mp3, replacement_mp3, 1)

          # 3. Script do Jukebox (5 segundos no botao ou tecla 9/OK)
          jukebox_script = """
          <script>
          (function() {
              window._mp3JukeboxList = window._mp3JukeboxList || [];
              let modoJukebox = false;
              let audioJukebox = null;
              let idxJukebox = 0;

              window.toggleJukebox = function() {
                  if (!modoJukebox) {
                      if (!window._mp3JukeboxList || window._mp3JukeboxList.length === 0) {
                          if (typeof mostrarAviso === 'function') mostrarAviso("Nenhum MP3 encontrado na pasta", true);
                          return;
                      }
                      modoJukebox = true;
                      if (typeof fecharVideo === 'function') fecharVideo();
                      tocarJukebox(0);
                      if (typeof mostrarAviso === 'function') mostrarAviso("📻 JUKEBOX ATIVADO (Segure 5s para sair)", false);
                  } else {
                      modoJukebox = false;
                      if (audioJukebox) { audioJukebox.pause(); audioJukebox = null; }
                      if (typeof mostrarLetreiroPadrao === 'function') mostrarLetreiroPadrao();
                      if (typeof mostrarAviso === 'function') mostrarAviso("🎤 MODO KARAOKE RESTAURADO", false);
                  }
              };

              function tocarJukebox(idx) {
                  if (!modoJukebox || !window._mp3JukeboxList.length) return;
                  idxJukebox = idx % window._mp3JukeboxList.length;
                  const item = window._mp3JukeboxList[idxJukebox];
                  let src = item.contentUri || (item.isUrl ? item.url : (item instanceof Blob ? URL.createObjectURL(item) : ''));
                  if (item.contentUri && window.AndroidHost && AndroidHost.readDataUrl) {
                      try { src = AndroidHost.readDataUrl(item.contentUri) || src; } catch(_) {}
                  }
                  if (audioJukebox) { audioJukebox.pause(); }
                  audioJukebox = new Audio(src);
                  audioJukebox.play().catch(function(e) {});
                  audioJukebox.onended = function() { if (modoJukebox) tocarJukebox(idxJukebox + 1); };

                  const nome = (item.name || "Musica").replace(/\.mp3$/i, '');
                  const mq = document.getElementById('marquee-text');
                  if (mq) mq.innerHTML = '📻 MODO JUKEBOX &nbsp;|&nbsp; ▶ TOCANDO: <span style="color:#00ffff">' + nome + '</span> &nbsp;|&nbsp; Segure 5s para voltar';
              }

              // Observa o contador para exibir o logo exatamente ao zerar (0)
              const numEl = document.getElementById('countdown-num');
              if (numEl) {
                  const obs = new MutationObserver(function() {
                      if (numEl.innerText.trim() === '0') {
                          document.body.classList.add('contagem-zerada');
                      }
                  });
                  obs.observe(numEl, { childList: true, characterData: true, subtree: true });
              }

              const playerEl = document.getElementById('video-player');
              if (playerEl) {
                  playerEl.addEventListener('ended', function() {
                      document.body.classList.remove('contagem-zerada');
                  });
              }

              // 5 segundos segurando no botao CODIGO (Celular/Mouse)
              function bindHold() {
                  const btn = document.getElementById('btn-teclado');
                  if (!btn) return setTimeout(bindHold, 500);

                  let timer = null;
                  let acionou = false;

                  function start() {
                      acionou = false;
                      timer = setTimeout(function() {
                          acionou = true;
                          window.toggleJukebox();
                      }, 5000);
                  }
                  function cancel() {
                      if (timer) clearTimeout(timer);
                  }

                  btn.addEventListener('touchstart', start, { passive: true });
                  btn.addEventListener('touchend', function(e) {
                      cancel();
                      if (acionou) { e.preventDefault(); e.stopImmediatePropagation(); }
                  });
                  btn.addEventListener('mousedown', start);
                  btn.addEventListener('mouseup', cancel);
                  btn.addEventListener('mouseleave', cancel);
              }
              bindHold();

              // 5 segundos segurando no controle remoto (Tecla 9 ou OK)
              let keyTimer = null;
              let keyHeld = null;
              document.addEventListener('keydown', function(e) {
                  const focoCodigo = document.activeElement && document.activeElement.id === 'btn-teclado';
                  const valida = (e.key === '9' || (e.key === 'Enter' && focoCodigo));
                  if (valida && !keyHeld) {
                      keyHeld = e.key;
                      keyTimer = setTimeout(function() {
                          window.toggleJukebox();
                      }, 5000);
                  }
              });
              document.addEventListener('keyup', function(e) {
                  if (e.key === keyHeld) {
                      keyHeld = null;
                      if (keyTimer) clearTimeout(keyTimer);
                  }
              });
          })();
          </script>
          """

          content = content.replace("</head>", css_patch + "\n</head>")
          content = content.replace("</body>", jukebox_script + "\n</body>")

          with open(html_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Injecao concluida com sucesso!")
          EOF

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Garantir Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Compilar APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-Festa-das-Cores-v2.0
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
