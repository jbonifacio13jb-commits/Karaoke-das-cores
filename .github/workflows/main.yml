name: Gerar APK do Karaoke

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar o arquivo ZIP automaticamente
        run: |
          sudo apt-get install -y unzip
          for f in *.zip; do
            [ -e "$f" ] || continue
            unzip -o "$f"
          done

          if [ -d "FONTE-KARAOKE" ]; then
            cp -r FONTE-KARAOKE/* .
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "settings.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            for dir in */; do
              if [ -f "${dir}build.gradle" ] || [ -f "${dir}settings.gradle" ]; then
                echo "Projeto encontrado em $dir. Movendo para raiz..."
                cp -r "${dir}"* .
                break
              fi
            done
          fi
          ls -la

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Garantir Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Compilar APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-Festa-das-Cores-v2.0
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
