                      const dup = document.getElementById('modal-duplicados-overlay');
                      const sair = document.getElementById('modal-sair-overlay');
                      if (dup && dup.classList.contains('active')) fecharModalDuplicados();
                      else if (sair && sair.classList.contains('active')) fecharModalSair();
