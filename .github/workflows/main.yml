name: Gerar APK do Karaoke

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar o arquivo ZIP automaticamente
        run: |
          sudo apt-get install -y unzip
          unzip -o *.zip
          if [ -d "FONTE-KARAOKE" ]; then
            cp -r FONTE-KARAOKE/* .
          fi
          ls -la

      - name: Aplicar correcao da intro (sem piscar tela)
        run: |
          python3 -c '
          import os

          for root, dirs, files in os.walk("."):
              if "index.html" in files:
                  p_html = os.path.join(root, "index.html")
                  with open(p_html, "r", encoding="utf-8") as f:
                      h = f.read()

                  # 1. Faz a tela iniciar preta cobrindo os botoes
                  h = h.replace("<div id=\"intro-screen\">", "<div id=\"intro-screen\" class=\"active\">")
                  h = h.replace("<source src=\"intro.mp4\" type=\"video/mp4\">", "")

                  # 2. Tira o atraso de 700ms para disparar imediatamente
                  h = h.replace("setTimeout(() => selectFolder(), 700)", "selectFolder()")

                  # 3. Seguranca: se nao houver intro ou seletor, libera a tela em 5s
                  trava_seguranca = """
                      // Seguranca: libera a tela se nao houver intro
                      setTimeout(function() {
                          var sc = document.getElementById(\"intro-screen\");
                          var vd = document.getElementById(\"intro-video\");
                          if (sc && (!vd || !vd.src || vd.paused)) {
                              sc.classList.remove(\"active\");
                          }
                      }, 5000);
                  """
                  h = h.replace("selectFolder();", "selectFolder();\n" + trava_seguranca)

                  with open(p_html, "w", encoding="utf-8") as f:
                      f.write(h)
                  print(f"[OK] index.html corrigido com sucesso em: {p_html}")
          '

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Garantir Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Compilar APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-Festa-das-Cores-v2.0
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
