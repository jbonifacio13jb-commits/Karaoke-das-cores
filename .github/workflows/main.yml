name: Gerar APK do Karaoke

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar o arquivo ZIP automaticamente
        run: |
          sudo apt-get install -y unzip
          unzip -o *.zip
          if [ -d "FONTE-KARAOKE" ]; then
            cp -r FONTE-KARAOKE/* .
          fi
          ls -la

      - name: Aplicar correcoes finais (Zero piscada, bgoficial.png, sem icone play, logo direto no video)
        run: |
          cat << 'EOF' > patch_karaoke.py
          import os, re

          def achar(nome):
              res = []
              for root, dirs, files in os.walk("."):
                  if nome in files:
                      res.append(os.path.join(root, nome))
              return res

          # ==============================================================
          # 1. MAINACTIVITY.JAVA (Multi-Intro + Delete SAF)
          # ==============================================================
          for p_java in achar("MainActivity.java"):
              with open(p_java, "r", encoding="utf-8") as f:
                  j = f.read()

              if "deleteFile" not in j:
                  metodo_delete = """
                  @JavascriptInterface public boolean deleteFile(String uriStr) {
                      try {
                          return DocumentsContract.deleteDocument(getContentResolver(), Uri.parse(uriStr));
                      } catch (Exception e) { return false; }
                  }
                  """
                  j = j.replace("public final class AndroidHost {", "public final class AndroidHost {" + metodo_delete)

              idx_inicio = j.find("if (cursor == null) return;")
              idx_fim = j.find("} catch (Exception ignored) {}", idx_inicio)
              if idx_inicio != -1 and idx_fim != -1:
                  bloco_multi_intro = """
                  java.util.List<String> intros = new java.util.ArrayList<>();
                  while (cursor.moveToNext()) {
                      String id = cursor.getString(0);
                      String name = cursor.getString(1);
                      String mime = cursor.getString(2);
                      if (name == null || Document.MIME_TYPE_DIR.equals(mime)) continue;
                      String n = name.toLowerCase();
                      if (n.equals("intro.mp4") || n.equals("intro2.mp4") || n.equals("intro3.mp4")) {
                          intros.add(DocumentsContract.buildDocumentUriUsingTree(treeUri, id).toString());
                      }
                  }
                  if (!intros.isEmpty()) {
                      int r = new java.util.Random().nextInt(intros.size());
                      final String introUri = intros.get(r);
                      runOnUiThread(new Runnable() {
                          @Override public void run() {
                              if (webView != null) webView.evaluateJavascript(
                                  "window.onIntroFoundDuringScan && window.onIntroFoundDuringScan(" + JSONObject.quote(introUri) + ")", null);
                          }
                      });
                  }
              """
                  pos_sub = idx_inicio + len("if (cursor == null) return;")
                  j = j[:pos_sub] + bloco_multi_intro + j[idx_fim:]

              with open(p_java, "w", encoding="utf-8") as f:
                  f.write(j)
              print(f"[OK] MainActivity.java: {p_java}")

          # ==============================================================
          # 2. INDEX.HTML
          # ==============================================================
          for p_html in achar("index.html"):
              with open(p_html, "r", encoding="utf-8") as f:
                  h = f.read()

              css_revisado = """
              /* BLOQUEIO TOTAL E ABSOLUTO DO PALCO */
              #ui-wrapper.oculto-inicio,
              #ui-wrapper:not(.liberado) {
                  display: none !important;
                  opacity: 0 !important;
                  visibility: hidden !important;
                  pointer-events: none !important;
              }
              #ui-wrapper.liberado {
                  display: grid !important;
                  opacity: 1 !important;
                  visibility: visible !important;
                  pointer-events: auto !important;
              }

              /* ELIMINA QUALQUER ÍCONE NATIVO DE PLAY NO VÍDEO / ANDROID WEBKIT */
              video::-webkit-media-controls,
              video::-webkit-media-controls-start-playback-button,
              video::-webkit-media-controls-play-button,
              video::-webkit-media-controls-overlay-play-button {
                  display: none !important;
                  -webkit-appearance: none !important;
                  opacity: 0 !important;
              }

              /* Botoes PARAR e LIMPAR sem icones */
              .btn-control svg { display: none !important; }
              .btn-control {
                  height: 58px !important;
                  display: flex !important;
                  align-items: center !important;
                  justify-content: center !important;
                  letter-spacing: 3px !important;
                  font-size: 15px !important;
                  font-weight: 900 !important;
                  text-align: center !important;
                  border-radius: 16px !important;
              }
              .btn-control span { font-size: 15px !important; letter-spacing: 2px !important; }

              /* Tela de Logo pos-contagem (exclusiva para logo.png) */
              #logo-tela-overlay {
                  position: absolute; inset: 0; z-index: 20000;
                  background: #000; display: none; align-items: center; justify-content: center;
                  opacity: 0; transition: opacity 0.3s ease;
              }
              #logo-tela-overlay.ativo { display: flex !important; opacity: 1 !important; }
              #logo-tela-img {
                  max-width: 75%; max-height: 75%; object-fit: contain;
                  filter: drop-shadow(0 0 35px rgba(0,255,255,0.45));
                  animation: zoomLogoAparecer 1.8s ease-out forwards;
              }
              @keyframes zoomLogoAparecer {
                  0% { transform: scale(0.92); opacity: 0.2; }
                  20% { opacity: 1; }
                  100% { transform: scale(1.03); opacity: 1; }
              }

              /* Campo de busca no Catalogo */
              .cat-busca-box { display: flex; gap: 8px; margin: 4px 0 10px; width: 100%; }
              #cat-campo-busca {
                  flex: 1; padding: 12px 18px; border-radius: 14px;
                  border: 2px solid var(--neon); background: rgba(0,0,0,0.65);
                  color: #fff; font-size: 16px; font-family: var(--font-title); font-weight: 700; outline: none;
              }
              #cat-campo-busca:focus { border-color: var(--magenta); box-shadow: 0 0 15px rgba(255,0,255,0.4); }
              #cat-btn-limpar-busca {
                  padding: 10px 18px; border-radius: 14px; border: 0; background: #333; color: #fff;
                  font-weight: 900; font-family: var(--font-title); font-size: 13px; cursor: pointer;
              }

              /* Modal de Duplicados (Codigo 0000) */
              #modal-duplicados-overlay {
                  position: fixed; inset: 0; z-index: 35000; display: none;
                  align-items: center; justify-content: center; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); padding: 20px;
              }
              #modal-duplicados-overlay.active { display: flex !important; }
              #modal-duplicados-box {
                  background: linear-gradient(160deg, #181226, #090812); border: 2px solid var(--vivid-yellow); border-radius: 20px;
                  padding: 24px; width: min(92vw, 650px); max-height: 85vh; display: flex; flex-direction: column; gap: 14px;
                  box-shadow: 0 0 40px rgba(255,221,0,0.3); color: #fff;
              }
              #modal-duplicados-titulo { font: 900 20px var(--font-title); color: var(--vivid-yellow); text-align: center; letter-spacing: 2px; }
              #modal-duplicados-lista { flex: 1; overflow-y: auto; max-height: 45vh; display: flex; flex-direction: column; gap: 8px; padding-right: 6px; }
              .item-dup { background: rgba(255,255,255,0.06); padding: 10px 14px; border-radius: 10px; border-left: 4px solid #ff4444; font-size: 13px; }
              .item-dup b { color: var(--neon); display: block; margin-bottom: 2px; }
              .item-dup small { color: #aaa; word-break: break-all; }
              .modal-dup-acoes { display: flex; gap: 10px; margin-top: 6px; }
              .modal-dup-acoes button { flex: 1; padding: 14px; border: none; border-radius: 12px; font: 800 14px var(--font-title); cursor: pointer; }
              #btn-fechar-dup { background: #333; color: #fff; }
              #btn-remover-dup { background: #ff2244; color: #fff; box-shadow: 0 0 20px rgba(255,34,68,0.5); }
              """
              h = h.replace("</style>", css_revisado + "\n</style>")

              # Bloqueia o palco diretamente na tag HTML com inline style para não piscar nunca
              h = h.replace('<div id="ui-wrapper">', '<div id="ui-wrapper" class="oculto-inicio" style="display: none !important; opacity: 0 !important; visibility: hidden !important;">')

              html_elementos = """
              <!-- TELA DE LOGO EXCLUSIVA POS-CONTAGEM (APENAS LOGO.PNG) -->
              <div id="logo-tela-overlay">
                  <img id="logo-tela-img" alt="Logo">
              </div>

              <!-- MODAL GERENCIADOR DE DUPLICADOS (CODIGO 0000) -->
              <div id="modal-duplicados-overlay">
                  <div id="modal-duplicados-box">
                      <div id="modal-duplicados-titulo">🔍 VERIFICADOR DE DUPLICADOS</div>
                      <p id="modal-duplicados-sub" style="text-align:center; font-size: 14px; color: #bbb;"></p>
                      <div id="modal-duplicados-lista"></div>
                      <div class="modal-dup-acoes">
                          <button type="button" id="btn-fechar-dup" onclick="fecharModalDuplicados()">CANCELAR</button>
                          <button type="button" id="btn-remover-dup" onclick="confirmarRemoverDuplicados()">ELIMINAR DUPLICADOS</button>
                      </div>
                  </div>
              </div>
              """
              h = h.replace("</body>", html_elementos + "\n</body>")

              # Remove SVGs dos botoes
              h = re.sub(r'(<button type="button" class="btn-control btn-parar"[^>]*>)\s*<svg[\s\S]*?</svg>', r'\1', h)
              h = re.sub(r'(<button type="button" class="btn-control btn-limpar"[^>]*>)\s*<svg[\s\S]*?</svg>', r'\1', h)

              # Barra de pesquisa no Catalogo
              h = h.replace('<div id="cat-letras"></div>', """
              <div class="cat-busca-box">
                  <input type="text" id="cat-campo-busca" placeholder="🔍 Pesquisar por música, cantor ou código..." oninput="filtrarBuscaCatalogo(this.value)">
                  <button type="button" id="cat-btn-limpar-busca" onclick="limparBuscaCatalogo()">LIMPAR</button>
              </div>
              <div id="cat-letras"></div>""")

              js_preciso = """
              let _logoUrlObrigatorio = null;
              let _bgOficialUrl = null;
              let _duplicadosEncontrados = [];

              // Localiza OBRIGATORIAMENTE logo.png e bgoficial.png na pasta
              function identificarLogoMestra(files) {
                  _logoUrlObrigatorio = null;
                  _bgOficialUrl = null;
                  for (let f of (files || [])) {
                      const nome = (f.name || '').toLowerCase();
                      const path = (f.webkitRelativePath || f.name).replace(/\\\\/g, '/');
                      const partes = path.split('/').filter(Boolean);

                      if (nome === 'logo.png' && partes.length <= 2) {
                          _logoUrlObrigatorio = f.contentUri || URL.createObjectURL(f);
                      }
                      if (nome === 'bgoficial.png') {
                          _bgOficialUrl = f.contentUri || URL.createObjectURL(f);
                      }
                  }
                  if (!_logoUrlObrigatorio) {
                      for (let f of (files || [])) {
                          if ((f.name || '').toLowerCase() === 'logo.png') {
                              _logoUrlObrigatorio = f.contentUri || URL.createObjectURL(f);
                              break;
                          }
                      }
                  }
              }

              // Exibe estritamente o logo.png pos-contagem e transiciona direto para o video
              function exibirLogoPosContagem(duracaoMs, callbackFim) {
                  const overlay = document.getElementById('logo-tela-overlay');
                  const img = document.getElementById('logo-tela-img');

                  if (!overlay || !_logoUrlObrigatorio) {
                      if (callbackFim) callbackFim();
                      return;
                  }

                  img.src = _logoUrlObrigatorio;
                  overlay.classList.add('ativo');

                  setTimeout(() => {
                      overlay.style.opacity = '0';
                      setTimeout(() => {
                          overlay.classList.remove('ativo');
                          overlay.style.opacity = '1';
                          if (callbackFim) callbackFim();
                      }, 250);
                  }, duracaoMs);
              }

              // Busca no Catalogo
              let _termoBuscaCatalogo = '';
              function filtrarBuscaCatalogo(val) {
                  _termoBuscaCatalogo = (val || '').trim().toLowerCase();
                  const barraLetras = document.getElementById('cat-letras');
                  if (barraLetras) barraLetras.style.display = _termoBuscaCatalogo ? 'none' : 'flex';
                  renderCatalogo();
              }
              function limparBuscaCatalogo() {
                  const campo = document.getElementById('cat-campo-busca');
                  if (campo) campo.value = '';
                  filtrarBuscaCatalogo('');
              }

              // MODAL DUPLICADOS (0000)
              function checarDuplicadosCodigo0000(todosArquivos) {
                  _duplicadosEncontrados = [];
                  const mapTitulos = new Map();
                  const listaArquivos = todosArquivos || [];

                  for (let f of listaArquivos) {
                      const nome = f.name || '';
                      if (!/\\\\.mp4$/i.test(nome) || nome.toLowerCase().startsWith('intro')) continue;
                      const chave = normalizarNome(descricaoDoArquivo(nome) || nome.replace(/\\\\.mp4$/i, ''));
                      if (!chave) continue;

                      if (mapTitulos.has(chave)) {
                          _duplicadosEncontrados.push({ original: mapTitulos.get(chave), duplicado: f, chave: chave });
                      } else {
                          mapTitulos.set(chave, f);
                      }
                  }

                  const modal = document.getElementById('modal-duplicados-overlay');
                  const sub = document.getElementById('modal-duplicados-sub');
                  const containerLista = document.getElementById('modal-duplicados-lista');
                  const btnRemover = document.getElementById('btn-remover-dup');

                  if (_duplicadosEncontrados.length === 0) {
                      sub.innerHTML = '<span style=\"color:#00ff88; font-weight:bold;\">PARABÉNS! Nenhum vídeo duplicado encontrado.</span><br>Sua lista está 100% limpa e otimizada.';
                      containerLista.innerHTML = '';
                      btnRemover.style.display = 'none';
                      modal.classList.add('active');
                      return;
                  }

                  sub.innerHTML = 'Encontrados <b style=\"color:#ff4444;\">' + _duplicadosEncontrados.length + '</b> vídeo(s) duplicado(s). Deseja excluí-los?';
                  btnRemover.style.display = 'block';
                  containerLista.innerHTML = _duplicadosEncontrados.map(d => `
                      <div class="item-dup">
                          <b>⚠️ MÚSICA REPETIDA:</b>
                          <div>Cópia: ${escHtml(d.duplicado.webkitRelativePath || d.duplicado.name)}</div>
                          <small>Mantendo: ${escHtml(d.original.webkitRelativePath || d.original.name)}</small>
                      </div>
                  `).join('');
                  modal.classList.add('active');
              }
              function fecharModalDuplicados() { document.getElementById('modal-duplicados-overlay').classList.remove('active'); }
              async function confirmarRemoverDuplicados() {
                  const sub = document.getElementById('modal-duplicados-sub');
                  sub.innerHTML = '<span style=\"color:#ffdd00;\">Excluindo duplicados e reiniciando karaokê...</span>';
                  let removidos = 0;
                  for (let item of _duplicadosEncontrados) {
                      if (item.duplicado.contentUri && window.AndroidHost && AndroidHost.deleteFile) {
                          try { if (AndroidHost.deleteFile(item.duplicado.contentUri)) removidos++; } catch(e) {}
                      }
                  }
                  fecharModalDuplicados();
                  mostrarAviso('✔ ' + removidos + ' vídeo(s) duplicado(s) eliminado(s)! Reiniciando...', false);
                  setTimeout(async () => {
                      if (window.AndroidHost && AndroidHost.refreshFolder) AndroidHost.refreshFolder();
                      await reproduzirCicloIntro();
                  }, 800);
              }
              """

              h = h.replace("function processarCodigo(val) {", js_preciso + """
              function processarCodigo(val) {
                  const codStr = String(val).trim();
                  if (codStr === '0000') { checarDuplicadosCodigo0000(window._arquivosCarregadosCache || []); return; }
              """)

              # Cache dos arquivos para busca de logo.png, bgoficial.png e duplicados
              h = h.replace("async function handleFolderSelect(e) {", "async function handleFolderSelect(e) {\n    window._arquivosCarregadosCache = Array.from(e.target.files); identificarLogoMestra(window._arquivosCarregadosCache);\n")

              # Injeta o filtro de busca no Catalogo
              alvo_filtro_cat = "const itens = catFiltro === 'TODAS' ? todos : todos.filter(i => inicialDaMusica(i.nome) === catFiltro);"
              subst_filtro_cat = """
                  let itens = catFiltro === 'TODAS' ? todos : todos.filter(i => inicialDaMusica(i.nome) === catFiltro);
                  if (_termoBuscaCatalogo) {
                      itens = todos.filter(i => (i.nome || '').toLowerCase().includes(_termoBuscaCatalogo) || (i.code || '').includes(_termoBuscaCatalogo));
                  }
              """
              h = h.replace(alvo_filtro_cat, subst_filtro_cat)

              # ZERA O DELAY DE 700MS: CHAMA O SELETOR DIRETO A 0MS
              h = h.replace("if (usaSeletorNativo) setTimeout(() => selectFolder(), 700);", "if (usaSeletorNativo) selectFolder();")

              # CONTAGEM REGRESSIVA: bgoficial.png SE NÃO TIVER CANTOR OU TELA PRETA PURA (SEM PISCAR BG)
              alvo_start_cross = """const nomes = [singerName, initialChar];
            for (const nome of nomes) {
                const arquivo1 = bgCantores[nome];
                const arquivo2 = bgCantores[nome + "2"];
                if (arquivo1) urls.push(arquivo1.isUrl ? arquivo1.url : (arquivo1.contentUri || URL.createObjectURL(arquivo1)));
                if (arquivo2) urls.push(arquivo2.isUrl ? arquivo2.url : (arquivo2.contentUri || URL.createObjectURL(arquivo2)));
                if (urls.length > 0) break;
            }
            iniciarCrossfade(urls);"""

              subst_start_cross = """const nomes = [singerName, initialChar];
            if (singerName && singerName !== 'CONVIDADO') {
                for (const nome of nomes) {
                    if (!nome) continue;
                    const arquivo1 = bgCantores[nome];
                    const arquivo2 = bgCantores[nome + "2"];
                    if (arquivo1) urls.push(arquivo1.isUrl ? arquivo1.url : (arquivo1.contentUri || URL.createObjectURL(arquivo1)));
                    if (arquivo2) urls.push(arquivo2.isUrl ? arquivo2.url : (arquivo2.contentUri || URL.createObjectURL(arquivo2)));
                    if (urls.length > 0) break;
                }
            }
            if (urls.length > 0) {
                iniciarCrossfade(urls);
            } else if (_bgOficialUrl) {
                iniciarCrossfade([_bgOficialUrl]);
            } else {
                pararCrossfade();
                if (mainBg) { mainBg.style.opacity = '0'; mainBg.style.visibility = 'hidden'; }
                if (bgSinger) { bgSinger.style.opacity = '0'; bgSinger.style.backgroundImage = ''; }
                if (bgSinger2) { bgSinger2.style.opacity = '0'; bgSinger2.style.backgroundImage = ''; }
            }"""
              h = h.replace(alvo_start_cross, subst_start_cross)

              # LOGO.PNG APÓS O ZERO E DIRETO PARA O VÍDEO (SEM PISCAR BG PADRÃO)
              alvo_fim_contagem = "pararCrossfade();\n            timerScreen.classList.remove('active');\n            document.body.classList.remove('countdown-ativo');"
              subst_fim_contagem = """pararCrossfade();
                          timerScreen.classList.remove('active');
                          if (mainBg) { mainBg.style.opacity = '0'; mainBg.style.visibility = 'hidden'; }
                          if (_logoUrlObrigatorio) {
                              await new Promise(resLogo => {
                                  exibirLogoPosContagem(1800, resLogo);
                              });
                          }
                          if (mainBg) { mainBg.style.opacity = '0'; mainBg.style.visibility = 'hidden'; }"""
              h = h.replace(alvo_fim_contagem, subst_fim_contagem)

              # QUANDO A INTRO TERMINA: LIBERA O PALCO PELA PRIMEIRA VEZ
              alvo_intro_fim = "introScreen.classList.remove('active');"
              novo_intro_fim = """
              introScreen.classList.remove('active');
              var ui = document.getElementById('ui-wrapper');
              if (ui) {
                  ui.classList.remove('oculto-inicio');
                  ui.classList.add('liberado');
                  ui.style.display = '';
                  ui.style.opacity = '';
                  ui.style.visibility = '';
              }
              """
              h = h.replace(alvo_intro_fim, novo_intro_fim)

              # Se a pasta nao tiver intro, libera o palco
              h = h.replace("folderLoadFinished = true;", "folderLoadFinished = true; var ui = document.getElementById('ui-wrapper'); if (ui && (!document.getElementById('intro-video') || !document.getElementById('intro-video').src || document.getElementById('intro-video').paused)) { ui.classList.remove('oculto-inicio'); ui.classList.add('liberado'); ui.style.display = ''; ui.style.opacity = ''; ui.style.visibility = ''; }")

              with open(p_html, "w", encoding="utf-8") as f:
                  f.write(h)
              print(f"[OK] index.html com correcoes finais aplicadas: {p_html}")

          EOF
          python3 patch_karaoke.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Garantir Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Compilar APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-Festa-das-Cores-v2.0
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
