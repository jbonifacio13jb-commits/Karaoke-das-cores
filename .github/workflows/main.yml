name: Gerar APK do Karaoke

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar ZIP e normalizar layout
        run: |
          sudo apt-get install -y unzip
          for f in *.zip; do
            [ -e "$f" ] || continue
            unzip -o "$f"
          done

          if [ -d "FONTE-KARAOKE" ]; then
            cp -r FONTE-KARAOKE/* .
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            for dir in */; do
              if [ -f "${dir}build.gradle" ] || [ -f "${dir}settings.gradle" ] || [ -f "${dir}build.gradle.kts" ]; then
                echo "Projeto encontrado em $dir. Movendo para raiz..."
                cp -r "${dir}"* .
                break
              fi
            done
          fi
          ls -la

      - name: Aplicar Icone Oficial
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-cairosvg python3-pil

          cat << 'PYEOF' > gerar_icone.py
          import os, re, cairosvg
          from PIL import Image

          svg_icone = """<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bgFesta" x1="15%" y1="10%" x2="85%" y2="90%">
                <stop offset="0%" stop-color="#ff007f" />
                <stop offset="45%" stop-color="#b026ff" />
                <stop offset="100%" stop-color="#3d0075" />
              </linearGradient>
              <radialGradient id="auraGlow" cx="50%" cy="45%" r="50%">
                <stop offset="0%" stop-color="#ffe600" stop-opacity="0.35" />
                <stop offset="50%" stop-color="#ff00aa" stop-opacity="0.2" />
                <stop offset="100%" stop-color="#7a00ff" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fff9d2" />
                <stop offset="25%" stop-color="#ffd700" />
                <stop offset="55%" stop-color="#d4af37" />
                <stop offset="80%" stop-color="#aa771c" />
                <stop offset="100%" stop-color="#fff2a8" />
              </linearGradient>
              <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#aa771c" />
                <stop offset="100%" stop-color="#4a3003" />
              </linearGradient>
              <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="20%" stop-color="#ffd700" />
                <stop offset="50%" stop-color="#ffaa00" />
                <stop offset="80%" stop-color="#ffd700" />
                <stop offset="100%" stop-color="#ffffff" />
              </linearGradient>
            </defs>
            <circle cx="256" cy="256" r="236" fill="url(#bgFesta)" stroke="url(#goldRim)" stroke-width="8" />
            <circle cx="256" cy="240" r="180" fill="url(#auraGlow)" />
            <ellipse cx="256" cy="425" rx="55" ry="14" fill="url(#goldDark)" />
            <ellipse cx="256" cy="420" rx="52" ry="12" fill="url(#goldGrad)" />
            <path d="M 246 360 L 266 360 L 263 420 L 249 420 Z" fill="url(#goldGrad)" stroke="url(#goldDark)" stroke-width="2" />
            <ellipse cx="256" cy="360" rx="16" ry="6" fill="#fff9d2" />
            <path d="M 175 250 C 175 355, 337 355, 337 250 C 337 245, 323 245, 323 250 C 323 335, 189 335, 189 250 Z" fill="url(#goldGrad)" stroke="#4a3003" stroke-width="1.5" />
            <circle cx="178" cy="250" r="10" fill="url(#goldGrad)" stroke="#4a3003" stroke-width="2" />
            <circle cx="334" cy="250" r="10" fill="url(#goldGrad)" stroke="#4a3003" stroke-width="2" />
            <circle cx="178" cy="250" r="4" fill="#ffffff" />
            <circle cx="334" cy="250" r="4" fill="#ffffff" />
            <g transform="translate(0, -10)">
              <path d="M 200 150 C 200 100, 312 100, 312 150 L 305 270 C 305 295, 207 295, 207 270 Z" fill="#1b0e02" />
              <path d="M 200 150 C 200 95, 312 95, 312 150 L 305 270 C 305 300, 207 300, 207 270 Z" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
              <path d="M 203 125 Q 256 132 309 125" stroke="url(#goldGrad)" stroke-width="5" fill="none" />
              <path d="M 197 145 Q 256 153 315 145" stroke="url(#goldGrad)" stroke-width="5" fill="none" />
              <path d="M 195 165 Q 256 173 317 165" stroke="url(#goldGrad)" stroke-width="5" fill="none" />
              <path d="M 194 185 Q 256 193 318 185" stroke="url(#goldGrad)" stroke-width="5" fill="none" />
              <path d="M 195 205 Q 256 213 317 205" stroke="url(#goldGrad)" stroke-width="5" fill="none" />
              <path d="M 197 225 Q 256 233 315 225" stroke="url(#goldGrad)" stroke-width="5" fill="none" />
              <path d="M 200 245 Q 256 253 312 245" stroke="url(#goldGrad)" stroke-width="5" fill="none" />
              <path d="M 205 265 Q 256 272 307 265" stroke="url(#goldGrad)" stroke-width="5" fill="none" />
              <path d="M 252 100 L 260 100 L 260 295 L 252 295 Z" fill="url(#goldGrad)" stroke="#aa771c" stroke-width="1" />
              <line x1="255" y1="102" x2="255" y2="292" stroke="#ffffff" stroke-width="2.5" opacity="0.85" />
            </g>
            <path d="M 370 120 Q 370 145 345 145 Q 370 145 370 170 Q 370 145 395 145 Q 370 145 370 120 Z" fill="#ffffff" />
            <circle cx="370" cy="145" r="4" fill="#ffd700" />
            <path d="M 135 150 Q 135 168 117 168 Q 135 168 135 186 Q 135 168 135 150 Z" fill="#ffd700" />
            <circle cx="135" cy="168" r="3" fill="#ffffff" />
            <path d="M 125 310 Q 125 322 113 322 Q 125 322 125 334 Q 125 322 137 322 Q 125 322 125 310 Z" fill="#00ffff" />
            <circle cx="395" cy="270" r="5" fill="#00f5d4" opacity="0.85" />
            <circle cx="160" cy="95" r="4" fill="#ffe600" opacity="0.8" />
            <circle cx="340" cy="350" r="4" fill="#ff00aa" opacity="0.8" />
            <circle cx="130" cy="230" r="3" fill="#ffffff" opacity="0.9" />
          </svg>"""

          cairosvg.svg2png(bytestring=svg_icone.encode('utf-8'), write_to="temp_icon.png", output_width=512, output_height=512)
          master = Image.open("temp_icon.png").convert("RGBA")

          nomes_icones = {"ic_launcher", "ic_launcher_round", "icon", "app_icon"}
          for root, dirs, files in os.walk("."):
              for f in files:
                  if f == "AndroidManifest.xml":
                      try:
                          with open(os.path.join(root, f), "r", encoding="utf-8") as mf:
                              conteudo = mf.read()
                          for m in re.findall(r'android:(?:icon|roundIcon)="@(?:mipmap|drawable)/([^"]+)"', conteudo):
                              nomes_icones.add(m)
                      except:
                          pass

          for root, dirs, files in os.walk("."):
              for f in files:
                  nome_sem_ext, ext = os.path.splitext(f)
                  if ext.lower() == ".xml" and (nome_sem_ext in nomes_icones or "anydpi" in root or "ic_launcher" in nome_sem_ext):
                      try:
                          os.remove(os.path.join(root, f))
                      except:
                          pass

          tamanhos = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for root, dirs, files in os.walk("."):
              pasta = os.path.basename(root)
              dim = None
              for dens, val in tamanhos.items():
                  if dens in pasta and ("mipmap" in pasta or "drawable" in pasta):
                      dim = val
                      break
              if dim is None and ("mipmap" in pasta or "drawable" in pasta):
                  dim = 96
              if dim is not None:
                  redim = master.resize((dim, dim), Image.Resampling.LANCZOS)
                  for iname in nomes_icones:
                      destino = os.path.join(root, f"{iname}.png")
                      redim.save(destino, "PNG")

          for root, dirs, files in os.walk("."):
              for f in files:
                  if f in ["build.gradle", "build.gradle.kts"]:
                      caminho_bg = os.path.join(root, f)
                      try:
                          with open(caminho_bg, "r", encoding="utf-8") as bg_file:
                              bg_txt = bg_file.read()
                          def inc_vc(m):
                              return f"versionCode {int(m.group(1)) + 1}"
                          new_txt = re.sub(r'versionCode\s+(\d+)', inc_vc, bg_txt)
                          if new_txt != bg_txt:
                              with open(caminho_bg, "w", encoding="utf-8") as bg_file:
                                  bg_file.write(new_txt)
                      except:
                          pass
          PYEOF
          python3 gerar_icone.py

      - name: Aplicar Correcoes (MainActivity + index.html)
        run: |
          cat << 'PYEOF' > patch_karaoke.py
          import os, re

          def achar(nome):
              res = []
              for root, dirs, files in os.walk("."):
                  if nome in files:
                      res.append(os.path.join(root, nome))
              return res

          # ==========================================================
          # 1. MAINACTIVITY.JAVA
          # ==========================================================
          for p_java in achar("MainActivity.java"):
              with open(p_java, "r", encoding="utf-8") as f:
                  j = f.read().replace("\r\n", "\n")

              if "deleteFile" not in j:
                  metodos_host = """
                  @android.webkit.JavascriptInterface public boolean deleteFile(String uriStr) {
                      try { return android.provider.DocumentsContract.deleteDocument(getContentResolver(), android.net.Uri.parse(uriStr)); }
                      catch (Exception e) { return false; }
                  }
                  @android.webkit.JavascriptInterface public void exitApp() {
                      try { MainActivity.this.runOnUiThread(new Runnable() { @Override public void run() { try { MainActivity.this.finishAffinity(); } catch(Exception ignored) {} System.exit(0); } }); }
                      catch (Exception e) { System.exit(0); }
                  }
                  @android.webkit.JavascriptInterface public void refreshFolder() {
                      try { runOnUiThread(new Runnable() { @Override public void run() { if (webView != null) webView.reload(); } }); } catch (Exception ignored) {}
                  }
                  """
                  j = j.replace("public final class AndroidHost {", "public final class AndroidHost {" + metodos_host)

              if "FLAG_HARDWARE_ACCELERATED" not in j:
                  j = j.replace("super.onCreate(savedInstanceState);", """super.onCreate(savedInstanceState);
                  try {
                      getWindow().setFlags(android.view.WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED, android.view.WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED);
                      if (webView != null) webView.setLayerType(android.view.View.LAYER_TYPE_HARDWARE, null);
                  } catch (Exception ignored) {}""")

              if "dispatchKeyEvent" not in j and "public final class AndroidHost" in j:
                  metodo_dispatch = """
                  @Override public boolean dispatchKeyEvent(android.view.KeyEvent event) {
                      try { if (webView != null && webView.dispatchKeyEvent(event)) return true; } catch (Exception ignored) {}
                      return super.dispatchKeyEvent(event);
                  }
                  """
                  j = j.replace("public final class AndroidHost {", metodo_dispatch + "\n    public final class AndroidHost {")

              if "getDefaultVideoPoster" not in j:
                  poster_override = """
                      @Override public android.graphics.Bitmap getDefaultVideoPoster() {
                          return android.graphics.Bitmap.createBitmap(1, 1, android.graphics.Bitmap.Config.ARGB_8888);
                      }
                  """
                  if "setWebChromeClient(new WebChromeClient() {" in j:
                      j = j.replace("setWebChromeClient(new WebChromeClient() {", "setWebChromeClient(new WebChromeClient() {" + poster_override)
                  elif "new WebChromeClient() {" in j:
                      j = j.replace("new WebChromeClient() {", "new WebChromeClient() {" + poster_override, 1)

              idx_inicio = j.find("if (cursor == null) return;")
              idx_fim = j.find("} catch (Exception ignored) {}", idx_inicio)
              if idx_inicio != -1 and idx_fim != -1:
                  bloco_multi_intro = """
                  java.util.List<String> intros = new java.util.ArrayList<>();
                  boolean introDisparada = false;
                  while (cursor.moveToNext()) {
                      String id = cursor.getString(0);
                      String name = cursor.getString(1);
                      String mime = cursor.getString(2);
                      if (name == null || android.provider.DocumentsContract.Document.MIME_TYPE_DIR.equals(mime)) continue;
                      String n = name.toLowerCase();
                      if (n.startsWith("intro") && n.endsWith(".mp4")) {
                          final String introUri = android.provider.DocumentsContract.buildDocumentUriUsingTree(treeUri, id).toString();
                          intros.add(introUri);
                          if (!introDisparada) {
                              introDisparada = true;
                              runOnUiThread(new Runnable() {
                                  @Override public void run() {
                                      if (webView != null) webView.evaluateJavascript(
                                          "window.onIntroFoundDuringScan && window.onIntroFoundDuringScan(" + org.json.JSONObject.quote(introUri) + ")", null);
                                  }
                              });
                          }
                      }
                  }
                  """
                  pos_sub = idx_inicio + len("if (cursor == null) return;")
                  j = j[:pos_sub] + bloco_multi_intro + j[idx_fim:]

              with open(p_java, "w", encoding="utf-8") as f:
                  f.write(j)
              print(f"[OK] MainActivity.java: {p_java}")

          # ==========================================================
          # 2. INDEX.HTML (novo layout)
          # ==========================================================
          for p_html in achar("index.html"):
              with open(p_html, "r", encoding="utf-8") as f:
                  h = f.read().replace("\r\n", "\n")

              if "function processarCodigo(code) {" not in h:
                  print(f"[AVISO] {p_html} nao e a versao nova (processarCodigo(code)). Pulando.")
                  continue

              # ---------- CSS ----------
              css = """
              #ui-wrapper.oculto-inicio, #ui-wrapper:not(.liberado) {
                  display: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important;
              }
              #ui-wrapper.liberado {
                  display: flex !important; opacity: 1 !important; visibility: visible !important; pointer-events: auto !important;
              }
              video::-webkit-media-controls,
              video::-webkit-media-controls-start-playback-button,
              video::-webkit-media-controls-play-button,
              video::-webkit-media-controls-overlay-play-button,
              video::-webkit-media-controls-panel,
              video::-webkit-media-controls-enclosure { display: none !important; -webkit-appearance: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }

              .btn-sair-transparente {
                  width: 38px; height: 38px; border-radius: 12px;
                  background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.45);
                  backdrop-filter: blur(8px); display: inline-flex; align-items: center; justify-content: center;
                  cursor: pointer; color: #fff; box-shadow: 0 0 12px rgba(212,128,255,0.35);
                  transition: all 0.2s ease; box-sizing: border-box; padding: 0;
              }
              .btn-sair-transparente:hover, .btn-sair-transparente:focus { background: rgba(176,38,255,0.35); border-color: #fff; transform: scale(1.08); outline: none; }

              button:focus-visible { outline: 3px solid #fff !important; box-shadow: 0 0 25px #fff, 0 0 35px rgba(255,255,255,0.8) !important; }

              #modal-sair-overlay { position: fixed; inset: 0; z-index: 40000; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); padding: 20px; }
              #modal-sair-overlay.active { display: flex !important; }
              #modal-sair-box { background: linear-gradient(160deg,#1f1435,#0c0817); border: 2px solid #d480ff; border-radius: 20px; padding: 24px; width: min(90vw,420px); display: flex; flex-direction: column; gap: 14px; text-align: center; box-shadow: 0 0 35px rgba(176,38,255,0.45); color: #fff; }
              #modal-sair-titulo { font: 900 20px var(--font-title); color: #d480ff; letter-spacing: 2px; }
              .modal-sair-acoes { display: flex; gap: 10px; margin-top: 10px; }
              .modal-sair-acoes button { flex: 1; padding: 12px; border: none; border-radius: 12px; font: 800 14px var(--font-title); cursor: pointer; }
              #btn-cancelar-sair { background: #333; color: #fff; }
              #btn-confirmar-sair { background: linear-gradient(135deg,#b026ff,#7a00e6); color: #fff; box-shadow: 0 0 20px rgba(176,38,255,0.6); }

              #logo-tela-overlay { position: absolute; inset: 0; z-index: 20000; background: #000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
              #logo-tela-overlay.ativo { display: flex !important; opacity: 1 !important; }
              #logo-tela-img { max-width: 75%; max-height: 75%; object-fit: contain; filter: drop-shadow(0 0 35px rgba(0,255,255,0.45)); animation: zoomLogoAparecer 1.8s ease-out forwards; }
              @keyframes zoomLogoAparecer { 0% { transform: scale(0.92); opacity: 0.2; } 20% { opacity: 1; } 100% { transform: scale(1.03); opacity: 1; } }

              #modal-duplicados-overlay { position: fixed; inset: 0; z-index: 35000; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); padding: 20px; }
              #modal-duplicados-overlay.active { display: flex !important; }
              #modal-duplicados-box { background: linear-gradient(160deg,#181226,#090812); border: 2px solid var(--vivid-yellow); border-radius: 20px; padding: 24px; width: min(92vw,650px); max-height: 85vh; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 40px rgba(255,221,0,0.3); color: #fff; }
              #modal-duplicados-titulo { font: 900 20px var(--font-title); color: var(--vivid-yellow); text-align: center; letter-spacing: 2px; }
              #modal-duplicados-lista { flex: 1; overflow-y: auto; max-height: 45vh; display: flex; flex-direction: column; gap: 8px; padding-right: 6px; }
              .item-dup { background: rgba(255,255,255,0.06); padding: 10px 14px; border-radius: 10px; border-left: 4px solid #ff4444; font-size: 13px; }
              .item-dup b { color: var(--neon); display: block; margin-bottom: 2px; }
              .item-dup small { color: #aaa; word-break: break-all; }
              .modal-dup-acoes { display: flex; gap: 10px; margin-top: 6px; }
              .modal-dup-acoes button { flex: 1; padding: 14px; border: none; border-radius: 12px; font: 800 14px var(--font-title); cursor: pointer; }
              #btn-fechar-dup { background: #333; color: #fff; }
              #btn-remover-dup { background: #ff2244; color: #fff; box-shadow: 0 0 20px rgba(255,34,68,0.5); }
              """
              h = h.replace("</style>", css + "\n</style>")

              # ---------- anti-play nos videos ----------
              h = re.sub(r'<video\b([^>]*)>', r'<video\1 playsinline webkit-playsinline preload="auto">', h)

              # ---------- bloqueio inicial (mesmo que ja exista class, garante inline style) ----------
              h = h.replace(
                  '<div id="ui-wrapper" class="oculto-inicio">',
                  '<div id="ui-wrapper" class="oculto-inicio" style="display:none;opacity:0;visibility:hidden;">'
              )

              # ---------- modais HTML ----------
              html_modais = """
              <div id="logo-tela-overlay"><img id="logo-tela-img" alt="Logo"></div>

              <div id="modal-duplicados-overlay">
                  <div id="modal-duplicados-box">
                      <div id="modal-duplicados-titulo">VERIFICADOR DE DUPLICADOS</div>
                      <p id="modal-duplicados-sub" style="text-align:center; font-size:14px; color:#bbb;"></p>
                      <div id="modal-duplicados-lista"></div>
                      <div class="modal-dup-acoes">
                          <button type="button" id="btn-fechar-dup" onclick="fecharModalDuplicados()">CANCELAR</button>
                          <button type="button" id="btn-remover-dup" onclick="confirmarRemoverDuplicados()">ELIMINAR DUPLICADOS</button>
                      </div>
                  </div>
              </div>

              <div id="modal-sair-overlay">
                  <div id="modal-sair-box">
                      <div id="modal-sair-titulo">SAIR DO KARAOKE</div>
                      <p style="font-size:14px; color:#ddd;">Tem certeza de que deseja fechar o aplicativo?</p>
                      <div class="modal-sair-acoes">
                          <button type="button" id="btn-cancelar-sair" onclick="fecharModalSair()">CONTINUAR</button>
                          <button type="button" id="btn-confirmar-sair" onclick="confirmarSairApp()">SIM, SAIR</button>
                      </div>
                  </div>
              </div>
              """
              h = h.replace("</body>", html_modais + "\n</body>")

              # ---------- JS novo (injetado antes de processarCodigo) ----------
              js_novo = """
              // ============== CACHE + LOGO + SAIR + DUPLICADOS ==============
              window._arquivosCarregadosCache = [];
              let _logoUrlObrigatorio = null;
              let _duplicadosEncontrados = [];
              let _introEmReproducao = false;

              function identificarLogoMestra(files) {
                  _logoUrlObrigatorio = null;
                  for (let f of (files || [])) {
                      const nome = (f.name || '').toLowerCase();
                      const path = f.webkitRelativePath || f.name;
                      const partes = path.split('/').filter(Boolean);
                      if (nome === 'logo.png' && partes.length <= 2) {
                          _logoUrlObrigatorio = f.contentUri || URL.createObjectURL(f);
                          return;
                      }
                  }
                  for (let f of (files || [])) {
                      if ((f.name || '').toLowerCase() === 'logo.png') {
                          _logoUrlObrigatorio = f.contentUri || URL.createObjectURL(f);
                          return;
                      }
                  }
              }

              function exibirLogoPosContagem(duracaoMs, callback) {
                  const overlay = document.getElementById('logo-tela-overlay');
                  const img = document.getElementById('logo-tela-img');
                  if (!overlay || !_logoUrlObrigatorio) { if (callback) callback(); return; }
                  img.src = _logoUrlObrigatorio;
                  overlay.classList.add('ativo');
                  setTimeout(() => {
                      overlay.style.opacity = '0';
                      setTimeout(() => { overlay.classList.remove('ativo'); overlay.style.opacity = '1'; if (callback) callback(); }, 250);
                  }, duracaoMs);
              }

              function pedirConfirmacaoSair() { document.getElementById('modal-sair-overlay').classList.add('active'); }
              function fecharModalSair() { document.getElementById('modal-sair-overlay').classList.remove('active'); }
              function confirmarSairApp() {
                  fecharModalSair();
                  if (window.AndroidHost && AndroidHost.exitApp) AndroidHost.exitApp();
                  else window.close();
              }

              function instalarBotaoSair() {
                  if (document.getElementById('btn-sair-topo-oficial')) return;
                  const header = document.querySelector('.queue-header');
                  if (!header) return;
                  const btn = document.createElement('button');
                  btn.id = 'btn-sair-topo-oficial';
                  btn.className = 'btn-sair-transparente';
                  btn.title = 'Sair do Karaoke';
                  btn.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" stroke="#ffffff" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>';
                  btn.onclick = pedirConfirmacaoSair;
                  header.style.display = 'flex';
                  header.style.alignItems = 'center';
                  header.appendChild(btn);
              }

              window.onIntroFoundDuringScan = function(uri) {
                  _introEmReproducao = true;
                  const vid = document.getElementById('intro-video');
                  const screen = document.getElementById('intro-screen');
                  if (!vid || !uri) { _introEmReproducao = false; finalizarIntro(); return; }
                  vid.src = uri;
                  vid.loop = false;
                  if (screen) { screen.classList.add('active'); screen.style.display = 'flex'; }
                  const liberar = () => { _introEmReproducao = false; finalizarIntro(); };
                  vid.ontimeupdate = function() { if (vid.currentTime >= 30) { vid.ontimeupdate = null; vid.pause(); liberar(); } };
                  vid.onended = function() { vid.ontimeupdate = null; liberar(); };
                  vid.play().catch(() => liberar());
              };

              function checarDuplicadosCodigo0000(arquivos) {
                  _duplicadosEncontrados = [];
                  const mapa = new Map();
                  for (let f of (arquivos || [])) {
                      const nome = f.name || '';
                      if (!/[.]mp4$/i.test(nome) || nome.toLowerCase().startsWith('intro')) continue;
                      const chave = chaveDeBuscaCapa(nome.replace(/[.]mp4$/i, '').replace(/^[0-9]+[ -.:)]*/i, ''));
                      if (!chave) continue;
                      if (mapa.has(chave)) _duplicadosEncontrados.push({ original: mapa.get(chave), duplicado: f });
                      else mapa.set(chave, f);
                  }
                  const sub = document.getElementById('modal-duplicados-sub');
                  const lista = document.getElementById('modal-duplicados-lista');
                  const btn = document.getElementById('btn-remover-dup');
                  if (!_duplicadosEncontrados.length) {
                      sub.innerHTML = '<span style="color:#00ff88;font-weight:bold;">Nenhum duplicado encontrado.</span>';
                      lista.innerHTML = ''; btn.style.display = 'none';
                      document.getElementById('modal-duplicados-overlay').classList.add('active');
                      return;
                  }
                  sub.innerHTML = 'Encontrados <b style="color:#ff4444;">' + _duplicadosEncontrados.length + '</b> duplicado(s).';
                  btn.style.display = 'block';
                  lista.innerHTML = _duplicadosEncontrados.map(d => `
                      <div class="item-dup">
                          <b>${escHtml(d.duplicado.name)}</b>
                          <small>Mantendo: ${escHtml(d.original.name)}</small>
                      </div>`).join('');
                  document.getElementById('modal-duplicados-overlay').classList.add('active');
              }
              function fecharModalDuplicados() { document.getElementById('modal-duplicados-overlay').classList.remove('active'); }
              async function confirmarRemoverDuplicados() {
                  document.getElementById('modal-duplicados-sub').innerHTML = '<span style="color:#ffdd00;">Excluindo...</span>';
                  let n = 0;
                  for (let d of _duplicadosEncontrados) {
                      if (d.duplicado.contentUri && window.AndroidHost && AndroidHost.deleteFile) {
                          try { if (AndroidHost.deleteFile(d.duplicado.contentUri)) n++; } catch(e) {}
                      }
                  }
                  fecharModalDuplicados();
                  setTimeout(() => { if (window.AndroidHost && AndroidHost.refreshFolder) AndroidHost.refreshFolder(); else location.reload(); }, 600);
              }

              window.addEventListener('keydown', (e) => {
                  if (/^[0-9]$/.test(e.key) && typeof adicionarDigitoTeclado === 'function' &&
                      document.getElementById('numeric-keypad-overlay') &&
                      document.getElementById('numeric-keypad-overlay').classList.contains('active')) {
                      adicionarDigitoTeclado(e.key);
