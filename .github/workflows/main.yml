              # SCRIPT DEFINITIVO DE LAYOUT, INTRO E BOTÃO SAIR COM ÍCONE DE PORTA
              js_layout_garantido = """
              let _introEmReproducao = false;

              function liberarPalcoAposIntro() {
                  const screen = document.getElementById('intro-screen') || document.querySelector('.intro-screen');
                  if (screen) {
                      screen.classList.remove('active');
                      screen.style.display = 'none';
                  }
                  const ui = document.getElementById('ui-wrapper');
                  if (ui) {
                      ui.classList.remove('oculto-inicio');
                      ui.classList.add('liberado');
                      ui.style.display = '';
                      ui.style.opacity = '';
                      ui.style.visibility = '';
                      if (typeof aplicarLayoutFestaDasCores === 'function') aplicarLayoutFestaDasCores();
                  }
              }

              // QUANDO A INTRO É ENCONTRADA: ENTRA IMEDIATAMENTE (SEM ESPERAR)
              window.onIntroFoundDuringScan = function(uri) {
                  const vid = document.getElementById('intro-video');
                  const screen = document.getElementById('intro-screen') || document.querySelector('.intro-screen');
                  if (vid && uri) {
                      _introEmReproducao = true;
                      vid.src = uri;
                      vid.loop = false;
                      if (screen) {
                          screen.classList.add('active');
                          screen.style.display = 'flex';
                          screen.style.opacity = '1';
                      }

                      // Limite de até 30 segundos
                      vid.ontimeupdate = function() {
                          if (vid.currentTime >= 30) {
                              vid.ontimeupdate = null;
                              vid.pause();
                              _introEmReproducao = false;
                              liberarPalcoAposIntro();
                          }
                      };

                      vid.onended = function() {
                          vid.ontimeupdate = null;
                          _introEmReproducao = false;
                          liberarPalcoAposIntro();
                      };

                      vid.play().catch(() => {});
                  }
              };

              function aplicarLayoutFestaDasCores() {
                  try {
                      // 1. Remove qualquer botão sair antigo solto
                      const botoes = Array.from(document.querySelectorAll('button'));
                      botoes.forEach(b => {
                          if (b.textContent.trim() === 'SAIR' || (b.className && b.className.includes('btn-sair') && b.id !== 'btn-sair-topo-oficial')) {
                              b.remove();
                          }
                      });

                      // 2. PARAR E LIMPAR COM O MOLDE DO BOTÃO CATÁLOGO
                      const btnParar = document.querySelector('.btn-parar') || Array.from(document.querySelectorAll('button')).find(b => b.textContent.includes('PARAR'));
                      const btnLimpar = document.querySelector('.btn-limpar') || Array.from(document.querySelectorAll('button')).find(b => b.textContent.includes('LIMPAR'));
                      const btnCat = document.querySelector('.btn-catalogo') || document.querySelector('[class*="catalogo"]');

                      let alturaBase = '68px';
                      let raioBase = '22px';
                      let fonteBase = '16px';
                      let familiaBase = 'var(--font-title, sans-serif)';

                      if (btnCat) {
                          const comp = window.getComputedStyle(btnCat);
                          if (comp.height && comp.height !== '0px') alturaBase = comp.height;
                          if (comp.borderRadius && comp.borderRadius !== '0px') raioBase = comp.borderRadius;
                          if (comp.fontFamily) familiaBase = comp.fontFamily;
                          if (comp.fontSize) fonteBase = comp.fontSize;
                      }

                      if (btnParar && btnLimpar) {
                          const pai = btnParar.parentElement;
                          if (pai) {
                              pai.style.width = '100%';
                              pai.style.maxWidth = '100%';
                              pai.style.display = 'flex';
                              pai.style.flexDirection = 'row';
                              pai.style.gap = '14px';
                              pai.style.boxSizing = 'border-box';
                              pai.style.padding = '0';
                              pai.style.marginTop = 'auto';
                          }
                          [btnParar, btnLimpar].forEach(b => {
                              b.style.flex = '1 1 0%';
                              b.style.width = '50%';
                              b.style.minWidth = '0';
                              b.style.height = alturaBase;
                              b.style.borderRadius = raioBase;
                              b.style.fontFamily = familiaBase;
                              b.style.fontWeight = '900';
                              b.style.fontSize = fonteBase;
                              b.style.letterSpacing = '2px';
                              b.style.textTransform = 'uppercase';
                              b.style.border = 'none';
                              b.style.display = 'flex';
                              b.style.alignItems = 'center';
                              b.style.justifyContent = 'center';
                              b.style.color = '#ffffff';
                              b.setAttribute('tabindex', '0');
                          });
                          // PARAR: Laranja 3D Glossy
                          btnParar.style.background = 'linear-gradient(180deg, #ff9e1b 0%, #f97316 55%, #c2410c 100%)';
                          btnParar.style.boxShadow = '0 8px 25px rgba(249, 115, 22, 0.45), inset 0 2px 3px rgba(255,255,255,0.5), inset 0 -3px 4px rgba(0,0,0,0.35)';
                          
                          // LIMPAR: Vermelho 3D Glossy
                          btnLimpar.style.background = 'linear-gradient(180deg, #ff2e51 0%, #ef4444 55%, #b91c1c 100%)';
                          btnLimpar.style.boxShadow = '0 8px 25px rgba(239, 68, 68, 0.45), inset 0 2px 3px rgba(255,255,255,0.5), inset 0 -3px 4px rgba(0,0,0,0.35)';
                      }

                      // 3. BOTÃO SAIR TRANSPARENTE COM ÍCONE DE PORTA AO LADO DO CONTADOR
                      if (!document.getElementById('btn-sair-topo-oficial')) {
                          const btnSair = document.createElement('button');
                          btnSair.id = 'btn-sair-topo-oficial';
                          btnSair.className = 'btn-sair-transparente';
                          btnSair.setAttribute('tabindex', '0');
                          btnSair.setAttribute('title', 'Sair do Karaokê');
                          // ÍCONE DE PORTA DE SAÍDA VETORIAL
                          btnSair.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" stroke="#ffffff" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>';
                          btnSair.onclick = pedirConfirmacaoSair;

                          // Localiza o contador da fila
                          const elementos = Array.from(document.querySelectorAll('*'));
                          const contador = document.querySelector('[class*="contador"], [class*="badge"], #badge-contador, .badge')
                                         || elementos.find(el => (el.id && el.id.includes('contador')) || (el.className && typeof el.className === 'string' && el.className.includes('contador')))
                                         || elementos.find(el => el.textContent.trim() === '0' && el.children.length === 0 && el.closest && !el.closest('#teclado') && !el.closest('.teclado') && !el.closest('.keypad'));

                          if (contador && contador.parentElement) {
                              const pai = contador.parentElement;
                              pai.style.display = 'flex';
                              pai.style.alignItems = 'center';
                              pai.style.justifyContent = 'flex-end';
                              pai.style.gap = '12px';
                              contador.insertAdjacentElement('afterend', btnSair);
                          } else {
                              btnSair.style.position = 'fixed';
                              btnSair.style.top = '14px';
                              btnSair.style.right = '14px';
                              btnSair.style.zIndex = '99999';
                              document.body.appendChild(btnSair);
                          }
                      }
                  } catch(e) { console.error('Erro ao ajustar layout:', e); }
              }

              window.addEventListener('DOMContentLoaded', aplicarLayoutFestaDasCores);
              window.addEventListener('load', () => {
                  aplicarLayoutFestaDasCores();
                  setTimeout(aplicarLayoutFestaDasCores, 800);
              });

              // SUPORTE A CONTROLE REMOTO TV / TECLADO BLUETOOTH / TECLADO USB
              window.addEventListener('keydown', (e) => {
                  if (/^[0-9]$/.test(e.key)) {
                      if (typeof digitarNumero === 'function') digitarNumero(e.key);
                      else if (typeof handleKeypad === 'function') handleKeypad(e.key);
                  }
                  if (e.key === 'Escape' || e.key === 'GoBack' || e.keyCode === 27 || e.keyCode === 4) {
                      const modSair = document.getElementById('modal-sair-overlay');
                      const modDup = document.getElementById('modal-duplicados-overlay');
                      if (modDup && modDup.classList.contains('active')) fecharModalDuplicados();
                      else if (modSair && modSair.classList.contains('active')) fecharModalSair();
