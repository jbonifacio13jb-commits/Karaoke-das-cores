      - name: Descompactar ZIP e normalizar layout
        run: |
          sudo apt-get install -y unzip
          for f in *.zip; do [ -e "$f" ] || continue; unzip -o "$f"; done
          if [ -d "FONTE-KARAOKE" ]; then cp -r FONTE-KARAOKE/* .; fi
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            for dir in */; do
              if [ -f "${dir}build.gradle" ] || [ -f "${dir}settings.gradle" ]; then cp -r "${dir}"* .; break; fi
            done
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Garantir Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper --gradle-version 8.11.1; fi
          chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-Festa-das-Cores
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
