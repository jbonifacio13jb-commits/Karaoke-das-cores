name: Gerar APK do Karaoke

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar ZIP
        run: |
          sudo apt-get install -y unzip
          for f in *.zip; do
            if [ -e "$f" ]; then unzip -o "$f"; fi
          done
          if [ -d "FONTE-KARAOKE" ]; then cp -r FONTE-KARAOKE/* .; fi

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Garantir Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper --gradle-version 8.11.1; fi
          chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Karaoke-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
