<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KARAOKÊ FESTA DAS CORES</title>
<style>
:root{--neon:#00ffff;--magenta:#ff00ff;--vivid-yellow:#ffdd00;--emerald:#00ff88;--bg:#050508;--panel:#0d0d14}
*{box-sizing:border-box;user-select:none;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:var(--bg);color:#fff;height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column}
#ui-wrapper{display:none;flex-direction:column;height:100vh}
#ui-wrapper.liberado{display:flex}
.stage{height:320px;width:100%;position:relative;background:#000;overflow:hidden;border-bottom:3px solid var(--vivid-yellow);flex-shrink:0}
body.fullscreen-mode .stage{height:100vh!important;width:100vw!important;position:fixed;top:0;left:0;z-index:9999}
.stage-background{position:absolute;inset:0;background-size:cover;background-position:center;z-index:1;opacity:.7}
#bg-singer-layer{position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat;z-index:2;opacity:0;transition:opacity .4s}
#video-player{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:100;display:none}
#timer-screen{position:absolute;inset:0;z-index:10000;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#timer-screen.active{display:flex}
#countdown-num{position:absolute;top:20px;right:20px;color:rgba(255,220,0,.9);font:900 100px Arial;text-shadow:0 0 20px rgba(255,220,0,.5)}
#song-display{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);width:90%;font-size:18px;text-align:center;color:var(--vivid-yellow);text-shadow:0 2px 6px #000;line-height:1.4}
#stage-bottom-bar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:95%;display:flex;gap:8px;z-index:99;background:rgba(0,0,0,.7);padding:8px;border-radius:40px;border:1px solid rgba(255,255,255,.2)}
.btn-bar{background:rgba(255,255,255,.1);border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px}
#stage-progress-container{flex:1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);padding:0 15px;border-radius:20px}
#stage-progress-bar-bg{flex:1;height:6px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}
#stage-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--neon),var(--magenta))}
#stage-time-remaining{font-size:12px;color:var(--vivid-yellow);font-weight:bold}
#marquee-container{position:absolute;top:0;left:0;width:100%;background:rgba(0,0,0,.5);padding:8px;z-index:99;overflow:hidden;border-bottom:1px solid rgba(255,221,0,.4)}
#marquee-text{white-space:nowrap;color:var(--vivid-yellow);animation:mq 20s linear infinite;font-weight:bold;font-size:14px}
@keyframes mq{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.search-bar{background:#0a0a10;padding:12px;display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;border-top:1px solid #222}
.search-bar button{height:55px;border-radius:15px;border:none;font-weight:bold;color:#fff;cursor:pointer;text-transform:uppercase}
#btn-teclado{background:linear-gradient(180deg,#ff44ff,#b300b3)}
#btn-catalogo{background:linear-gradient(180deg,#29e7ff,#0099cc);color:#04202b}
#btn-play-bar{background:linear-gradient(180deg,#00ff99,#00aa55);color:#001a0d;font-size:16px}
#btn-play-bar:disabled{opacity:.4}
.ui-panel{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px;overflow:hidden;background:var(--panel)}
.queue-header{display:flex;justify-content:space-between;align-items:center}
.queue-header h3{color:var(--neon);font-size:14px}
#queue-count-badge{background:var(--magenta);padding:2px 10px;border-radius:10px;font-weight:bold;font-size:12px}
.controls-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-parar,.btn-limpar{height:55px;border-radius:15px;border:none;color:#fff;font-weight:bold;cursor:pointer}
.btn-parar{background:linear-gradient(180deg,#ff9e1b,#c2410c)}
.btn-limpar{background:linear-gradient(180deg,#ff2e51,#b91c1c)}
#track-list{flex:1;overflow-y:auto;background:rgba(0,0,0,.6);border-radius:12px;padding:8px;border:1px solid #222}
.item{background:rgba(255,255,255,.05);padding:12px;border-radius:10px;margin-bottom:8px;border-left:4px solid var(--magenta)}
.item.now-playing{background:rgba(0,255,136,.15);border-left-color:var(--emerald)}
.item-title{font-weight:bold;font-size:14px;margin-bottom:4px}
.item-meta{font-size:12px;display:flex;gap:10px}
.item-singer{color:var(--vivid-yellow)}
.item-code{color:var(--neon)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal-box{background:var(--panel);border:2px solid var(--vivid-yellow);border-radius:20px;padding:20px;width:100%;max-width:400px;text-align:center}
.modal-box input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin:10px 0;font-size:16px}
.modal-box button{padding:12px;border-radius:10px;border:none;font-weight:bold;cursor:pointer;width:100%;margin-top:5px}
.btn-modal-ok{background:var(--emerald);color:#000}
.btn-modal-cancel{background:#333;color:#fff}
#catalogo-box{background:#0f0d2a;border:1px solid var(--neon);border-radius:20px;width:100%;max-width:600px;max-height:80vh;display:flex;flex-direction:column;padding:20px;gap:10px}
#cat-lista{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.cat-item{display:flex;gap:15px;padding:12px;background:rgba(255,255,255,.05);border-radius:10px;border:none;color:#fff;cursor:pointer;text-align:left;width:100%}
#cat-campo-busca{width:100%;padding:12px;border-radius:10px;border:1px solid var(--neon);background:#000;color:#fff}
#start-screen{position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
#intro-screen{position:fixed;inset:0;background:#000;z-index:99998;display:none;align-items:center;justify-content:center}
#intro-screen.active{display:flex}
#intro-video{width:100%;height:100%;object-fit:cover}
#logo-tela-overlay{position:absolute;inset:0;background:#000;z-index:20000;display:none;align-items:center;justify-content:center}
#logo-tela-img{max-width:80%;max-height:80%;object-fit:contain}
</style>
</head>
<body>

<div id="start-screen">
    <h1 style="color:var(--neon); text-align:center;">KARAOKÊ FESTA DAS CORES</h1>
    <button onclick="iniciarApp()" style="padding:20px 40px;font-size:20px;background:var(--emerald);border:none;border-radius:15px;font-weight:bold;color:#000;cursor:pointer">SELECIONAR PASTA E INICIAR</button>
</div>

<div id="intro-screen"><video id="intro-video" playsinline webkit-playsinline autoplay></video></div>

<div id="ui-wrapper">
<div class="stage">
<div class="stage-background" id="main-bg"></div>
<div id="bg-singer-layer"></div>
<video id="video-player" playsinline webkit-playsinline></video>
<div id="marquee-container"><div id="marquee-text">★ KARAOKÊ FESTA DAS CORES ★</div></div>
<div id="stage-bottom-bar">
<button class="btn-bar" onclick="document.documentElement.requestFullscreen()">🖥️</button>
<div id="stage-progress-container"><div id="stage-progress-bar-bg"><div id="stage-progress-fill"></div></div><div id="stage-time-remaining">-00:00</div></div>
<button class="btn-bar" onclick="pularMusica()">⏭</button>
</div>
<div id="timer-screen"><div id="song-display"></div><div id="countdown-num">5</div></div>
</div>

<div class="search-bar">
<button id="btn-teclado" onclick="abrirTeclado()">CÓDIGO</button>
<button id="btn-catalogo" onclick="abrirCatalogo()">CATÁLOGO</button>
<button id="btn-play-bar" onclick="startPlaylist()" disabled>INICIAR SHOW</button>
</div>

<div class="ui-panel">
<div class="queue-header"><h3>🎵 FILA DE MÚSICAS</h3><div id="queue-count-badge">0</div></div>
<div class="controls-grid"><button class="btn-parar" onclick="pararTudo()">PARAR</button><button class="btn-limpar" onclick="limparFila()">LIMPAR</button></div>
<div id="track-list"></div>
</div>
</div>

<div id="numeric-keypad-overlay" class="modal-overlay">
<div class="modal-box">
<h3>DIGITE O CÓDIGO</h3>
<div id="keypad-code" style="font-size:24px;color:var(--vivid-yellow);margin:10px 0">—</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px">
<button onclick="addDigito('1')">1</button><button onclick="addDigito('2')">2</button><button onclick="addDigito('3')">3</button>
<button onclick="addDigito('4')">4</button><button onclick="addDigito('5')">5</button><button onclick="addDigito('6')">6</button>
<button onclick="addDigito('7')">7</button><button onclick="addDigito('8')">8</button><button onclick="addDigito('9')">9</button>
<button onclick="limparDigito()">C</button><button onclick="addDigito('0')">0</button><button onclick="confirmarCodigo()">OK</button>
</div>
<button class="btn-modal-cancel" style="margin-top:10px" onclick="fecharTeclado()">FECHAR</button>
</div>
</div>

<div id="modal-cantor-overlay" class="modal-overlay">
<div class="modal-box">
<h3>CÓDIGO ENCONTRADO</h3>
<div id="modal-musica-nome" style="font-size:14px;margin:10px 0"></div>
<input type="text" id="input-cantor" placeholder="Quem canta?">
<button class="btn-modal-ok" onclick="confirmarCantor()">CONFIRMAR</button>
<button class="btn-modal-cancel" onclick="fecharModalCantor()">CANCELAR</button>
</div>
</div>

<div id="catalogo-overlay" class="modal-overlay">
<div id="catalogo-box">
<div style="display:flex;justify-content:space-between;align-items:center"><h2>CATÁLOGO</h2><button onclick="fecharCatalogo()" style="background:var(--magenta);color:#fff;border:none;padding:8px 15px;border-radius:10px;font-weight:bold">FECHAR</button></div>
<input type="text" id="cat-campo-busca" placeholder="Pesquisar..." oninput="renderCatalogo(this.value)">
<div id="cat-lista"></div>
</div>
</div>

<div id="logo-tela-overlay"><img id="logo-tela-img"></div>
<input type="file" id="f-folder" webkitdirectory directory multiple style="display:none">

<script>
let player, videoFiles={}, catalog=[], queue=[], imagensIndex={}, capasCantor={}, bgsPadrao={};
let codigoTeclado='', modalTempCode=null, modalTempFile=null, modalTempNome=null, _logoUrl=null;

function log(m){console.log('[OK] '+m)}

window.onload = () => {
    player = document.getElementById('video-player');
    document.getElementById('f-folder').addEventListener('change', handleFolder);
    player.onended = () => { fecharVideo(); queue.shift(); renderFila(); if(queue.length) setTimeout(startPlaylist, 800); };
    player.ontimeupdate = updateProgress;
};

function iniciarApp(){
    // 1. Abre a pasta (Requer clique do usuário, o que temos agora)
    document.getElementById('f-folder').click();
    
    // 2. Toca a Intro
    let intro = videoFiles['INTRO'];
    let tela = document.getElementById('intro-screen');
    let vid = document.getElementById('intro-video');
    document.getElementById('start-screen').style.display = 'none';
    
    if(intro){
        tela.classList.add('active');
        vid.src = intro.contentUri || URL.createObjectURL(intro);
        vid.play().then(() => { vid.onended = liberarApp; }).catch(liberarApp);
    } else { liberarApp(); }
}

function liberarApp(){
    document.getElementById('intro-screen').classList.remove('active');
    document.getElementById('ui-wrapper').classList.add('liberado');
}

function handleFolder(e){
    const files = Array.from(e.target.files);
    videoFiles = {}; catalog=[]; imagensIndex={}; capasCantor={}; bgsPadrao={};
    for(let f of files){
        let name = f.name.toUpperCase();
        let path = (f.webkitRelativePath || f.name).toUpperCase();
        if(name.endsWith('.MP4')){
            if(name.includes('INTRO')){ videoFiles['INTRO'] = f; continue; }
            let m = name.match(/(\d+)/);
            let code = m ? m[1].padStart(4,'0') : String(Object.keys(videoFiles).length+1).padStart(4,'0');
            videoFiles[code] = f;
            catalog.push({code, nome: f.name.replace(/\.mp4/i, '')});
        } else if(/\.(PNG|JPE?G)$/i.test(name)){
            let base = f.name.replace(/\.(png|jpe?g)$/i,'');
            let key = base.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
            imagensIndex[key] = f;
            if(name === 'LOGO.PNG' && !path.includes('/')) _logoUrl = f.contentUri || URL.createObjectURL(f);
            
            let parts = path.split(/[\/\\]/);
            if(parts.includes('CAPAS')) capasCantor[key] = f;
            if(parts.includes('BGS')) bgsPadrao[key] = f;
        }
    }
    document.getElementById('btn-play-bar').disabled = Object.keys(videoFiles).length === 0;
    log(`${Object.keys(videoFiles).length} vídeos, ${Object.keys(capasCantor).length} capas, ${Object.keys(bgsPadrao).length} bgs`);
}

function buscarCapaCantor(cantor){
    if(!cantor) return null;
    let key = cantor.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
    if(capasCantor[key]) return capasCantor[key];
    for(let k in capasCantor) if(k.includes(key) || key.includes(k)) return capasCantor[k];
    return null;
}

function buscarBgPadrao(){
    let keys = ['BG PRINCIPAL', 'BGPRINCIPAL', 'BGOFICIAL'];
    for(let k of keys) if(bgsPadrao[k]) return bgsPadrao[k];
    for(let k in bgsPadrao) if(k.startsWith('BG')) return bgsPadrao[k];
    return null;
}

// ============ LÓGICA DE INÍCIO DA FAIXA ============
async function startPlaylist(){
    if(!queue.length || player.style.display === 'block') return;
    let cur = queue[0];
    
    // 1. Busca imagem (Capa do cantor ou BG Padrão)
    let img = buscarCapaCantor(cur.cantor) || buscarBgPadrao();
    let bgLayer = document.getElementById('bg-singer-layer');
    if(img){
        bgLayer.style.backgroundImage = `url("${img.contentUri || URL.createObjectURL(img)}")`;
        bgLayer.style.opacity = '1';
    } else { bgLayer.style.opacity = '0'; }

    // 2. Contagem
    document.body.classList.add('countdown-ativo');
    document.getElementById('song-display').innerHTML = `${cur.nome}<br><span style="color:var(--emerald);font-size:16px">🎤 ${cur.cantor}</span>`;
    document.getElementById('timer-screen').classList.add('active');
    let num = document.getElementById('countdown-num');
    for(let i=5; i>=1; i--){ num.innerText = i; await new Promise(r=>setTimeout(r,1000)); }
    
    // 3. Logo e Play
    bgLayer.style.opacity = '0';
    document.getElementById('timer-screen').classList.remove('active');
    document.body.classList.remove('countdown-ativo');
    
    if(_logoUrl){
        let logoOverlay = document.getElementById('logo-tela-overlay');
        document.getElementById('logo-tela-img').src = _logoUrl;
        logoOverlay.style.display = 'flex';
        await new Promise(r=>setTimeout(r,1500));
        logoOverlay.style.display = 'none';
    }

    player.src = cur.file.contentUri || URL.createObjectURL(cur.file);
    player.style.display = 'block';
    player.play().catch(()=>{});
    renderFila();
}

function fecharVideo(){
    player.pause(); player.src = ''; player.style.display = 'none';
    document.getElementById('stage-progress-fill').style.width = '0%';
    document.getElementById('stage-time-remaining').innerText = '-00:00';
}
function updateProgress(){
    if(!player.duration) return;
    let cur = player.currentTime, dur = player.duration, rem = Math.max(0, dur-cur);
    document.getElementById('stage-progress-fill').style.width = (cur/dur)*100 + '%';
    document.getElementById('stage-time-remaining').innerText = `-${Math.floor(rem/60).toString().padStart(2,'0')}:${Math.floor(rem%60).toString().padStart(2,'0')}`;
}

// ============ TECLADO ============
function abrirTeclado(){ codigoTeclado=''; document.getElementById('keypad-code').innerText='—'; document.getElementById('numeric-keypad-overlay').classList.add('active'); }
function addDigito(d){ if(codigoTeclado.length<10){ codigoTeclado+=d; document.getElementById('keypad-code').innerText=codigoTeclado; } }
function limparDigito(){ codigoTeclado=''; document.getElementById('keypad-code').innerText='—'; }
function fecharTeclado(){ document.getElementById('numeric-keypad-overlay').classList.remove('active'); }
function confirmarCodigo(){
    let code = codigoTeclado.padStart(4,'0');
    if(videoFiles[code]){ fecharTeclado(); abrirModalCantor(code); }
    else { alert('Código não encontrado!'); }
}

// ============ CATÁLOGO ============
function abrirCatalogo(){ document.getElementById('catalogo-overlay').classList.add('active'); renderCatalogo(''); }
function fecharCatalogo(){ document.getElementById('catalogo-overlay').classList.remove('active'); }
function renderCatalogo(termo){
    termo = termo.toLowerCase();
    let lista = document.getElementById('cat-lista');
    let itens = catalog.filter(c => c.nome.toLowerCase().includes(termo) || c.code.includes(termo));
    lista.innerHTML = itens.map(i => `<button class="cat-item" onclick="fecharCatalogo(); abrirModalCantor('${i.code}')"><b>#${i.code}</b> - ${i.nome}</button>`).join('');
}

// ============ FILA ============
function abrirModalCantor(code){
    modalTempCode = code;
    modalTempFile = videoFiles[code];
    modalTempNome = catalog.find(c=>c.code === code).nome;
    document.getElementById('modal-musica-nome').innerText = `#${code} - ${modalTempNome}`;
    document.getElementById('input-cantor').value = '';
    document.getElementById('modal-cantor-overlay').classList.add('active');
}
function fecharModalCantor(){ document.getElementById('modal-cantor-overlay').classList.remove('active'); }
function confirmarCantor(){
    let cantor = document.getElementById('input-cantor').value.trim().toUpperCase() || 'CONVIDADO';
    queue.push({ code: modalTempCode, nome: modalTempNome, cantor: cantor, file: modalTempFile });
    fecharModalCantor(); renderFila();
}
function renderFila(){
    let playing = player.style.display === 'block';
    let list = document.getElementById('track-list');
    if(!queue.length) list.innerHTML = '<div style="text-align:center;padding:20px;color:#666">FILA VAZIA</div>';
    else list.innerHTML = queue.map((i,idx) => `
        <div class="item ${idx===0 && playing ? 'now-playing' : ''}">
            <div class="item-title">${i.nome}</div>
            <div class="item-meta"><span class="item-singer">🎤 ${i.cantor}</span><span class="item-code">#${i.code}</span></div>
        </div>
    `).join('');
    document.getElementById('queue-count-badge').innerText = playing ? Math.max(0, queue.length-1) : queue.length;
}
function pararTudo(){ fecharVideo(); queue=[]; renderFila(); }
function limparFila(){ queue=[]; renderFila(); }
function pularMusica(){ if(queue.length) player.dispatchEvent(new Event('ended')); }
</script>
</body>
</html>
