<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VIDEOKE SHOW</title>
  <style>
    :root {
      --bg-dark: #070913;
      --panel-bg: rgba(12, 16, 32, 0.9);
      --gold: #ffd43b;
      --cyan: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text);
      font-family: Consolas, "Courier New", monospace, sans-serif;
    }

    #vsk-bg {
      position: fixed;
      inset: 0;
      background-color: var(--bg-dark);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
    }

    #vsk-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
      z-index: 5;
    }

    #vsk-hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 12px;
    }

    .hud-interactive {
      pointer-events: auto;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      position: relative;
    }

    .btn {
      background: var(--panel-bg);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 8px;
      height: 36px;
      padding: 0 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex: 1 1 0;
      min-width: 0;
    }

    .btn:hover, .btn:focus {
      outline: 2px solid var(--cyan);
      border-color: var(--cyan);
    }

    .btn-gold { border-color: var(--gold); color: var(--gold); }
    .btn-green { border-color: var(--green); color: var(--green); }
    .btn-cyan { border-color: var(--cyan); color: var(--cyan); }
    .btn-red { border-color: var(--red); color: var(--red); }

    .btn-queue {
      flex: 1.6 1 0;
    }

    .btn-exit-icon {
      flex: 0 0 36px;
      width: 36px;
      padding: 0;
      font-size: 15px;
    }

    #vsk-queue-dropdown {
      display: none;
      position: absolute;
      top: 42px;
      right: 42px;
      width: 360px;
      max-width: 75vw;
      max-height: 55vh;
      overflow-y: auto;
      background: var(--panel-bg);
      border: 1px solid var(--cyan);
      border-radius: 10px;
      padding: 8px;
      z-index: 25;
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
    }

    #vsk-queue-dropdown.open {
      display: block;
    }

    .q-item {
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--cyan);
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 5px;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .q-item.playing {
      border-left-color: var(--gold);
      background: rgba(255, 212, 59, 0.14);
      color: var(--gold);
      font-weight: bold;
    }

    .q-empty {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 8px 4px;
    }

    #vsk-qr-box {
      display: none;
      text-align: center;
      padding: 6px 0 2px;
    }

    #vsk-qr-box.visible { display: block; }

    #vsk-qr-img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
      padding: 4px;
    }

    .bottom-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel-bg);
      padding: 6px 12px;
      border-radius: 8px;
    }

    #vsk-progress-bar {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      overflow: hidden;
      cursor: pointer;
    }

    #vsk-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
    }

    #vsk-time {
      font-size: 12px;
      color: var(--gold);
      min-width: 52px;
      text-align: right;
    }

    .marquee-wrap {
      overflow: hidden;
      white-space: nowrap;
      background: var(--panel-bg);
      border-radius: 8px;
      padding: 6px 12px;
      border: 1px solid rgba(255, 212, 59, 0.25);
    }

    #vsk-marquee {
      display: inline-block;
      font-size: 12px;
      font-weight: bold;
      color: var(--gold);
    }

    #vsk-countdown, #vsk-score-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 8, 18, 0.9);
      text-align: center;
      padding: 20px;
    }

    #vsk-countdown.active, #vsk-score-overlay.active { display: flex; }

    #vsk-default-logo {
      max-width: 240px;
      max-height: 120px;
      object-fit: contain;
      margin-bottom: 12px;
      display: none;
    }

    #vsk-artist-cover {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid var(--gold);
      margin-bottom: 12px;
      display: none;
    }

    #vsk-count-num, #score-number {
      font-size: 76px;
      font-weight: bold;
      color: var(--gold);
      line-height: 1;
    }

    #vsk-count-info, #score-msg {
      font-size: 18px;
      margin-top: 10px;
      color: var(--text);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.8);
      padding: 16px;
    }

    .modal.active { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 540px;
      max-height: 86vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #0d1326;
      border: 2px solid var(--cyan);
      border-radius: 14px;
      padding: 16px;
      gap: 12px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--gold);
    }

    .numpad-display {
      background: #060913;
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .numpad-code {
      font-size: 28px;
      font-weight: bold;
      color: var(--gold);
      letter-spacing: 3px;
    }

    .numpad-preview {
      font-size: 12px;
      color: var(--cyan);
      min-height: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .numpad-key {
      height: 46px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: #121b34;
      color: var(--text);
      font-family: inherit;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .numpad-key:hover, .numpad-key:focus {
      border-color: var(--gold);
      color: var(--gold);
      outline: 2px solid var(--gold);
    }

    .input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: #060913;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
    }

    .input:focus {
      outline: 2px solid var(--gold);
      border-color: var(--gold);
    }

    #cat-results {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 52vh;
    }

    .cat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .cat-row:hover, .cat-row:focus, .cat-row.selected {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--gold);
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    #vsk-folder-input { display: none; }
  </style>
</head>
<body>
  <div id="vsk-bg"></div>
  <video id="vsk-video" playsinline></video>

  <div id="vsk-hud">
    <div class="top-bar hud-interactive">
      <button class="btn btn-gold" onclick="abrirTecladoCodigo()">CODIGO</button>
      <button class="btn" onclick="abrirCatalogoVsk()">CATÁLOGO</button>
      <button class="btn btn-green" onclick="vskStart()">INICIAR</button>
      <button class="btn" onclick="vskSkip()">PULAR</button>
      <button class="btn" onclick="vskStop()">PARAR</button>
      <button class="btn" onclick="vskClear()">LIMPAR FILA</button>
      <button id="vsk-btn-queue" class="btn btn-cyan btn-queue" onclick="alternarFilaDropdown()">FILA DE MÚSICAS (<span id="vsk-q-count">0</span>)</button>
      <button id="vsk-btn-exit" class="btn btn-red btn-exit-icon" title="SAIR" aria-label="SAIR">⏻</button>

      <div id="vsk-queue-dropdown">
        <div id="vsk-queue-items"></div>
        <div id="vsk-qr-box">
          <img id="vsk-qr-img" alt="QR Lista" />
        </div>
      </div>
    </div>

    <div class="bottom-bar hud-interactive">
      <div class="progress-row">
        <div id="vsk-progress-bar">
          <div id="vsk-progress-fill"></div>
        </div>
        <div id="vsk-time">-00:00</div>
      </div>
      <div class="marquee-wrap">
        <div id="vsk-marquee">★ VIDEOKE SHOW ★ AGUARDANDO SELEÇÃO DE MÚSICAS ★</div>
      </div>
    </div>
  </div>

  <div id="vsk-countdown">
    <img id="vsk-default-logo" src="logo.png" alt="Logo" />
    <img id="vsk-artist-cover" alt="Capa do Artista" />
    <div id="vsk-count-num">5</div>
    <div id="vsk-count-info"></div>
  </div>

  <div id="vsk-score-overlay">
    <div id="score-number">95</div>
    <div id="score-msg">MUITO BOM! PARABÉNS PELA APRESENTAÇÃO!</div>
  </div>

  <div id="modal-numpad" class="modal">
    <div class="modal-card">
      <div class="modal-title">DIGITAR CÓDIGO</div>
      <div class="numpad-display">
        <div id="numpad-code" class="numpad-code">----</div>
        <div id="numpad-preview" class="numpad-preview">Digite os números do código</div>
      </div>
      <div class="numpad-grid">
        <button class="numpad-key" onclick="teclaNumpad('1')">1</button>
        <button class="numpad-key" onclick="teclaNumpad('2')">2</button>
        <button class="numpad-key" onclick="teclaNumpad('3')">3</button>
        <button class="numpad-key" onclick="teclaNumpad('4')">4</button>
        <button class="numpad-key" onclick="teclaNumpad('5')">5</button>
        <button class="numpad-key" onclick="teclaNumpad('6')">6</button>
        <button class="numpad-key" onclick="teclaNumpad('7')">7</button>
        <button class="numpad-key" onclick="teclaNumpad('8')">8</button>
        <button class="numpad-key" onclick="teclaNumpad('9')">9</button>
        <button class="numpad-key" onclick="limparNumpad()">LIMPAR</button>
        <button class="numpad-key" onclick="teclaNumpad('0')">0</button>
        <button class="numpad-key" style="color:var(--green);border-color:var(--green)" onclick="confirmarNumpad()">OK</button>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="fecharTecladoCodigo()">FECHAR</button>
      </div>
    </div>
  </div>

  <div id="modal-singer" class="modal">
    <div class="modal-card">
      <div class="modal-title">NOME DO CANTOR</div>
      <div id="singer-song-title" style="color: var(--cyan); font-size: 14px;"></div>
      <input id="singer-name-input" class="input" type="text" placeholder="Digite o nome do cantor (ou deixe em branco)" maxlength="40" />
      <div class="modal-actions">
        <button class="btn" onclick="fecharModalCantorVsk()">CANCELAR</button>
        <button class="btn btn-green" onclick="confirmarCantorVsk()">CONFIRMAR</button>
      </div>
    </div>
  </div>

  <div id="modal-cat" class="modal">
    <div class="modal-card">
      <div class="modal-title">CATÁLOGO DE MÚSICAS</div>
      <input id="cat-search" class="input" type="text" placeholder="Buscar por código, música ou cantor..." oninput="filtrarCatalogoVsk(this.value)" />
      <div id="cat-results"></div>
      <div class="modal-actions">
        <button class="btn" onclick="fecharCatalogoVsk()">FECHAR</button>
      </div>
    </div>
  </div>

  <input id="vsk-folder-input" type="file" webkitdirectory directory multiple />

  <script>
    const state = {
      songs: {}, list: [], queue: [], covers: {}, intros: [],
      logoUrl: 'logo.png', qrUrl: null, qrHidden: false,
      buffer: '', numpadBuffer: '', bufTimer: null, pendingSong: null,
      introRunning: false, introDone: false, folderPicking: false, loadingSongs: false
    };
    const video = document.getElementById('vsk-video');

    function abrirPastaVsk() {
      if (state.folderPicking) return;
      state.folderPicking = true;
      if (window.AndroidHost && AndroidHost.chooseFolder) {
        AndroidHost.chooseFolder();
      } else {
        document.getElementById('vsk-folder-input').click();
      }
      setTimeout(() => { state.folderPicking = false; }, 1500);
    }

    document.getElementById('vsk-folder-input').addEventListener('change', (e) => {
      state.folderPicking = false;
      const files = Array.from(e.target.files || []);
      const introsAchadas = files
        .filter(f => /^intro[1-5]?\.mp4$/i.test(f.name || ''))
        .sort((a, b) => (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase()))
        .map(f => ({ name: (f.name || '').toLowerCase(), url: URL.createObjectURL(f) }));
      if (introsAchadas.length) {
        state.intros = introsAchadas;
        tocarSequenciaIntros();
      }
      carregarArquivosVsk(files);
    });

    window.onIntroFoundDuringScan = function(introUri) {
      if (!introUri) return;
      const exists = state.intros.some(it => it.url === introUri);
      if (!exists) {
        state.intros.push({ name: 'intro.mp4', url: introUri });
        state.intros.sort((a, b) => a.name.localeCompare(b.name));
      }
      if (!state.introRunning && !state.introDone && state.queue.length === 0) {
        tocarSequenciaIntros();
      }
    };

    window.onNativeFolderLoaded = function(entries) {
      state.folderPicking = false;
      const files = (entries || []).map(it => ({
        name: it.name,
        webkitRelativePath: it.path || it.name,
        contentUri: it.uri
      }));
      carregarArquivosVsk(files);
    };

    function normalizarChave(str) {
      return (str || '')
        .replace(/\.[^.]+$/, '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toUpperCase()
        .trim();
    }

    function carregarArquivosVsk(files) {
      state.loadingSongs = true;
      const novosSongs = {};
      const novaLista = [];
      const novasCapas = {};
      const novasIntros = [];

      for (const f of files) {
        const name = f.name || '';
        const low = name.toLowerCase();
        const pathUpper = (f.webkitRelativePath || name).toUpperCase().replace(/\\/g, '/');
        const srcUrl = f.contentUri || URL.createObjectURL(f);

        if (low === 'logo.png' || low === 'logo.jpg') {
          state.logoUrl = srcUrl;
          document.getElementById('vsk-default-logo').src = srcUrl;
        }

        if (low === 'qrlista.png') {
          state.qrUrl = srcUrl;
        }

        if (low === 'bgpadrao.jpg' || low === 'bgpadrao.png') {
          document.getElementById('vsk-bg').style.backgroundImage = `url("${srcUrl}")`;
        }

        if (pathUpper.includes('/CAPAS/') && /\.(png|jpg|jpeg|webp)$/i.test(low)) {
          novasCapas[normalizarChave(name)] = srcUrl;
        }

        if (/^intro[1-5]?\.mp4$/i.test(low)) {
          novasIntros.push({ name: low, url: srcUrl });
          continue;
        }

        if (low.endsWith('.mp4')) {
          const m = name.match(/^(\d{1,6})\s*[-–—]?\s*(.+)\.mp4$/i);
          if (m) {
            const code = m[1].padStart(4, '0');
            const parts = m[2].split(/\s*[-–—]\s*/);
            const title = (parts[0] || '').trim().toUpperCase();
            const artist = (parts[1] || '').trim().toUpperCase();
            const item = { code, title, artist, file: f, url: srcUrl };
            novosSongs[code] = item;
            novaLista.push(item);
          }
        }
      }

      novasIntros.sort((a, b) => a.name.localeCompare(b.name));
      novaLista.sort((a, b) => a.title.localeCompare(b.title));

      state.songs = novosSongs;
      state.list = novaLista;
      state.covers = novasCapas;
      if (novasIntros.length) state.intros = novasIntros;
      state.loadingSongs = false;

      atualizarFilaVsk();

      if (!state.introRunning && !state.introDone && state.intros.length > 0 && state.queue.length === 0) {
        tocarSequenciaIntros();
      }
    }

    async function tocarSequenciaIntros() {
      if (state.introRunning || state.introDone || !state.intros.length) return;
      state.introRunning = true;

      for (const item of state.intros) {
        if (state.queue.length > 0) break;
        await new Promise((resolve) => {
          video.style.display = 'block';
          video.src = item.url;
          const onDone = () => {
            video.removeEventListener('ended', onDone);
            video.removeEventListener('error', onDone);
            resolve();
          };
          video.addEventListener('ended', onDone);
          video.addEventListener('error', onDone);
          video.play().catch(onDone);
        });
      }

      state.introRunning = false;
      state.introDone = true;

      if (state.queue.length === 0) {
        video.pause();
        video.style.display = 'none';
        video.src = '';
      }
    }

    function alternarFilaDropdown() {
      document.getElementById('vsk-queue-dropdown').classList.toggle('open');
    }

    function abrirTecladoCodigo() {
      state.numpadBuffer = '';
      atualizarNumpadDisplay();
      document.getElementById('modal-numpad').classList.add('active');
    }

    function fecharTecladoCodigo() {
      document.getElementById('modal-numpad').classList.remove('active');
    }

    function limparNumpad() {
      state.numpadBuffer = '';
      atualizarNumpadDisplay();
    }

    function teclaNumpad(digito) {
      if (state.numpadBuffer.length >= 6) return;
      state.numpadBuffer += digito;
      atualizarNumpadDisplay();
    }

    function atualizarNumpadDisplay() {
      const digits = state.numpadBuffer;
      document.getElementById('numpad-code').textContent = digits ? digits.padEnd(4, '-') : '----';
      const code = digits.padStart(4, '0');
      const s = state.songs[code];
      document.getElementById('numpad-preview').textContent = s
        ? `#${s.code} - ${s.title}${s.artist ? ' - ' + s.artist : ''}`
        : (digits ? 'Código não encontrado' : 'Digite os números do código');
    }

    function confirmarNumpad() {
      const val = state.numpadBuffer.trim();
      if (!val) return;
      if (val === '999999999') {
        state.qrHidden = !state.qrHidden;
        fecharTecladoCodigo();
        atualizarFilaVsk();
        return;
      }
      const code = val.padStart(4, '0');
      if (state.songs[code]) {
        fecharTecladoCodigo();
        abrirModalCantorVsk(state.songs[code]);
      } else {
        document.getElementById('numpad-preview').textContent = `Código ${code} não encontrado`;
      }
    }

    function atualizarOsd(digits) {
      const code = digits.padStart(4, '0');
      const s = state.songs[code];
      document.getElementById('vsk-marquee').textContent = s
        ? `CÓDIGO ${digits}: ${s.code} - ${s.title}${s.artist ? ' - ' + s.artist : ''}`
        : `DIGITANDO CÓDIGO: ${digits}`;
    }

    function moverSelecaoCatalogo(delta) {
      const modal = document.getElementById('modal-cat');
      if (!modal || !modal.classList.contains('active')) return false;
      const rows = Array.from(document.querySelectorAll('#cat-results .cat-row'));
      if (!rows.length) return false;
      let idx = rows.findIndex(el => el.classList.contains('selected') || el === document.activeElement);
      if (idx === -1) idx = 0;
      else idx = (idx + delta + rows.length) % rows.length;
      rows.forEach(r => r.classList.remove('selected'));
      rows[idx].classList.add('selected');
      rows[idx].focus();
      rows[idx].scrollIntoView({ block: 'nearest' });
      return true;
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key;
      const codeKey = e.code;
      const numpadOpen = document.getElementById('modal-numpad').classList.contains('active');
      const catOpen = document.getElementById('modal-cat').classList.contains('active');
      const singerOpen = document.getElementById('modal-singer').classList.contains('active');

      if (numpadOpen) {
        if (key >= '0' && key <= '9') { e.preventDefault(); teclaNumpad(key); return; }
        if (key === 'Backspace') { e.preventDefault(); state.numpadBuffer = state.numpadBuffer.slice(0, -1); atualizarNumpadDisplay(); return; }
        if (key === 'Enter' || codeKey === 'NumpadEnter') { e.preventDefault(); confirmarNumpad(); return; }
        if (key === 'Escape') { e.preventDefault(); fecharTecladoCodigo(); return; }
      }

      if (document.activeElement && document.activeElement.tagName === 'INPUT') {
        if (key === 'Enter' && singerOpen) {
          e.preventDefault();
          confirmarCantorVsk();
        } else if (key === 'ArrowDown' && catOpen) {
          e.preventDefault();
          moverSelecaoCatalogo(1);
        } else if (key === 'Escape') {
          e.preventDefault();
          if (singerOpen) fecharModalCantorVsk();
          else if (catOpen) fecharCatalogoVsk();
        }
        return;
      }

      if (catOpen) {
        if (key === 'ArrowDown') { e.preventDefault(); moverSelecaoCatalogo(1); return; }
        if (key === 'ArrowUp') { e.preventDefault(); moverSelecaoCatalogo(-1); return; }
        if (key === 'Enter' || codeKey === 'NumpadEnter') {
          e.preventDefault();
          const sel = document.querySelector('#cat-results .cat-row.selected') || (document.activeElement && document.activeElement.classList.contains('cat-row') ? document.activeElement : null);
          if (sel) sel.click();
          return;
        }
        if (key === 'Escape' || key === 'Backspace') {
          e.preventDefault();
          fecharCatalogoVsk();
          return;
        }
      }

      if (singerOpen) {
        if (key === 'Enter' || codeKey === 'NumpadEnter') {
          e.preventDefault();
          confirmarCantorVsk();
          return;
        }
        if (key === 'Escape' || key === 'Backspace') {
          e.preventDefault();
          fecharModalCantorVsk();
          return;
        }
      }

      if (key >= '0' && key <= '9') {
        state.buffer += key;
        atualizarOsd(state.buffer);
        clearTimeout(state.bufTimer);
        state.bufTimer = setTimeout(() => {
          const val = state.buffer;
          state.buffer = '';
          if (val === '999999999') { state.qrHidden = !state.qrHidden; atualizarFilaVsk(); return; }
          const code = val.padStart(4, '0');
          if (state.songs[code]) abrirModalCantorVsk(state.songs[code]);
        }, 1400);
        return;
      }

      if (key === 'MediaTrackNext' || key === 'n' || key === 'N') {
        e.preventDefault();
        vskSkip();
      } else if (key === 'MediaStop' || key === 's' || key === 'S') {
        e.preventDefault();
        vskStop();
      } else if (key === 'MediaPlayPause' || key === ' ') {
        if (video.style.display === 'block') {
          e.preventDefault();
          if (video.paused) video.play().catch(() => {});
          else video.pause();
        } else if (state.queue.length > 0) {
          e.preventDefault();
          vskStart();
        }
      } else if (key === 'c' || key === 'C' || key === 'F2') {
        e.preventDefault();
        abrirCatalogoVsk();
      } else if (key === 'Escape' || key === 'Backspace') {
        e.preventDefault();
        fecharTecladoCodigo();
        fecharCatalogoVsk();
        fecharModalCantorVsk();
        document.getElementById('vsk-queue-dropdown').classList.remove('open');
      }
    });

    function abrirModalCantorVsk(song) {
      state.pendingSong = song;
      document.getElementById('singer-song-title').textContent = `#${song.code} - ${song.title}`;
      const inp = document.getElementById('singer-name-input');
      inp.value = '';
      document.getElementById('modal-singer').classList.add('active');
      setTimeout(() => inp.focus(), 60);
    }
    function fecharModalCantorVsk() { document.getElementById('modal-singer').classList.remove('active'); }
    function confirmarCantorVsk() {
      if (!state.pendingSong) return;
      const singer = (document.getElementById('singer-name-input').value || '').trim().toUpperCase();
      state.queue.push({ ...state.pendingSong, singer });
      fecharModalCantorVsk();
      atualizarFilaVsk();
      if (video.style.display !== 'block' && state.queue.length === 1) vskStart();
    }

    function formatarLinhaFila(item) {
      const base = `${item.code} - ${item.title}${item.artist ? ' - ' + item.artist : ''}`;
      return item.singer ? `${base} (${item.singer})` : base;
    }

    function atualizarFilaVsk() {
      const itemsBox = document.getElementById('vsk-queue-items');
      const qrBox = document.getElementById('vsk-qr-box');
      document.getElementById('vsk-q-count').textContent = state.queue.length;

      itemsBox.innerHTML = '';
      if (state.queue.length === 0) {
        itemsBox.innerHTML = '<div class="q-empty">Fila vazia</div>';
        if (state.qrUrl && !state.qrHidden) {
          document.getElementById('vsk-qr-img').src = state.qrUrl;
          qrBox.classList.add('visible');
        } else qrBox.classList.remove('visible');
        document.getElementById('vsk-marquee').textContent = '★ VIDEOKE SHOW ★ AGUARDANDO SELEÇÃO DE MÚSICAS ★';
        return;
      }
      qrBox.classList.remove('visible');
      state.queue.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'q-item' + (i === 0 && video.style.display === 'block' ? ' playing' : '');
        div.textContent = formatarLinhaFila(item);
        itemsBox.appendChild(div);
      });
      const cur = state.queue[0];
      document.getElementById('vsk-marquee').textContent = `▶ TOCANDO AGORA: ${formatarLinhaFila(cur)}`;
    }

    async function vskStart() {
      if (!state.queue.length || video.style.display === 'block') return;
      state.introDone = true;
      const cur = state.queue[0];
      const cd = document.getElementById('vsk-countdown');
      const logoImg = document.getElementById('vsk-default-logo');
      const coverImg = document.getElementById('vsk-artist-cover');

      if (state.logoUrl) {
        logoImg.src = state.logoUrl;
        logoImg.style.display = 'block';
        logoImg.onerror = () => { logoImg.style.display = 'none'; };
      }

      const coverUrl = state.covers[normalizarChave(cur.artist)];
      if (coverUrl) { coverImg.src = coverUrl; coverImg.style.display = 'block'; }
      else coverImg.style.display = 'none';

      document.getElementById('vsk-count-info').textContent = formatarLinhaFila(cur);
      cd.classList.add('active');
      for (let i = 5; i >= 1; i--) {
        document.getElementById('vsk-count-num').textContent = i;
        await new Promise(r => setTimeout(r, 1000));
      }
      cd.classList.remove('active');
      logoImg.style.display = 'none';

      video.src = cur.url || cur.file.contentUri || URL.createObjectURL(cur.file);
      video.style.display = 'block';
      await video.play().catch(() => {});
      atualizarFilaVsk();
    }

    video.ontimeupdate = () => {
      if (!video.duration) return;
      document.getElementById('vsk-progress-fill').style.width = ((video.currentTime / video.duration) * 100) + '%';
      const rem = Math.max(0, Math.floor(video.duration - video.currentTime));
      document.getElementById('vsk-time').textContent = `-${String(Math.floor(rem / 60)).padStart(2,'0')}:${String(rem % 60).padStart(2,'0')}`;
    };

    document.getElementById('vsk-progress-bar').addEventListener('click', (e) => {
      if (!video.duration) return;
      const r = e.currentTarget.getBoundingClientRect();
      video.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * video.duration;
    });

    video.onended = async () => {
      video.style.display = 'none';
      video.src = '';
      const score = Math.floor(86 + Math.random() * 15);
      const scOverlay = document.getElementById('vsk-score-overlay');
      document.getElementById('score-number').textContent = score;
      document.getElementById('score-msg').textContent = score >= 95 ? 'ESPETACULAR! NOTA MÁXIMA NO PALCO!' : 'MUITO BOM! PARABÉNS PELA APRESENTAÇÃO!';
      scOverlay.classList.add('active');
      await new Promise(r => setTimeout(r, 4000));
      scOverlay.classList.remove('active');

      state.queue.shift();
      atualizarFilaVsk();
      if (state.queue.length > 0) vskStart();
    };

    function vskStop() { video.pause(); video.style.display = 'none'; video.src = ''; atualizarFilaVsk(); }
    function vskSkip() { if (state.queue.length) video.dispatchEvent(new Event('ended')); }
    function vskClear() { state.queue = video.style.display === 'block' ? state.queue.slice(0, 1) : []; atualizarFilaVsk(); }

    function abrirCatalogoVsk() {
      document.getElementById('modal-cat').classList.add('active');
      filtrarCatalogoVsk('');
      setTimeout(() => document.getElementById('cat-search').focus(), 60);
    }
    function fecharCatalogoVsk() { document.getElementById('modal-cat').classList.remove('active'); }
    function filtrarCatalogoVsk(q) {
      const term = q.trim().toLowerCase();
      const res = state.list.filter(s => !term || s.code.includes(term) || s.title.toLowerCase().includes(term) || s.artist.toLowerCase().includes(term));
      const box = document.getElementById('cat-results');
      box.innerHTML = res.slice(0, 200).map((s, i) =>
        `<button class="cat-row${i === 0 ? ' selected' : ''}" onclick='selecionarDoCat("${s.code}")'><span><b style="color:var(--gold)">#${s.code}</b> ${s.title}</span><small style="color:var(--cyan)">${s.artist}</small></button>`
      ).join('');
    }
    function selecionarDoCat(code) { fecharCatalogoVsk(); if (state.songs[code]) abrirModalCantorVsk(state.songs[code]); }
    document.getElementById('vsk-btn-exit').onclick = () => { if (window.AndroidHost && AndroidHost.exitApp) AndroidHost.exitApp(); else window.close(); };
    window.addEventListener('load', abrirPastaVsk);
  </script>
</body>
