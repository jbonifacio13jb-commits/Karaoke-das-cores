<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KARAOKÊ FESTA DAS CORES</title>
    <link rel="icon" id="app-icon-link" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><radialGradient id=%22g%22 cx=%2250%%22 cy=%2250%%22 r=%2250%%22><stop offset=%220%%22 stop-color=%22%230d0d14%22/><stop offset=%22100%%22 stop-color=%22%23050508%22/></radialGradient><linearGradient id=%22l%22 x1=%220%%22 y1=%220%%22 x2=%22100%%22 y2=%22100%%22><stop offset=%220%%22 stop-color=%22%2300ffff%22/><stop offset=%22100%%22 stop-color=%22%23ff00ff%22/></linearGradient></defs><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22url(%23g)%22/><g stroke=%22url(%23l)%22 fill=%22none%22 stroke-width=%224%22 stroke-linecap=%22round%22><path d=%22M50,20 L50,60 M35,45 C35,65 65,65 65,45%22/></g><circle cx=%2250%22 cy=%2250%22 r=%2240%22 stroke=%22url(%23l)%22 stroke-width=%221%22 fill=%22none%22 opacity=%220.3%22/></svg>">
    <style>
        @font-face { font-family: 'Orbitron'; src: url('fontes/Orbitron-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
        @font-face { font-family: 'Rajdhani'; src: url('fontes/Rajdhani-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
        :root {
            --font-title: 'Orbitron', 'Arial Black', sans-serif;
            --font-body: 'Rajdhani', 'Arial', sans-serif;
            --neon: #00ffff; --magenta: #ff00ff; --vivid-yellow: #ffdd00; --emerald: #00ff88;
            --dark-bg: #050508; --panel-bg: #0d0d14; --icone-size: 42px;
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
        body { background: var(--dark-bg); color: #e0e0e0; font-family: var(--font-body); height: 100vh; width: 100vw; overflow: hidden; }
        #ui-wrapper { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 10; }
        .stage { height: 320px; width: 100%; position: relative; background: #000; overflow: hidden; flex-shrink: 0; border-bottom: 3px solid var(--vivid-yellow); z-index: 200; }
        body.fullscreen-mode .stage { height: 100vh !important; width: 100vw !important; position: fixed; top: 0; left: 0; z-index: 9999; border: none; }
        #intro-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999998; display: none; align-items: center; justify-content: center; }
        #intro-screen.active { display: flex !important; }
        #intro-video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        #intro-curtain { position: absolute; inset: 0; z-index: 1; background: #000; pointer-events: none; }
        #intro-curtain.hidden { display: none; }
        .stage-background { position: absolute; width: 100%; height: 100%; background-color: #000; background-size: cover; background-position: center center; z-index: 1; opacity: 0.7; }
        body.countdown-ativo .stage-background { opacity: 0 !important; }
        #bg-singer-layer, #bg-singer-layer-2 { position: absolute; width: 100%; height: 100%; background-size: contain; background-position: center center; background-repeat: no-repeat; z-index: 2; opacity: 0; transition: opacity 0.4s ease-in-out; }
        #tornado-layer { position: absolute; width: 100%; height: 100%; z-index: 1000; display: none; align-items: center; justify-content: center; overflow: hidden; pointer-events: none; background: radial-gradient(ellipse at center, rgba(30, 5, 50, 0.5) 0%, rgba(0, 0, 0, 0.95) 100%); }
        body.modo-jb #tornado-layer { display: flex; }
        #bg-singer-layer-rock { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: contain; background-position: center center; background-repeat: no-repeat; z-index: 1005; opacity: 0; transition: opacity 0.3s ease-in-out; }
        #bg-singer-layer-rock.ativo { opacity: 1 !important; }
        #timer-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
        #timer-screen.active { display: flex !important; }
        #countdown-num { position: absolute; z-index: 10001; top: max(7vh, 28px); right: max(6vw, 24px); color: rgba(255, 220, 0, .68); font: 900 clamp(72px, 14vw, 140px)/1 var(--font-title); text-shadow: 0 0 8px rgba(255, 220, 0, .32); }
        #song-display { position: absolute; left: 50%; bottom: calc(var(--icone-size) + 16px); transform: translateX(-50%); width: 92%; max-height: 72px; overflow: hidden; z-index: 10001; color: var(--vivid-yellow); font-family: var(--font-title); font-size: 14px !important; text-align: center; white-space: pre-line; text-shadow: 0 1px 3px rgba(0,0,0,.95); }
        #stage-bottom-bar { position: absolute; bottom: 8px; left: 1.5%; width: 97%; display: flex; align-items: center; gap: 10px; z-index: 99999; }
        .btn-bar-transp { background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.35); color: #fff; width: var(--icone-size); height: var(--icone-size); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #stage-progress-container { flex: 1; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.55); padding: 8px 16px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.25); height: var(--icone-size); }
        #stage-progress-bar-bg { flex: 1; height: 6px; background: rgba(255,255,255,0.25); border-radius: 4px; overflow: hidden; }
        #stage-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon), var(--magenta)); border-radius: 4px; }
        #stage-time-remaining { font-family: var(--font-title); font-size: 12px; color: var(--vivid-yellow); min-width: 55px; text-align: right; }
        #marquee-container { position: absolute; top: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.22); border-bottom: 1px solid rgba(255, 221, 0, .45); padding: 8px 12px; z-index: 99999; overflow: hidden; min-height: 38px; box-sizing: border-box; }
        #marquee-text { display: inline-block; white-space: nowrap; color: var(--vivid-yellow); animation: marqueeAnim 20s linear infinite; font-family: var(--font-title); font-size: 14px; font-weight: 700; }
        @keyframes marqueeAnim { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .search-bar { background: #111; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #333; align-items: center; }
        #btn-teclado { background: var(--magenta); height: 60px; width: 85px; border-radius: 18px; border: none; color: #fff; display: flex; align-items: center; justify-content: center; opacity: 0.3; cursor: pointer; flex-shrink: 0; }
        #btn-teclado.active { opacity: 1; }
        #btn-play-bar { background: linear-gradient(180deg, #00ff99 0%, #00aa55 100%); border-radius: 18px; border: none; color: #001a0d; font-weight: 900; font-family: var(--font-title); height: 60px; flex: 1; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .ui-panel { flex: 1; background: var(--panel-bg); padding: 15px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
        .controls-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .btn-parar, .btn-limpar { flex: 1; height: 68px; border-radius: 22px; font-family: var(--font-title); font-weight: 900; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; border: none; color: #fff; text-transform: uppercase; }
        .btn-parar { background: linear-gradient(180deg, #ff9e1b 0%, #c2410c 100%); }
        .btn-limpar { background: linear-gradient(180deg, #ff2e51 0%, #b91c1c 100%); }
        #track-list { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.6); border-radius: 18px; padding: 12px; border: 1px solid #222; }
        .item { background: linear-gradient(90deg, rgba(255,255,255,0.07), transparent); padding: 14px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--magenta); font-size: 15px; }
        .item.now-playing { background: linear-gradient(90deg, rgba(0,255,136,0.22), rgba(0,255,136,0.05)); border-left: 6px solid var(--emerald) !important; }
        .playing-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--emerald); color: #000; font-family: var(--font-title); font-size: 9px; font-weight: 900; padding: 2px 8px; border-radius: 6px; margin-bottom: 6px; }
        #modal-cantor-overlay, #numeric-keypad-overlay, #catalogo-overlay, #modal-sair-overlay, #modal-duplicados-overlay, #logo-tela-overlay { position: fixed; inset: 0; z-index: 20000; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 20px; }
        #modal-cantor-overlay.active, #numeric-keypad-overlay.active, #catalogo-overlay.active, #modal-sair-overlay.active, #modal-duplicados-overlay.active, #logo-tela-overlay.ativo { display: flex !important; }
        #modal-cantor-box { background: var(--panel-bg); border: 2px solid var(--vivid-yellow); border-radius: 20px; padding: 25px; width: 100%; max-width: 480px; color: #fff; }
        #modal-cantor-input { width: 100%; padding: 16px; border-radius: 14px; border: 2px solid #333; background: #0a0a0f; color: #fff; font-size: 18px; margin-top: 10px; }
        .btn-sair-topo-fixo { position: fixed !important; top: 10px !important; right: 14px !important; width: 38px !important; height: 38px !important; border-radius: 12px !important; background: rgba(10, 6, 20, 0.75) !important; border: 1.5px solid rgba(212, 128, 255, 0.6) !important; display: flex !important; align-items: center !important; justify-content: center !important; cursor: pointer !important; color: #d480ff !important; z-index: 99999 !important; }
        #catalogo-box { flex: 1; display: flex; flex-direction: column; gap: 18px; background: #0f0d2a; border-radius: 24px; padding: 26px; max-width: 800px; width: 100%; max-height: 85vh; }
        #cat-lista { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .cat-item { display: flex; align-items: center; gap: 20px; padding: 15px 20px; border-radius: 14px; background: rgba(255,255,255,0.05); color: #fff; border: none; cursor: pointer; font-size: 16px; text-align: left; width: 100%; }
        #aviso-rapido { position: fixed; left: 50%; bottom: 21vh; transform: translate(-50%, 40vh); z-index: 30000; padding: 16px 34px; border-radius: 10vh; font-weight: 800; color: #04180e; background: var(--emerald); transition: transform .45s; pointer-events: none; }
        #aviso-rapido.on { transform: translate(-50%, 0); }
        #ui-wrapper.oculto-inicio { display: none !important; }
        #ui-wrapper.liberado { display: flex !important; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="intro-screen">
        <video id="intro-video" playsinline autoplay preload="auto"><source src="intro.mp4" type="video/mp4"></video>
        <div id="intro-curtain" aria-hidden="true"></div>
        <div id="intro-error" style="display:none; flex-direction:column; align-items:center; color:#fff; text-align:center; padding:20px;">
            <span id="intro-error-text"></span><button id="intro-error-action" type="button" style="margin-top:15px; padding:15px; background:var(--emerald); border:none; border-radius:10px; font-weight:bold;">TENTAR NOVAMENTE</button>
        </div>
    </div>

    <div id="overlay-ok" style="position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:9999999; display:none; flex-direction:column; align-items:center; justify-content:center; padding:40px; font-family:var(--font-title);">
        <h2 style="color:var(--neon); font-size:24px; margin-bottom:20px; text-align:center;">🎤 PRESSIONE OK PARA COMEÇAR</h2>
        <button id="btn-ok-overlay" tabindex="1" style="padding:20px 40px; font-size:18px; background:var(--emerald); border:none; border-radius:15px; font-weight:bold; cursor:pointer;">OK - COMEÇAR</button>
    </div>

    <div id="numeric-keypad-overlay">
        <div id="numeric-keypad" style="background:#191020; border:2px solid var(--magenta); padding:20px; border-radius:20px; width:320px; color:#fff;">
            <h2 style="text-align:center; margin-bottom:10px; font-family:var(--font-title);">DIGITE O CÓDIGO</h2>
            <div id="keypad-code" style="background:#030306; padding:10px; text-align:center; font-size:24px; color:var(--vivid-yellow); margin-bottom:10px; letter-spacing:6px; border-radius:8px;">—</div>
            <p id="keypad-feedback" style="color:#ff7777; font-size:12px; text-align:center; min-height:16px;"></p>
            <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px;">
                <button type="button" onclick="adicionarDigitoTeclado('1')">1</button>
                <button type="button" onclick="adicionarDigitoTeclado('2')">2</button>
                <button type="button" onclick="adicionarDigitoTeclado('3')">3</button>
                <button type="button" onclick="adicionarDigitoTeclado('4')">4</button>
                <button type="button" onclick="adicionarDigitoTeclado('5')">5</button>
                <button type="button" onclick="adicionarDigitoTeclado('6')">6</button>
                <button type="button" onclick="adicionarDigitoTeclado('7')">7</button>
                <button type="button" onclick="adicionarDigitoTeclado('8')">8</button>
                <button type="button" onclick="adicionarDigitoTeclado('9')">9</button>
                <button type="button" onclick="limparCodigoTeclado()">LIMPAR</button>
                <button type="button" onclick="adicionarDigitoTeclado('0')">0</button>
                <button type="button" onclick="apagarDigitoTeclado()">⌫</button>
            </div>
            <div style="display:flex; gap:8px;">
                <button type="button" onclick="fecharTecladoNumerico()" style="flex:1; padding:12px; background:#333; color:#fff; border:none; border-radius:8px;">FECHAR</button>
                <button type="button" onclick="confirmarCodigoTeclado()" style="flex:1; padding:12px; background:var(--emerald); color:#000; border:none; border-radius:8px; font-weight:bold;">BUSCAR</button>
            </div>
        </div>
    </div>

    <div id="ui-wrapper" class="oculto-inicio">
        <div class="stage" id="stage-area">
            <div class="stage-background" id="main-bg"></div>
            <div id="bg-singer-layer"></div>
            <div id="bg-singer-layer-2"></div>
            <div id="tornado-layer">
                <div id="bg-singer-layer-rock"></div>
            </div>
            <video id="video-player" playsinline preload="auto"></video>
            <audio id="audio-jb" loop></audio>

            <div id="idle-hero" style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none;">
                <div style="font-family:var(--font-title); font-size:clamp(24px, 5vw, 48px); font-weight:900; color:#fff; text-shadow:0 0 20px var(--magenta);">KARAOKÊ FESTA DAS CORES</div>
                <div style="font-family:var(--font-title); font-size:16px; color:var(--vivid-yellow); margin-top:10px;">DIGITE O CÓDIGO DA MÚSICA</div>
                <div style="font-family:var(--font-body); font-size:14px; color:#aaa; margin-top:5px;"><b id="hero-count">0</b> MÚSICAS DISPONÍVEIS</div>
            </div>

            <div id="marquee-container">
                <div id="marquee-text">★ KARAOKÊ FESTA DAS CORES ★ <span id="marquee-info">| AGUARDANDO MÚSICA...</span></div>
            </div>

            <div id="stage-bottom-bar">
                <button type="button" class="btn-bar-transp" onclick="acionarControleApresentacao()" title="Tela Cheia">🖥️</button>
                <button type="button" class="btn-bar-transp" onclick="voltarMusica()" title="Voltar">⏮</button>
                <div id="stage-progress-container">
                    <div id="stage-progress-bar-bg"><div id="stage-progress-fill"></div></div>
                    <div id="stage-time-remaining">-00:00</div>
                </div>
                <button type="button" class="btn-bar-transp" onclick="pularMusica()" title="Pular">⏭</button>
            </div>

            <div id="timer-screen">
                <div id="song-display"></div>
                <div id="countdown-num">5</div>
            </div>
        </div>

        <div class="search-bar">
            <button type="button" id="btn-teclado" onclick="abrirTeclado()" title="Teclado">
                <span>CÓDIGO</span>
            </button>
            <button type="button" id="btn-catalogo" onclick="abrirCatalogo()" style="background:#29e7ff; color:#04202b; border-radius:18px; border:none; padding:0 20px; font-weight:bold; font-family:var(--font-title); height:60px; cursor:pointer;">CATÁLOGO</button>
            <button type="button" id="btn-play-bar" onclick="startPlaylist()" disabled>INICIAR SHOW</button>
        </div>

        <div class="ui-panel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="font-family:var(--font-title); font-weight:900;">FILA DE MÚSICAS</div>
                <div id="queue-count-badge" style="background:var(--magenta); padding:2px 10px; border-radius:10px; font-weight:bold;">0</div>
            </div>
            <div class="controls-grid">
                <button type="button" class="btn-parar" onclick="stopAudio()">PARAR</button>
                <button type="button" class="btn-limpar" onclick="limparLista()">LIMPAR</button>
            </div>
            <div id="track-list"></div>
        </div>
    </div>

    <div id="modal-cantor-overlay">
        <div id="modal-cantor-box">
            <h3 style="font-family:var(--font-title); color:var(--vivid-yellow); margin-bottom:10px;">✅ CÓDIGO ENCONTRADO</h3>
            <div id="modal-cantor-musica-nome" style="font-size:16px; font-weight:bold; margin-bottom:15px;"></div>
            <label style="font-size:12px; color:#aaa; font-family:var(--font-title);">🎤 QUEM CANTA?</label>
            <input type="text" id="modal-cantor-input" placeholder="Digite o nome..." autocomplete="off">
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button type="button" onclick="fecharModalCantor()" style="flex:1; padding:14px; background:#333; color:#fff; border:none; border-radius:10px;">CANCELAR</button>
                <button type="button" onclick="confirmarCantor()" style="flex:1; padding:14px; background:var(--magenta); color:#fff; border:none; border-radius:10px; font-weight:bold;">CONFIRMAR</button>
            </div>
        </div>
    </div>

    <div id="catalogo-overlay">
        <div id="catalogo-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 style="font-family:var(--font-title);">CATÁLOGO <small id="cat-total" style="font-size:14px; color:var(--neon);"></small></h2>
                <button type="button" onclick="fecharCatalogo()" style="padding:10px 20px; background:var(--magenta); color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">FECHAR ✕</button>
            </div>
            <input type="text" id="cat-campo-busca" placeholder="🔍 Pesquisar música ou cantor..." oninput="filtrarBuscaCatalogo(this.value)" style="width:100%; padding:14px; border-radius:12px; border:2px solid var(--neon); background:#050508; color:#fff; font-size:16px;">
            <div id="cat-lista"></div>
        </div>
    </div>

    <div id="aviso-rapido"></div>
    <input type="file" id="f-folder" webkitdirectory directory multiple style="display:none">

    <script>
        let player, trackList, fileInput, marqueeInfo, bgSinger, bgSinger2, audioJB, mainBg, tornadoLayer, timerScreen, marqueeCont;
        let videoFiles = {}, catalog = [], queue = [], rockDoidoSlides = [], bgCantores = {}, capasMusicas = {};
        let modalTempCode = null, modalTempNome = null, modalTempFile = null;
        let bgPadraoList = [], bgPadraoInterval = null, currentBgIndex = -1;
        let tvBuffer = "", tvBufferTimer = null;
        let singerBgInterval = null, isVideosLoaded = false, folderLoadFinished = true;
        let introSequenceFiles = [], introScreensaverActive = false;
        let camadaAtiva = 1, fotosCantor = [], indiceFotoAtual = 0;
        let marqueeModo = "padrao", codigoTecladoNumerico = '';
        let _audioRockDoido = null, _caminhoAudioDetectado = null;
        let _termoBuscaCatalogo = '';

        function logOK(m) { console.log('%c[OK] ' + m, 'color: #00ff88; font-weight: bold'); }
        function logAviso(m) { console.log('%c[AVISO] ' + m, 'color: #ffaa00; font-weight: bold'); }
        function logErro(m) { console.log('%c[ERRO] ' + m, 'color: #ff3333; font-weight: bold'); }

        function abrirTeclado() {
            codigoTecladoNumerico = '';
            atualizarTelaTecladoNumerico();
            document.getElementById('numeric-keypad-overlay').classList.add('active');
        }
        function atualizarTelaTecladoNumerico() {
            document.getElementById('keypad-code').textContent = codigoTecladoNumerico || '—';
        }
        function adicionarDigitoTeclado(d) {
            if (codigoTecladoNumerico.length < 10) { codigoTecladoNumerico += d; atualizarTelaTecladoNumerico(); }
        }
        function apagarDigitoTeclado() { codigoTecladoNumerico = codigoTecladoNumerico.slice(0, -1); atualizarTelaTecladoNumerico(); }
        function limparCodigoTeclado() { codigoTecladoNumerico = ''; atualizarTelaTecladoNumerico(); }
        function fecharTecladoNumerico() { document.getElementById('numeric-keypad-overlay').classList.remove('active'); }
        function confirmarCodigoTeclado() {
            const v = codigoTecladoNumerico.trim();
            if (v && videoFiles[v.padStart(4, '0')]) {
                fecharTecladoNumerico();
                processarCodigo(v);
            } else {
                document.getElementById('keypad-feedback').textContent = 'Código não encontrado.';
            }
        }

        async function forcarPaisagem() {
            try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (e) {}
            document.body.classList.add('fullscreen-mode');
        }

        function initKaraoke() {
            player = document.getElementById('video-player');
            trackList = document.getElementById('track-list');
            fileInput = document.getElementById('f-folder');
            marqueeInfo = document.getElementById('marquee-info');
            bgSinger = document.getElementById('bg-singer-layer');
            bgSinger2 = document.getElementById('bg-singer-layer-2');
            audioJB = document.getElementById('audio-jb');
            mainBg = document.getElementById('main-bg');
            tornadoLayer = document.getElementById('tornado-layer');
            timerScreen = document.getElementById('timer-screen');
            marqueeCont = document.getElementById('marquee-container');

            fileInput.addEventListener('change', handleFolderSelect);
            player.onended = () => {
                fecharVideo();
                queue.shift();
                renderQueue();
                if (queue.length > 0) setTimeout(startPlaylist, 800);
            };
            player.ontimeupdate = updateStageProgressBar;

            const usaNativo = !!(window.AndroidHost && AndroidHost.chooseFolder);
            if (usaNativo) selectFolder();
            else mostrarOverlayOK();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initKaraoke);
        else initKaraoke();

        function mostrarOverlayOK() {
            const ov = document.getElementById('overlay-ok');
            ov.style.display = 'flex';
            document.getElementById('btn-ok-overlay').onclick = () => {
                ov.style.display = 'none';
                reproduzirCicloIntro();
            };
        }

        async function reproduzirCicloIntro() {
            const introScreen = document.getElementById('intro-screen');
            const introVideo = document.getElementById('intro-video');
            introScreen.classList.add('active');
            try {
                await introVideo.play();
                introVideo.onended = () => finalizarIntro();
            } catch(e) {
                finalizarIntro();
            }
        }

        function finalizarIntro() {
            document.getElementById('intro-screen').classList.remove('active');
            const ui = document.getElementById('ui-wrapper');
            ui.classList.remove('oculto-inicio');
            ui.classList.add('liberado');
        }

        function updateStageProgressBar() {
            if (!player.duration) return;
            const cur = player.currentTime, dur = player.duration, rem = Math.max(0, dur - cur);
            document.getElementById('stage-progress-fill').style.width = (cur / dur) * 100 + '%';
            document.getElementById('stage-time-remaining').innerText = `-${Math.floor(rem/60).toString().padStart(2,'0')}:${Math.floor(rem%60).toString().padStart(2,'0')}`;
        }

        function pararCrossfade() {
            if (singerBgInterval) { clearInterval(singerBgInterval); singerBgInterval = null; }
            if (bgSinger) { bgSinger.style.opacity = '0'; bgSinger.style.backgroundImage = ''; }
            if (bgSinger2) { bgSinger2.style.opacity = '0'; bgSinger2.style.backgroundImage = ''; }
        }

        function iniciarCrossfade(urls) {
            pararCrossfade();
            if (!urls || !urls.length) return;
            bgSinger.style.backgroundImage = `url("${urls[0]}")`;
            bgSinger.style.opacity = '1';
            if (urls.length === 1) return;
            let idx = 0;
            singerBgInterval = setInterval(() => {
                idx = (idx + 1) % urls.length;
                if (camadaAtiva === 1) {
                    bgSinger2.style.backgroundImage = `url("${urls[idx]}")`;
                    bgSinger2.style.opacity = '1'; bgSinger.style.opacity = '0'; camadaAtiva = 2;
                } else {
                    bgSinger.style.backgroundImage = `url("${urls[idx]}")`;
                    bgSinger.style.opacity = '1'; bgSinger2.style.opacity = '0'; camadaAtiva = 1;
                }
            }, 1500);
        }

        async function startPlaylist() {
            if (!queue.length || player.style.display === 'block') return;
            await forcarPaisagem();
            const current = queue[0];
            const nomeMusicaAtual = nomeSemCodigo(current.line, current.code);
            const capaMusica = arquivoDaCapa(nomeMusicaAtual);
            const urls = capaMusica ? [capaMusica.contentUri || URL.createObjectURL(capaMusica)] : [];
            iniciarCrossfade(urls);

            document.body.classList.add('countdown-ativo');
            const songDisplayEl = document.getElementById('song-display');
            songDisplayEl.innerHTML = `${current.line}<br>🎤 <span style="color:var(--emerald);">${current.singer}</span>`;
            timerScreen.classList.add('active');

            const num = document.getElementById('countdown-num');
            for (let i = 5; i >= 0; i--) {
                num.innerText = i;
                await new Promise(r => setTimeout(r, 1000));
            }

            pararCrossfade();
            timerScreen.classList.remove('active');
            document.body.classList.remove('countdown-ativo');

            player.src = current.file.contentUri || URL.createObjectURL(current.file);
            player.style.display = 'block';
            player.play().catch(() => {});
            renderQueue();
        }

        function fecharVideo() {
            pararCrossfade();
            document.body.classList.remove('countdown-ativo');
            player.pause();
            player.src = "";
            player.style.display = 'none';
        }

        async function handleFolderSelect(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            videoFiles = {}; catalog = [];
            for (let f of files) {
                const name = f.name.toUpperCase();
                if (name.endsWith('.MP4') && !name.includes('INTRO')) {
                    const m = name.match(/(\d+)/);
                    const code = m ? m[1].padStart(4, '0') : String(Object.keys(videoFiles).length + 1).padStart(4, '0');
                    videoFiles[code] = f;
                    catalog.push({ code, line: f.name.replace('.mp4','') });
                }
            }
            isVideosLoaded = Object.keys(videoFiles).length > 0;
            document.getElementById('btn-play-bar').disabled = !isVideosLoaded;
            document.getElementById('hero-count').textContent = Object.keys(videoFiles).length;
            logOK(Object.keys(videoFiles).length + ' vídeos carregados.');
        }

        function processarCodigo(code) {
            const padCode = String(code).padStart(4, '0');
            if (!videoFiles[padCode]) return;
            modalTempCode = padCode;
            modalTempNome = catalog.find(c => c.code === padCode)?.line || 'MÚSICA ' + padCode;
            modalTempFile = videoFiles[padCode];
            document.getElementById('modal-cantor-musica-nome').innerText = '#' + padCode + ' - ' + modalTempNome;
            document.getElementById('modal-cantor-input').value = '';
            document.getElementById('modal-cantor-overlay').classList.add('active');
        }

        function confirmarCantor() {
            let singer = document.getElementById('modal-cantor-input').value.trim().toUpperCase() || "CONVIDADO";
            queue.push({ line: modalTempNome, code: modalTempCode, singer: singer, file: modalTempFile });
            renderQueue();
            fecharModalCantor();
        }

        function fecharModalCantor() { document.getElementById('modal-cantor-overlay').classList.remove('active'); }

        function renderQueue() {
            const isPlaying = player.style.display === 'block';
            trackList.innerHTML = queue.map((i, idx) => `
                <div class="item ${idx === 0 && isPlaying ? 'now-playing' : ''}">
                    <div>${idx === 0 && isPlaying ? '<div class="playing-badge">▶ Tocando</div>' : ''}</div>
                    <b>${escHtml(i.line)}</b> - <small style="color:var(--vivid-yellow);">🎤 ${escHtml(i.singer)}</small> (#${i.code})
                </div>
            `).join('');
            document.getElementById('queue-count-badge').innerText = isPlaying ? Math.max(0, queue.length - 1) : queue.length;
        }

        function stopAudio() { fecharVideo(); queue = []; renderQueue(); }
        function limparLista() { queue = []; renderQueue(); }
        function pularMusica() { if (queue.length) player.dispatchEvent(new Event('ended')); }
        function voltarMusica() {}
        function acionarControleApresentacao() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else document.exitFullscreen().catch(() => {});
        }

        function escHtml(t) { return String(t || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }
        function nomeSemCodigo(line, code) { return String(line || '').replace(/^\s*\d+\s*[-–—.:)]?\s*/, '').trim(); }
        function chaveDeBuscaCapa(nome) { return String(nome || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim(); }
        function arquivoDaCapa(nome) { return capasMusicas[chaveDeBuscaCapa(nome)] || null; }

        function abrirCatalogo() {
            document.getElementById('catalogo-overlay').classList.add('active');
            renderCatalogo();
        }
        function fecharCatalogo() { document.getElementById('catalogo-overlay').classList.remove('active'); }
        function filtrarBuscaCatalogo(termo) {
            _termoBuscaCatalogo = termo.toLowerCase();
            renderCatalogo();
        }
        function renderCatalogo() {
            const lista = document.getElementById('cat-lista');
            const itens = catalog.filter(c => c.line.toLowerCase().includes(_termoBuscaCatalogo) || c.code.includes(_termoBuscaCatalogo));
            lista.innerHTML = itens.map(i => `
                <button type="button" class="cat-item" onclick="fecharCatalogo(); processarCodigo('${i.code}')">
                    <span style="color:var(--neon); font-weight:bold;">#${i.code}</span>
                    <span>${escHtml(i.line)}</span>
                </button>
            `).join('');
            document.getElementById('cat-total').textContent = itens.length + ' músicas';
        }
        function selectFolder() { fileInput.click(); }
    </script>
</body>
</html>
