<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VIDEOKE SHOW</title>
  <style>
    :root {
      --bg-dark: #070913;
      --panel-bg: rgba(12, 16, 32, 0.92);
      --gold: #ffd43b;
      --cyan: #38bdf8;
      --neon: #00ffff;
      --magenta: #ff00ff;
      --green: #22c55e;
      --orange: #f97316;
      --pink: #ec4899;
      --purple: #a855f7;
      --blue: #3b82f6;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
      --zoom-duration: 1.05s;
      --zoom-start: 0.44;
      --zoom-end: 1.05;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text);
      font-family: Consolas, "Courier New", monospace, sans-serif;
    }

    #vsk-bg {
      position: fixed;
      inset: 0;
      background-color: var(--bg-dark);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
    }

    #vsk-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      display: none;
      z-index: 5;
    }

    #vsk-video.song-mode {
      object-fit: contain;
    }

    body.intro-fullscreen #vsk-hud,
    body.intro-fullscreen #vsk-dots-btn,
    body.intro-fullscreen #vsk-dots-menu,
    body.intro-fullscreen #vsk-queue-dropdown {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    @keyframes vskSpinDiscreto {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #vsk-load-status {
      position: fixed;
      top: 10px;
      left: 12px;
      z-index: 50;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(7, 9, 19, 0.22);
      color: rgba(248, 250, 252, 0.72);
      opacity: 0.28;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #vsk-load-status.visible {
      display: inline-flex;
    }

    #vsk-load-spinner {
      width: 10px;
      height: 10px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      animation: vskSpinDiscreto 0.9s linear infinite;
    }

    #vsk-load-status.ready #vsk-load-spinner {
      display: none;
    }

    #vsk-load-status.ready {
      opacity: 0.34;
      color: rgba(134, 239, 172, 0.85);
    }

    #vsk-hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 10px;
      transition: opacity 0.2s ease;
    }

    .hud-interactive {
      pointer-events: auto;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      width: 100%;
      position: relative;
    }

    .btn {
      background: var(--panel-bg);
      color: var(--text);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      height: 36px;
      padding: 0 6px;
      font-family: inherit;
      font-size: clamp(9px, 1.35vw, 12px);
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 0;
      min-width: 0;
    }

    .btn:hover, .btn:focus {
      outline: 2px solid #fff;
      filter: brightness(1.15);
    }

    .btn-code   { border-color: var(--green);  color: var(--green); }
    .btn-cat    { border-color: var(--cyan);   color: var(--cyan); }
    .btn-start  { border-color: var(--gold);   color: var(--gold); }
    .btn-skip   { border-color: var(--orange); color: var(--orange); }
    .btn-stop   { border-color: var(--pink);   color: var(--pink); }
    .btn-clear  { border-color: var(--purple); color: var(--purple); }
    .btn-queue  { border-color: var(--blue);   color: var(--blue); flex: 1.45 1 0; }
    .btn-exit   { border-color: var(--red);    color: var(--red); flex: 0 0 36px; width: 36px; padding: 0; font-size: 16px; }

    #vsk-dots-btn {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 35;
      display: none;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 2px solid rgba(255, 212, 59, 0.75);
      background: rgba(10, 14, 28, 0.72);
      color: var(--gold);
      font-family: inherit;
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.65);
    }

    #vsk-dots-btn.visible {
      display: inline-flex;
    }

    #vsk-dots-btn:hover, #vsk-dots-btn:focus {
      outline: 2px solid #fff;
      background: rgba(18, 25, 48, 0.92);
    }

    #vsk-dots-menu {
      position: fixed;
      top: 54px;
      right: 12px;
      z-index: 36;
      display: none;
      flex-direction: column;
      gap: 6px;
      min-width: 190px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(10, 14, 28, 0.95);
      border: 2px solid var(--gold);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.85);
      pointer-events: auto;
    }

    #vsk-dots-menu.open {
      display: flex;
    }

    #vsk-dots-menu .btn {
      flex: none;
      width: 100%;
      justify-content: flex-start;
      padding: 0 12px;
      height: 34px;
    }

    body.hud-collapsed .top-bar,
    body.hud-collapsed .bottom-bar {
      display: none;
    }

    body.hud-collapsed #vsk-queue-dropdown {
      top: 54px;
      right: 206px;
      z-index: 37;
    }

    #vsk-queue-dropdown {
      display: none;
      position: absolute;
      top: 42px;
      right: 40px;
      width: 400px;
      max-width: 82vw;
      max-height: 58vh;
      overflow-y: auto;
      background: var(--panel-bg);
      border: 2px solid var(--blue);
      border-radius: 10px;
      padding: 8px;
      z-index: 25;
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    #vsk-queue-dropdown.open {
      display: block;
    }

    .q-item {
      background: rgba(255, 255, 255, 0.06);
      border-left: 3px solid var(--blue);
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 5px;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .q-item.playing {
      border-left-color: var(--gold);
      background: rgba(255, 212, 59, 0.16);
      color: var(--gold);
      font-weight: bold;
    }

    .q-empty {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 8px 4px;
    }

    #vsk-qr-box {
      display: none;
      text-align: center;
      padding: 6px 0 2px;
    }

    #vsk-qr-box.visible { display: block; }

    #vsk-qr-img {
      width: 92px;
      height: 92px;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
      padding: 4px;
    }

    .bottom-bar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 30px;
      background: transparent;
      border: none;
      padding: 2px 4px;
    }

    .marquee-wrap {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-align: center;
      background: transparent;
      border: none;
      padding: 4px 8px;
    }

    #vsk-marquee {
      display: inline-block;
      margin: 0 auto;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      color: var(--gold);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
    }

    #vsk-mini-count {
      display: none;
      position: relative;
      z-index: 2;
      margin-left: 10px;
      font-family: "Segoe UI", Roboto, "Arial Black", sans-serif;
      font-size: 15px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--cyan);
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.95);
      pointer-events: none;
    }

    #vsk-mini-count.visible {
      display: inline-flex;
      align-items: center;
    }

    #vsk-countdown, #vsk-logo-splash {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 8, 18, 0.62);
      text-align: center;
      padding: 16px 24px;
    }

    #vsk-logo-splash {
      background: rgba(5, 8, 18, 0.92);
    }

    #vsk-countdown.active, #vsk-logo-splash.active {
      display: flex;
    }

    @keyframes vskCountPulse {
      0% {
        transform: scale(0.84);
        opacity: 0.65;
        filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.35));
      }
      50% {
        transform: scale(1.16);
        opacity: 1;
        filter: drop-shadow(0 0 26px rgba(56, 189, 248, 0.9));
      }
      100% {
        transform: scale(0.96);
        opacity: 0.85;
        filter: drop-shadow(0 0 12px rgba(255, 212, 59, 0.55));
      }
    }

    @keyframes vskCoverPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.9));
      }
      50% {
        transform: scale(1.03);
        filter: drop-shadow(0 16px 40px rgba(56, 189, 248, 0.5));
      }
    }

    #vsk-artist-cover {
      width: auto;
      height: auto;
      max-width: min(88vw, 760px);
      max-height: min(60vh, 500px);
      object-fit: contain;
      border-radius: 16px;
      border: 3px solid var(--gold);
      background: rgba(7, 9, 19, 0.88);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.85);
      margin-bottom: 14px;
      display: none;
      animation: vskCoverPulse 1.4s ease-in-out infinite;
    }

    #vsk-count-num {
      font-family: "Segoe UI", Roboto, "Arial Black", sans-serif;
      font-size: clamp(64px, 13vw, 128px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--cyan);
      line-height: 1;
      text-align: center;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.95), 0 0 28px rgba(56, 189, 248, 0.65);
    }

    #vsk-count-num.ticking {
      animation: vskCountPulse 0.96s ease-in-out infinite;
    }

    #vsk-count-info {
      font-family: "Segoe UI", Roboto, sans-serif;
      font-size: clamp(16px, 2.5vw, 24px);
      font-weight: 700;
      margin-top: 10px;
      color: var(--text);
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      max-width: 88vw;
    }

    @keyframes vskLogoZoomIn {
      0% {
        transform: scale(var(--zoom-start));
        opacity: 0;
        filter: drop-shadow(0 0 0 rgba(255, 212, 59, 0));
      }
      78% {
        transform: scale(var(--zoom-end));
        opacity: 1;
        filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.42));
      }
      100% {
        transform: scale(1);
        opacity: 1;
        filter: drop-shadow(0 0 12px rgba(255, 212, 59, 0.25));
      }
    }

    .logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 82vw;
      max-height: 72vh;
    }

    .logo-wrap.animating #logo-target {
      animation: vskLogoZoomIn var(--zoom-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .logo-wrap.dissolving #logo-target {
      opacity: 0.92;
      transition: opacity 0.2s ease-out;
    }

    #logo-target {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #vsk-splash-logo {
      max-width: 78vw;
      max-height: 68vh;
      object-fit: contain;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.82);
      padding: 8px;
    }

    .modal.active { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 520px;
      max-height: 94vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #0d1326;
      border: 2px solid var(--cyan);
      border-radius: 12px;
      padding: 10px 12px;
      gap: 8px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: bold;
      color: var(--gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .numpad-display {
      background: #060913;
      border: 1px solid var(--green);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .numpad-code {
      font-size: clamp(20px, 4.5vh, 26px);
      font-weight: bold;
      color: var(--gold);
      letter-spacing: 3px;
    }

    .numpad-preview {
      font-size: 11px;
      color: var(--cyan);
      min-height: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .numpad-key {
      height: clamp(32px, 8.8vh, 44px);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: #121b34;
      color: var(--text);
      font-family: inherit;
      font-size: clamp(13px, 2.8vh, 17px);
      font-weight: bold;
      cursor: pointer;
    }

    .numpad-key:hover, .numpad-key:focus {
      border-color: var(--gold);
      color: var(--gold);
      outline: 2px solid var(--gold);
    }

    .input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: #060913;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
    }

    .input:focus {
      outline: 2px solid var(--gold);
      border-color: var(--gold);
    }

    #cat-results {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 55vh;
    }

    .cat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 7px 9px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .cat-row:hover, .cat-row:focus, .cat-row.selected {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--gold);
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .beat-impact {
      transform: scale(1.05) translateZ(0) !important;
      filter: none !important;
    }

    #tornado-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 28;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(ellipse at center,
        rgba(30, 5, 50, 0.5) 0%,
        rgba(10, 0, 20, 0.85) 50%,
        rgba(0, 0, 0, 0.95) 100%);
      will-change: transform;
    }

    body.modo-jb #tornado-layer {
      display: flex;
    }

    body.modo-jb #vsk-hud {
      opacity: 0;
      pointer-events: none;
    }

    #ceu-rockdoido {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(180deg,
        rgba(10, 0, 20, 0.85) 0%,
        rgba(21, 0, 37, 0.75) 25%,
        rgba(32, 0, 48, 0.7) 50%,
        rgba(21, 0, 37, 0.75) 75%,
        rgba(10, 0, 20, 0.85) 100%);
      z-index: 1001;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    body.modo-jb.tem-slide #ceu-rockdoido {
      opacity: 0.15;
    }

    #bg-singer-layer-rock {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-size: contain;
      background-position: center center;
      background-repeat: no-repeat;
      background-color: transparent !important;
      z-index: 1005;
      opacity: 0;
      transition: opacity 0.25s ease-in-out;
      will-change: opacity, background-image, transform;
      pointer-events: none;
      filter: none !important;
      -webkit-filter: none !important;
    }

    #bg-singer-layer-rock.ativo {
      opacity: 1 !important;
    }

    #raio-flash {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at 30% 20%,
        rgba(255, 255, 255, 0.34) 0%,
        rgba(220, 240, 255, 0.30) 20%,
        rgba(180, 200, 255, 0.22) 40%,
        rgba(100, 100, 200, 0.10) 70%,
        rgba(0, 0, 0, 0) 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 1100;
      mix-blend-mode: screen;
    }

    #raio-flash.ativo { animation: flashRaio 0.6s ease-out; }

    @keyframes flashRaio {
      0% { opacity: 0; }
      3% { opacity: 1; }
      8% { opacity: 0.2; }
      12% { opacity: 0.95; }
      18% { opacity: 0.3; }
      25% { opacity: 0.7; }
      40% { opacity: 0.1; }
      100% { opacity: 0; }
    }

    #raio-svg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1105;
      opacity: 0;
      pointer-events: none;
    }

    #raio-svg.ativo { animation: relampago 0.5s ease-out; }

    @keyframes relampago {
      0% { opacity: 0; }
      5% { opacity: 1; }
      10% { opacity: 0.3; }
      15% { opacity: 1; }
      25% { opacity: 0.4; }
      35% { opacity: 0.9; }
      50% { opacity: 0.2; }
      100% { opacity: 0; }
    }

    .relampago-fundo {
      position: absolute;
      width: 200%;
      height: 100px;
      background: radial-gradient(ellipse at center,
        rgba(200, 220, 255, 0.4) 0%,
        rgba(150, 180, 255, 0.2) 30%,
        transparent 70%);
      filter: blur(20px);
      opacity: 0;
      pointer-events: none;
      z-index: 1020;
    }

    .relampago-fundo.ativo {
      animation: relampagoFundo 0.8s ease-out;
    }

    @keyframes relampagoFundo {
      0% { opacity: 0; transform: scaleY(0.5); }
      20% { opacity: 0.8; transform: scaleY(1.2); }
      40% { opacity: 0.3; }
      60% { opacity: 0.6; }
      100% { opacity: 0; transform: scaleY(1); }
    }

    .chuva-zona {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      pointer-events: none;
    }
    .chuva-zona:nth-child(1) { z-index: 1040; }
    .chuva-zona:nth-child(2) { z-index: 1045; }
    .chuva-zona:nth-child(3) { z-index: 1050; }
    .chuva-zona:nth-child(4) { z-index: 1055; }
    .chuva-zona:nth-child(5) { z-index: 1060; }

    .gota {
      position: absolute;
      top: -30px;
      background: linear-gradient(180deg,
        rgba(200, 220, 255, 0) 0%,
        rgba(200, 220, 255, 0.5) 40%,
        rgba(200, 220, 255, 0.8) 60%,
        rgba(255, 255, 255, 0.95) 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: cairGota linear infinite;
      will-change: transform;
      filter: drop-shadow(0 0 2px rgba(200, 220, 255, 0.7));
    }

    @keyframes cairGota {
      0% { transform: translateY(-30px) translateX(0) scaleY(1); opacity: 0; }
      5% { opacity: 1; }
      95% { opacity: 1; }
      100% { transform: translateY(110vh) translateX(-40px) scaleY(1.8); opacity: 0.2; }
    }

    .gota.gigante {
      width: 4px; height: 35px;
      background: linear-gradient(180deg,
        rgba(220, 235, 255, 0) 0%,
        rgba(220, 235, 255, 0.9) 50%,
        rgba(255, 255, 255, 1) 100%);
      filter: drop-shadow(0 0 4px rgba(200, 220, 255, 1));
      z-index: 1060;
    }
    .gota.grande {
      width: 3px; height: 28px;
      background: linear-gradient(180deg,
        rgba(220, 235, 255, 0) 0%,
        rgba(220, 235, 255, 0.85) 60%,
        rgba(255, 255, 255, 1) 100%);
      filter: drop-shadow(0 0 3px rgba(200, 220, 255, 0.9));
      z-index: 1055;
    }
    .gota.media { width: 2px; height: 20px; z-index: 1050; }
    .gota.fina { width: 1px; height: 14px; opacity: 0.6; z-index: 1045; }
    .gota.ultra-fina { width: 1px; height: 10px; opacity: 0.4; z-index: 1040; }

    @keyframes tremorTela {
      0% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-3px, 2px) rotate(-0.3deg); }
      20% { transform: translate(3px, -2px) rotate(0.3deg); }
      30% { transform: translate(-2px, -3px) rotate(-0.2deg); }
      40% { transform: translate(2px, 3px) rotate(0.2deg); }
      50% { transform: translate(-3px, -1px) rotate(-0.3deg); }
      60% { transform: translate(3px, 1px) rotate(0.3deg); }
      70% { transform: translate(-1px, 2px) rotate(-0.1deg); }
      80% { transform: translate(1px, -2px) rotate(0.1deg); }
      90% { transform: translate(-2px, 1px) rotate(-0.2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    #tornado-layer.tremendo {
      animation: tremorTela 0.4s ease-out;
    }

    #tornado-layer::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 120px;
      background: linear-gradient(0deg,
        rgba(150, 180, 255, 0.25) 0%,
        rgba(100, 130, 200, 0.1) 50%,
        rgba(0, 0, 0, 0) 100%);
      z-index: 1065;
      pointer-events: none;
      filter: blur(8px);
    }

    #jorge-voador {
      position: absolute;
      top: 9%; left: 0; width: 100%;
      font-size: clamp(20px, 4vw, 42px);
      font-weight: 900;
      color: #fff;
      text-align: center;
      text-shadow:
        0 0 20px var(--neon),
        0 0 40px var(--magenta),
        0 0 60px var(--neon),
        0 0 80px var(--magenta),
        0 0 100px var(--neon);
      animation: twisterMove 4s infinite linear;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1200;
      letter-spacing: 4px;
    }

    @keyframes twisterMove {
      0% { transform: scale(0.1) rotate(0deg); opacity: 0; filter: blur(8px); }
      50% { transform: scale(1.3) rotate(720deg); opacity: 1; filter: blur(0px); }
      100% { transform: scale(0.1) rotate(1440deg); opacity: 0; filter: blur(8px); }
    }

    #clarao-geral {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: #fff;
      opacity: 0;
      z-index: 1090;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    #clarao-geral.ativo { animation: claraoOnda 0.4s ease-out; }

    @keyframes claraoOnda {
      0% { opacity: 0; }
      15% { opacity: 0.9; }
      30% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0; }
    }

    #vsk-folder-input { display: none; }
  </style>
</head>
<body>
  <div id="vsk-bg"></div>
  <video id="vsk-video" playsinline preload="auto" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>

  <div id="vsk-load-status" aria-hidden="true">
    <span id="vsk-load-spinner"></span>
    <span id="vsk-load-label">LOAD</span>
  </div>

  <div id="tornado-layer">
    <div id="bg-singer-layer-rock"></div>
    <div id="ceu-rockdoido"></div>

    <div class="relampago-fundo" id="relampago-fundo-1" style="top: 10%; left: -50%;"></div>
    <div class="relampago-fundo" id="relampago-fundo-2" style="top: 25%; left: 0%;"></div>
    <div class="relampago-fundo" id="relampago-fundo-3" style="top: 15%; left: -30%;"></div>

    <div id="raio-flash"></div>
    <div id="clarao-geral"></div>

    <svg id="raio-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="glow-forte">
          <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <g id="grupo-raios"></g>
    </svg>

    <div class="chuva-zona" id="chuva-zona-1"></div>
    <div class="chuva-zona" id="chuva-zona-2"></div>
    <div class="chuva-zona" id="chuva-zona-3"></div>
    <div class="chuva-zona" id="chuva-zona-4"></div>
    <div class="chuva-zona" id="chuva-zona-5"></div>
  </div>

  <div id="vsk-hud">
    <div class="top-bar hud-interactive">
      <button class="btn btn-code" onclick="abrirTecladoCodigo()">CÓDIGO</button>
      <button class="btn btn-cat" onclick="abrirCatalogoVsk()">CATÁLOGO</button>
      <button class="btn btn-start" onclick="vskStart()">INICIAR</button>
      <button class="btn btn-skip" onclick="vskSkip()">PULAR</button>
      <button class="btn btn-stop" onclick="vskStop()">PARAR</button>
      <button class="btn btn-clear" onclick="vskClear()">LIMPAR</button>
      <button id="vsk-btn-queue" class="btn btn-queue" onclick="alternarFilaDropdown()">FILA (<span id="vsk-q-count">0</span>)</button>
      <button id="vsk-btn-exit" class="btn btn-exit" title="SAIR" aria-label="SAIR">⏻</button>
    </div>

    <div class="bottom-bar hud-interactive">
      <div class="marquee-wrap">
        <div id="vsk-marquee">★ VIDEOKE SHOW ★ AGUARDANDO SELEÇÃO DE MÚSICAS ★</div>
      </div>
      <div id="vsk-mini-count"></div>
    </div>
  </div>

  <button id="vsk-dots-btn" type="button" title="Menu" aria-label="Menu" onclick="alternarMenuPontinhos(event)">⋮</button>
  <div id="vsk-dots-menu" class="hud-interactive">
    <button class="btn btn-code" type="button" onclick="acaoMenuPontinhos('codigo')">CÓDIGO</button>
    <button class="btn btn-cat" type="button" onclick="acaoMenuPontinhos('catalogo')">CATÁLOGO</button>
    <button class="btn btn-queue" type="button" onclick="acaoMenuPontinhos('fila')">VER FILA (<span id="vsk-dots-q-count">0</span>)</button>
    <button class="btn btn-skip" type="button" onclick="acaoMenuPontinhos('pular')">PULAR</button>
    <button class="btn btn-stop" type="button" onclick="acaoMenuPontinhos('parar')">PARAR</button>
    <button class="btn btn-start" type="button" onclick="acaoMenuPontinhos('barra')">MOSTRAR BARRA</button>
  </div>

  <div id="vsk-queue-dropdown">
    <div id="vsk-queue-items"></div>
    <div id="vsk-qr-box">
      <img id="vsk-qr-img" alt="QR Lista" />
    </div>
  </div>

  <div id="vsk-countdown">
    <img id="vsk-artist-cover" alt="Capa do Artista" />
    <div id="vsk-count-num">5</div>
    <div id="vsk-count-info"></div>
  </div>

  <div id="vsk-logo-splash">
    <div id="vsk-logo-wrap" class="logo-wrap">
      <div id="logo-target">
        <img id="vsk-splash-logo" alt="" />
      </div>
    </div>
  </div>

  <div id="modal-numpad" class="modal">
    <div class="modal-card">
      <div class="modal-title">
        <span>DIGITAR CÓDIGO</span>
        <button class="btn btn-stop" style="flex:0 0 auto;height:28px;padding:0 10px;" onclick="fecharTecladoCodigo()">FECHAR</button>
      </div>
      <div class="numpad-display">
        <div id="numpad-code" class="numpad-code">----</div>
        <div id="numpad-preview" class="numpad-preview">Digite os números do código</div>
      </div>
      <div class="numpad-grid">
        <button class="numpad-key" onclick="teclaNumpad('1')">1</button>
        <button class="numpad-key" onclick="teclaNumpad('2')">2</button>
        <button class="numpad-key" onclick="teclaNumpad('3')">3</button>
        <button class="numpad-key" onclick="teclaNumpad('4')">4</button>
        <button class="numpad-key" onclick="teclaNumpad('5')">5</button>
        <button class="numpad-key" onclick="teclaNumpad('6')">6</button>
        <button class="numpad-key" onclick="teclaNumpad('7')">7</button>
        <button class="numpad-key" onclick="teclaNumpad('8')">8</button>
        <button class="numpad-key" onclick="teclaNumpad('9')">9</button>
        <button class="numpad-key" style="color:var(--orange);border-color:var(--orange)" onclick="limparNumpad()">LIMPAR</button>
        <button class="numpad-key" onclick="teclaNumpad('0')">0</button>
        <button class="numpad-key" style="color:var(--green);border-color:var(--green)" onclick="confirmarNumpad()">OK</button>
      </div>
    </div>
  </div>

  <div id="modal-cat" class="modal">
    <div class="modal-card">
      <div class="modal-title">CATÁLOGO DE MÚSICAS</div>
      <input id="cat-search" class="input" type="text" placeholder="Buscar por código, música ou artista..." oninput="filtrarCatalogoVsk(this.value)" />
      <div id="cat-results"></div>
      <div class="modal-actions">
        <button class="btn btn-stop" style="flex:0 0 auto;padding:0 14px;" onclick="fecharCatalogoVsk()">FECHAR</button>
      </div>
    </div>
  </div>

  <input id="vsk-folder-input" type="file" webkitdirectory directory multiple />

  <script>
    const ROCKDOIDO_CODE = '1308801393';

    const state = {
      songs: {}, list: [], queue: [], covers: {}, intros: [], txtMeta: {},
      rockSlides: [], rockAudioFile: null, rockAudioUrl: '',
      defaultIntroUrl: 'intro.mp4',
      logoUrl: '', qrUrl: null, qrHidden: false,
      buffer: '', numpadBuffer: '', bufTimer: null,
      introRunning: false, introDone: false, folderPicking: false, loadingSongs: false,
      songActive: false, hudCollapsed: false, rockdoidoActive: false
    };

    const video = document.getElementById('vsk-video');
    let audioRockDoido = null;
    let rockSlideInterval = null;
    let rockRaioInterval = null;
    let rockRaioMultiploInterval = null;
    let encerrarIntroAtual = null;

    function atualizarIndicadorLoad(modo) {
      const box = document.getElementById('vsk-load-status');
      const label = document.getElementById('vsk-load-label');
      if (!box || !label) return;
      if (modo === 'load') {
        label.textContent = 'LOAD';
        box.classList.remove('ready');
        box.classList.add('visible');
      } else if (modo === 'ok') {
        label.textContent = 'OK';
        box.classList.add('ready');
        box.classList.add('visible');
      } else {
        box.classList.remove('visible', 'ready');
      }
    }

    async function forcarTelaCheiaPaisagemIntro() {
      try { if (window.AndroidHost && AndroidHost.setOrientation) AndroidHost.setOrientation(0); } catch (_) {}
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await Promise.race([
            document.documentElement.requestFullscreen({ navigationUI: 'hide' }),
            new Promise(resolve => setTimeout(resolve, 1000))
          ]);
        }
      } catch (_) {}
      try {
        if (screen.orientation && screen.orientation.lock) {
          await Promise.race([
            screen.orientation.lock('landscape'),
            new Promise(resolve => setTimeout(resolve, 1000))
          ]);
        }
      } catch (_) {}
    }

    function aplicarEstadoTelaIntro() {
      if (state.introRunning && !state.songActive && state.queue.length === 0) {
        document.body.classList.add('intro-fullscreen');
        video.classList.remove('song-mode');
      } else {
        document.body.classList.remove('intro-fullscreen');
      }
    }

    function resolverLogoPadrao() {
      if (window.AndroidHost) {
        return 'file:///android_asset/logo.png';
      }
      return 'logo.png';
    }

    function resolverUrlIntroPadrao() {
      if (window.AndroidHost) {
        return 'file:///android_asset/intro.mp4';
      }
      return state.defaultIntroUrl || 'intro.mp4';
    }

    function aplicarEstadoBotoesHud() {
      const dotsBtn = document.getElementById('vsk-dots-btn');
      const dotsMenu = document.getElementById('vsk-dots-menu');
      if (state.hudCollapsed) {
        document.body.classList.add('hud-collapsed');
        dotsBtn.classList.add('visible');
      } else {
        document.body.classList.remove('hud-collapsed');
        dotsBtn.classList.remove('visible');
        dotsMenu.classList.remove('open');
      }
    }

    function recolherBotoesParaPontinhos() {
      state.hudCollapsed = true;
      aplicarEstadoBotoesHud();
    }

    function restaurarBarraCompleta() {
      state.hudCollapsed = false;
      document.getElementById('vsk-queue-dropdown').classList.remove('open');
      aplicarEstadoBotoesHud();
    }

    function alternarMenuPontinhos(ev) {
      if (ev) ev.stopPropagation();
      document.getElementById('vsk-dots-menu').classList.toggle('open');
    }

    function acaoMenuPontinhos(acao) {
      document.getElementById('vsk-dots-menu').classList.remove('open');
      if (acao === 'codigo') {
        abrirTecladoCodigo();
      } else if (acao === 'catalogo') {
        abrirCatalogoVsk();
      } else if (acao === 'fila') {
        alternarFilaDropdown();
      } else if (acao === 'pular') {
        vskSkip();
      } else if (acao === 'parar') {
        vskStop();
        restaurarBarraCompleta();
      } else if (acao === 'barra') {
        restaurarBarraCompleta();
      }
    }

    function gerarChuvaRockdoido() {
      const zonas = [
        { id: 'chuva-zona-1', qtd: 70, tipo: 'ultra-fina' },
        { id: 'chuva-zona-2', qtd: 60, tipo: 'fina' },
        { id: 'chuva-zona-3', qtd: 50, tipo: 'media' },
        { id: 'chuva-zona-4', qtd: 35, tipo: 'grande' },
        { id: 'chuva-zona-5', qtd: 20, tipo: 'gigante' }
      ];

      zonas.forEach(cfg => {
        const zona = document.getElementById(cfg.id);
        if (!zona) return;
        zona.innerHTML = '';
        for (let i = 0; i < cfg.qtd; i++) {
          const gota = document.createElement('div');
          gota.className = 'gota ' + cfg.tipo;
          gota.style.left = (Math.random() * 120 - 10) + '%';
          let velocidadeBase = 0.4;
          if (cfg.tipo === 'fina') velocidadeBase = 0.5;
          else if (cfg.tipo === 'media') velocidadeBase = 0.6;
          else if (cfg.tipo === 'grande') velocidadeBase = 0.7;
          else if (cfg.tipo === 'gigante') velocidadeBase = 0.85;
          gota.style.animationDuration = (velocidadeBase + Math.random() * 0.3) + 's';
          gota.style.animationDelay = (Math.random() * 2) + 's';
          gota.style.opacity = (Math.random() * 0.3 + 0.5).toFixed(2);
          zona.appendChild(gota);
        }
      });
    }

    function gerarCaminhoRaio(startX, startY) {
      let x = startX;
      let y = startY;
      let d = `M ${x} ${y}`;
      const segmentos = 10 + Math.floor(Math.random() * 6);
      for (let i = 0; i < segmentos; i++) {
        x += (Math.random() - 0.5) * 180;
        y += 1000 / segmentos;
        d += ` L ${x.toFixed(0)} ${y.toFixed(0)}`;
      }
      return d;
    }

    function gerarRamoRaio(x, y) {
      let px = x;
      let py = y;
      let d = `M ${px} ${py}`;
      const segmentos = 3 + Math.floor(Math.random() * 4);
      for (let i = 0; i < segmentos; i++) {
        px += (Math.random() - 0.5) * 250;
        py += 80 + Math.random() * 80;
        d += ` L ${px.toFixed(0)} ${py.toFixed(0)}`;
      }
      return d;
    }

    function dispararRaioRockdoido() {
      const flash = document.getElementById('raio-flash');
      const svg = document.getElementById('raio-svg');
      const grupo = document.getElementById('grupo-raios');
      const clarao = document.getElementById('clarao-geral');
      const tornado = document.getElementById('tornado-layer');
      if (!grupo) return;

      grupo.innerHTML = '';
      const qtdRaios = 2 + Math.floor(Math.random() * 3);
      const corRaio = Math.random() < 0.3 ? '#aaccff' : '#ffffff';
      const espessuraBase = 2 + Math.random() * 3;

      for (let i = 0; i < qtdRaios; i++) {
        const startX = Math.random() * 1000;
        const caminho = gerarCaminhoRaio(startX, -20);

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', caminho);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', corRaio);
        path.setAttribute('stroke-width', espessuraBase + Math.random() * 2);
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        path.setAttribute('filter', 'url(#glow-forte)');
        path.setAttribute('opacity', 0.9);
        grupo.appendChild(path);

        const qtdRamos = 1 + Math.floor(Math.random() * 2);
        for (let j = 0; j < qtdRamos; j++) {
          const ramoX = startX + (Math.random() - 0.5) * 200;
          const ramoY = 200 + Math.random() * 400;
          const ramo = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          ramo.setAttribute('d', gerarRamoRaio(ramoX, ramoY));
          ramo.setAttribute('fill', 'none');
          ramo.setAttribute('stroke', corRaio);
          ramo.setAttribute('stroke-width', (espessuraBase * 0.5) + Math.random());
          ramo.setAttribute('stroke-linecap', 'round');
          ramo.setAttribute('filter', 'url(#glow)');
          ramo.setAttribute('opacity', 0.6);
          grupo.appendChild(ramo);
        }
      }

      if (flash) {
        flash.classList.remove('ativo');
        void flash.offsetWidth;
        flash.classList.add('ativo');
      }
      if (svg) {
        svg.classList.remove('ativo');
        void svg.offsetWidth;
        svg.classList.add('ativo');
      }
      if (clarao && Math.random() < 0.6) {
        clarao.classList.remove('ativo');
        void clarao.offsetWidth;
        clarao.classList.add('ativo');
      }
      if (tornado) {
        tornado.classList.remove('tremendo');
        void tornado.offsetWidth;
        tornado.classList.add('tremendo');
      }
      if (Math.random() < 0.3) {
        const fundos = ['relampago-fundo-1', 'relampago-fundo-2', 'relampago-fundo-3'];
        const fundo = document.getElementById(fundos[Math.floor(Math.random() * fundos.length)]);
        if (fundo) {
          fundo.classList.remove('ativo');
          void fundo.offsetWidth;
          fundo.classList.add('ativo');
        }
      }
    }

    function iniciarRaiosRockdoido() {
      pararRaiosRockdoido();
      setTimeout(() => dispararRaioRockdoido(), 350);
      rockRaioInterval = setInterval(() => dispararRaioRockdoido(), 450 + Math.random() * 450);
      rockRaioMultiploInterval = setInterval(() => {
        setTimeout(() => dispararRaioRockdoido(), 100);
        setTimeout(() => dispararRaioRockdoido(), 250);
        setTimeout(() => dispararRaioRockdoido(), 400);
      }, 3000 + Math.random() * 2500);
    }

    function pararRaiosRockdoido() {
      if (rockRaioInterval) { clearInterval(rockRaioInterval); rockRaioInterval = null; }
      if (rockRaioMultiploInterval) { clearInterval(rockRaioMultiploInterval); rockRaioMultiploInterval = null; }
      const grupo = document.getElementById('grupo-raios');
      if (grupo) grupo.innerHTML = '';
    }

    async function tocarAudioRockdoido() {
      pararAudioRockdoido();

      if (audioRockDoido && audioRockDoido.src) {
        try {
          audioRockDoido.currentTime = 0;
          audioRockDoido.volume = 1.0;
          audioRockDoido.muted = false;
          await audioRockDoido.play();
          return true;
        } catch (_) {}
      }

      if (state.rockAudioFile && state.rockAudioFile.contentUri && window.AndroidHost && AndroidHost.readDataUrl) {
        try {
          const dataUrl = AndroidHost.readDataUrl(state.rockAudioFile.contentUri);
          if (dataUrl && dataUrl.startsWith('data:')) {
            audioRockDoido = new Audio(dataUrl);
            audioRockDoido.loop = true;
            audioRockDoido.volume = 1.0;
            state.rockAudioUrl = dataUrl;
            await audioRockDoido.play();
            return true;
          }
        } catch (_) {}
      }

      const candidatos = [];
      if (state.rockAudioUrl) candidatos.push(state.rockAudioUrl);
      candidatos.push(
        'ROCKDOIDO/easteregg.mp3',
        'ROCKDOIDO/audio.mp3',
        'ROCKDOIDO/musica.mp3',
        'ROCKDOIDO/som.mp3',
        'MODO ROCKDOIDO/easteregg.mp3',
        'MODO ROCKDOIDO/mp3/easteregg.mp3',
        'easteregg.mp3'
      );

      for (const src of candidatos) {
        try {
          const el = new Audio(src);
          el.loop = true;
          el.volume = 1.0;
          await el.play();
          audioRockDoido = el;
          return true;
        } catch (_) {}
      }
      return false;
    }

    function pararAudioRockdoido() {
      if (audioRockDoido) {
        try {
          audioRockDoido.pause();
          audioRockDoido.currentTime = 0;
          audioRockDoido.muted = false;
        } catch (_) {}
      }
    }

    function iniciarSlidesRockdoido() {
      if (rockSlideInterval) {
        clearInterval(rockSlideInterval);
        rockSlideInterval = null;
      }

      const slideLayer = document.getElementById('bg-singer-layer-rock');
      if (!slideLayer) return;

      const lista = state.rockSlides || [];
      if (!lista.length) {
        document.body.classList.remove('tem-slide');
        slideLayer.style.opacity = '0';
        slideLayer.style.backgroundImage = '';
        slideLayer.classList.remove('ativo');
        return;
      }

      document.body.classList.add('tem-slide');
      slideLayer.style.backgroundSize = 'contain';
      slideLayer.style.backgroundPosition = 'center center';
      slideLayer.style.backgroundRepeat = 'no-repeat';
      slideLayer.style.backgroundColor = 'transparent';
      slideLayer.style.zIndex = '1005';
      slideLayer.style.opacity = '1';
      slideLayer.classList.add('ativo');

      const urls = lista.map(s => {
        if (s.contentUri) return null;
        if (s.dataUrl) return s.dataUrl;
        try { return s.url || (s instanceof File ? URL.createObjectURL(s) : null); }
        catch (_) { return null; }
      });

      let indicesRestantes = [];
      let ultimoIndice = -1;

      const sortearProximo = () => {
        if (!indicesRestantes.length) {
          indicesRestantes = Array.from({ length: lista.length }, (_, i) => i);
          for (let i = indicesRestantes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [indicesRestantes[i], indicesRestantes[j]] = [indicesRestantes[j], indicesRestantes[i]];
          }
          if (indicesRestantes.length > 1 && indicesRestantes[indicesRestantes.length - 1] === ultimoIndice) {
            [indicesRestantes[0], indicesRestantes[indicesRestantes.length - 1]] = [indicesRestantes[indicesRestantes.length - 1], indicesRestantes[0]];
          }
        }
        ultimoIndice = indicesRestantes.pop();
        return ultimoIndice;
      };

      const trocarSlide = () => {
        const idx = sortearProximo();
        const item = lista[idx];
        let url = urls[idx];
        if (!url && item && item.contentUri && window.AndroidHost && AndroidHost.readDataUrl) {
          try { url = AndroidHost.readDataUrl(item.contentUri) || item.contentUri; }
          catch (_) { url = item.contentUri; }
        }
        if (!url && item) url = item.contentUri || item.url || '';
        slideLayer.style.backgroundImage = url ? `url("${url}")` : 'none';
        slideLayer.style.opacity = '1';
        slideLayer.classList.add('beat-impact');
        setTimeout(() => slideLayer.classList.remove('beat-impact'), 100);
      };

      trocarSlide();
      rockSlideInterval = setInterval(trocarSlide, 500);
    }

    function processarCodigoEspecial(digits) {
      const clean = (digits || '').trim();
      if (!clean) return false;
      if (clean === ROCKDOIDO_CODE) {
        alternarModoRockdoido();
        return true;
      }
      if (clean === '999999999') {
        state.qrHidden = !state.qrHidden;
        atualizarFilaVsk();
        return true;
      }
      return false;
    }

    function finalizarIntroQuandoPronto() {
      if (typeof encerrarIntroAtual === 'function') {
        encerrarIntroAtual();
      } else if (state.introRunning && !state.songActive && state.queue.length === 0) {
        state.introRunning = false;
        state.introDone = true;
        atualizarIndicadorLoad(null);
        aplicarEstadoTelaIntro();
        video.loop = false;
        video.pause();
        video.style.display = 'none';
        video.removeAttribute('src');
        video.load();
      }
    }

    function iniciarLoopIntroCarregamento() {
      if (state.rockdoidoActive || state.introRunning || state.introDone || state.songActive || state.queue.length > 0) return;
      state.introRunning = true;
      atualizarIndicadorLoad(state.loadingSongs ? 'load' : 'ok');
      aplicarEstadoTelaIntro();
      forcarTelaCheiaPaisagemIntro();

      const srcUrl = (state.intros && state.intros.length > 0 && state.intros[0].url)
        ? state.intros[0].url
        : resolverUrlIntroPadrao();

      video.classList.remove('song-mode');
      video.style.display = 'block';
      video.loop = !state.loadingSongs ? false : true;
      video.src = srcUrl;

      let checkFinishInterval = null;
      let finishFallbackTimer = null;

      const encerrarIntro = () => {
        if (checkFinishInterval) {
          clearInterval(checkFinishInterval);
          checkFinishInterval = null;
        }
        if (finishFallbackTimer) {
          clearTimeout(finishFallbackTimer);
          finishFallbackTimer = null;
        }
        if (encerrarIntroAtual === encerrarIntro) {
          encerrarIntroAtual = null;
        }
        state.introRunning = false;
        state.introDone = true;
        atualizarIndicadorLoad(null);
        aplicarEstadoTelaIntro();
        video.loop = false;
        video.removeEventListener('ended', onEndedCycle);
        video.removeEventListener('error', onErrorFallback);
        video.pause();
        video.style.display = 'none';
        video.removeAttribute('src');
        video.load();
      };

      encerrarIntroAtual = encerrarIntro;

      const onEndedCycle = () => {
        if (!state.loadingSongs && !state.songActive && state.queue.length === 0) {
          encerrarIntro();
        }
      };

      const onErrorFallback = () => {
        if (video.src !== state.defaultIntroUrl && state.defaultIntroUrl) {
          video.src = state.defaultIntroUrl;
          video.play().catch(() => {});
          return;
        }
        encerrarIntro();
      };

      video.addEventListener('ended', onEndedCycle);
      video.addEventListener('error', onErrorFallback);

      checkFinishInterval = setInterval(() => {
        if (!state.loadingSongs && state.introRunning && !state.songActive && state.queue.length === 0) {
          video.loop = false;
          atualizarIndicadorLoad('ok');
          if (video.ended || video.paused || video.readyState === 0) {
            encerrarIntro();
          } else if (!finishFallbackTimer) {
            const restanteMs = (Number.isFinite(video.duration) && Number.isFinite(video.currentTime))
              ? Math.max(150, Math.min(8000, Math.ceil((video.duration - video.currentTime) * 1000) + 250))
              : 1500;
            finishFallbackTimer = setTimeout(() => {
              if (!state.loadingSongs && state.introRunning && !state.songActive && state.queue.length === 0) {
                encerrarIntro();
              }
            }, restanteMs);
          }
        } else if (state.loadingSongs && state.introRunning) {
          atualizarIndicadorLoad('load');
        }
      }, 150);

      video.play().catch(() => {
        video.muted = true;
        video.play().catch(() => {});
      });
    }

    function normalizarChave(str) {
      return (str || '')
        .replace(/\.[^.]+$/, '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^A-Za-z0-9 ]/g, ' ')
        .replace(/\s+/g, ' ')
        .toUpperCase()
        .trim();
    }

    function contarMusicasArtista(artist) {
      const chave = normalizarChave(artist);
      if (!chave) return 0;
      let total = 0;
      for (const s of state.list) {
        if (normalizarChave(s.artist) === chave) total++;
      }
      for (const q of state.queue) {
        if (normalizarChave(q.artist) === chave) total++;
      }
      return Math.max(total, 1);
    }

    function buscarCapaArtista(artist) {
      const chave = normalizarChave(artist);
      if (!chave) return null;

      if (state.covers[chave]) return state.covers[chave];

      const keys = Object.keys(state.covers);
      for (const k of keys) {
        if (k === chave || k.includes(chave) || chave.includes(k)) {
          return state.covers[k];
        }
      }

      const tokensArtista = chave.split(' ').filter(t => t.length >= 2);
      if (tokensArtista.length > 0) {
        let melhorChave = null;
        let melhorScore = 0;
        for (const k of keys) {
          const tokensCapa = k.split(' ').filter(Boolean);
          let score = 0;
          for (const tk of tokensArtista) {
            if (tokensCapa.includes(tk)) score++;
          }
          if (score > melhorScore) {
            melhorScore = score;
            melhorChave = k;
          }
        }
        if (melhorChave && melhorScore >= Math.min(2, tokensArtista.length)) {
          return state.covers[melhorChave];
        }
      }

      return null;
    }

    function limparTextoExibicao(str) {
      return (str || '')
        .replace(/_/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .toUpperCase();
    }

    function parseLinhaCatalogo(rawName) {
      const semExt = (rawName || '').replace(/\.mp4$/i, '').trim();
      const m = semExt.match(/^(\d{1,6})\s*[-–—]\s*(.+)$/);
      if (!m) return null;

      const code = m[1].padStart(4, '0');
      const resto = m[2].trim();
      const partes = resto.split(/\s*[-–—]\s*/).map(p => p.trim()).filter(Boolean);

      let artist = '';
      let title = '';

      if (partes.length >= 2) {
        if (/^karaok[eê]$/i.test(partes[1]) && partes.length >= 3) {
          artist = partes[0];
          title = partes.slice(2).join(' - ');
        } else {
          artist = partes[0];
          title = partes.slice(1).join(' - ');
        }
      } else {
        title = partes[0] || resto;
      }

      if (/^artista desconhecido$/i.test(artist)) artist = '';
      title = limparTextoExibicao(title);
      artist = limparTextoExibicao(artist);

      return { code, title: title || code, artist };
    }

    function processarTextoLista(texto) {
      const linhas = (texto || '').split(/\r?\n/);
      for (const l of linhas) {
        const clean = l.replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
        if (!clean || clean.startsWith('===') || /^LISTA DE M/i.test(clean)) continue;
        const parsed = parseLinhaCatalogo(clean);
        if (parsed) {
          state.txtMeta[parsed.code] = parsed;
        }
      }
    }

    async function carregarArquivosVsk(files) {
      state.loadingSongs = true;
      iniciarLoopIntroCarregamento();
      atualizarIndicadorLoad('load');

      const novosSongs = {};
      const novaLista = [];
      const novasCapas = {};
      const novasIntros = [];
      const novosRockSlides = [];
      let novoRockAudioFile = null;
      let novoRockAudioUrl = '';
      let pastaLogoUrl = '';
      state.txtMeta = {};

      for (const f of files) {
        const name = f.name || '';
        const low = name.toLowerCase();
        if (low.endsWith('.txt')) {
          try {
            let txt = '';
            if (f.contentUri && window.AndroidHost && AndroidHost.readText) {
              txt = AndroidHost.readText(f.contentUri) || '';
            } else if (f.text) {
              txt = await f.text();
            }
            if (txt) processarTextoLista(txt);
          } catch (_) {}
        }
      }

      for (const f of files) {
        const name = f.name || '';
        const low = name.toLowerCase();
        const relPathUpper = (f.webkitRelativePath || f.path || name)
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toUpperCase()
          .replace(/\\/g, '/');
        const srcUrl = f.contentUri || (f instanceof File ? URL.createObjectURL(f) : '');

        if (low === 'logo.png' || low === 'logo.jpg') {
          pastaLogoUrl = srcUrl;
        }

        if (low === 'qrlista.png') {
          state.qrUrl = srcUrl;
        }

        if (low === 'bgpadrao.jpg' || low === 'bgpadrao.png') {
          document.getElementById('vsk-bg').style.backgroundImage = `url("${srcUrl}")`;
        }

        const ehCapa = /(^|\/)CAPAS?(\/|$)/i.test(relPathUpper) && /\.(jpe?g|png|webp|gif)$/i.test(low);
        if (ehCapa) {
          const chaveCapa = normalizarChave(name);
          if (chaveCapa) novasCapas[chaveCapa] = srcUrl;
        }

        const ehPastaRock = /(^|\/)(MODO\s*ROCKDOIDO|ROCKDOIDO|ROCK\s*DOIDO|SLIDES)(\/|$)/i.test(relPathUpper);
        if (ehPastaRock && /\.(jpe?g|png|webp|gif|bmp)$/i.test(low)) {
          novosRockSlides.push({
            name,
            url: srcUrl,
            contentUri: f.contentUri || null
          });
        }

        if (ehPastaRock && low.endsWith('.mp3') && !novoRockAudioFile) {
          novoRockAudioFile = f;
          novoRockAudioUrl = srcUrl;
          if (f.contentUri && window.AndroidHost && AndroidHost.readDataUrl) {
            try {
              const inlineAudio = AndroidHost.readDataUrl(f.contentUri);
              if (inlineAudio && inlineAudio.startsWith('data:')) {
                novoRockAudioUrl = inlineAudio;
              }
            } catch (_) {}
          }
        }

        if (/^intro[1-5]?\.mp4$/i.test(low)) {
          novasIntros.push({ name: low, url: srcUrl });
          continue;
        }

        if (low.endsWith('.mp4')) {
          const parsedFile = parseLinhaCatalogo(name);
          const mOnlyCode = !parsedFile ? name.match(/^(\d{1,6})\.mp4$/i) : null;
          const code = parsedFile ? parsedFile.code : (mOnlyCode ? mOnlyCode[1].padStart(4, '0') : null);

          if (code) {
            const fromTxt = state.txtMeta[code];
            const title = (fromTxt && fromTxt.title) || (parsedFile && parsedFile.title) || code;
            const artist = (fromTxt && fromTxt.artist) || (parsedFile && parsedFile.artist) || '';
            const item = { code, title, artist, file: f, url: srcUrl };
            novosSongs[code] = item;
            novaLista.push(item);
          }
        }
      }

      novosIntros.sort((a, b) => a.name.localeCompare(b.name));
      novaLista.sort((a, b) => a.title.localeCompare(b.title));
      novosRockSlides.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

      state.songs = novosSongs;
      state.list = novaLista;
      state.covers = novasCapas;
      state.rockSlides = novosRockSlides;
      state.rockAudioFile = novoRockAudioFile;
      state.rockAudioUrl = novoRockAudioUrl;
      if (novasIntros.length) state.intros = novasIntros;

      if (novoRockAudioUrl) {
        audioRockDoido = new Audio(novoRockAudioUrl);
        audioRockDoido.loop = true;
        audioRockDoido.volume = 1.0;
        audioRockDoido.preload = 'auto';
        audioRockDoido.load();
      }

      state.logoUrl = pastaLogoUrl || resolverLogoPadrao();
      const splashImg = document.getElementById('vsk-splash-logo');
      if (splashImg && state.logoUrl) {
        splashImg.src = state.logoUrl;
      }

      state.loadingSongs = false;
      atualizarFilaVsk();

      if (state.introRunning && !state.songActive && state.queue.length === 0) {
        video.loop = false;
        atualizarIndicadorLoad('ok');
        if (video.ended || video.paused || video.readyState === 0) {
          finalizarIntroQuandoPronto();
        }
      } else {
        atualizarIndicadorLoad(null);
      }
    }

    function rodarZoomLogo(splashEl, wrapEl, imgEl) {
      return new Promise((resolve) => {
        const zoomMs = 1050;
        let done = false;

        const finish = () => {
          if (done) return;
          done = true;
          wrapEl.classList.remove('animating', 'dissolving');
          splashEl.classList.remove('active');
          resolve();
        };

        splashEl.classList.add('active');
        wrapEl.classList.remove('animating', 'dissolving');
        void wrapEl.offsetWidth;
        wrapEl.classList.add('animating');

        setTimeout(() => {
          wrapEl.classList.add('dissolving');
          setTimeout(finish, 200);
        }, zoomMs);
      });
    }

    function alternarFilaDropdown() {
      document.getElementById('vsk-queue-dropdown').classList.toggle('open');
    }

    function abrirTecladoCodigo() {
      state.numpadBuffer = '';
      atualizarNumpadDisplay();
      document.getElementById('modal-numpad').classList.add('active');
    }

    function fecharTecladoCodigo() {
      document.getElementById('modal-numpad').classList.remove('active');
    }

    function limparNumpad() {
      state.numpadBuffer = '';
      atualizarNumpadDisplay();
    }

    function teclaNumpad(digito) {
      if (state.numpadBuffer.length >= 12) return;
      state.numpadBuffer += digito;
      atualizarNumpadDisplay();
    }

    function buscarMusicaPorCodigo(rawDigits) {
      const clean = (rawDigits || '').trim();
      if (!clean) return null;
      const padded = clean.padStart(4, '0');
      const base = state.songs[padded] || state.songs[clean] || null;
      const txtInfo = state.txtMeta[padded] || state.txtMeta[clean] || null;

      if (!base && !txtInfo) return null;
      const code = (txtInfo && txtInfo.code) || (base && base.code) || padded;
      const title = (txtInfo && txtInfo.title) || (base && base.title) || code;
      const artist = (txtInfo && txtInfo.artist) || (base && base.artist) || '';

      return {
        ...(base || {}),
        code,
        title,
        artist
      };
    }

    function adicionarMusicaNaFila(song) {
      if (!song) return;
      state.queue.push({ ...song });
      atualizarFilaVsk();
    }

    function atualizarNumpadDisplay() {
      const digits = state.numpadBuffer;
      const displayCode = document.getElementById('numpad-code');
      const previewEl = document.getElementById('numpad-preview');

      displayCode.textContent = digits ? (digits.length <= 4 ? digits.padEnd(4, '-') : digits) : '----';
      const s = buscarMusicaPorCodigo(digits);
      previewEl.textContent = s
        ? formatarLinhaFila(s)
        : (digits ? `Código ${digits.padStart(4, '0')}` : 'Digite os números do código');
    }

    function confirmarNumpad() {
      const val = state.numpadBuffer.trim();
      if (!val) return;
      fecharTecladoCodigo();
      if (processarCodigoEspecial(val)) return;
      const s = buscarMusicaPorCodigo(val);
      if (s) {
        adicionarMusicaNaFila(s);
      } else {
        document.getElementById('numpad-preview').textContent = `Código ${val.padStart(4, '0')} não encontrado`;
      }
    }

    function atualizarOsd(digits) {
      const s = buscarMusicaPorCodigo(digits);
      document.getElementById('vsk-marquee').textContent = s
        ? `CÓDIGO: ${formatarLinhaFila(s)}`
        : `DIGITANDO CÓDIGO: ${digits}`;
    }

    function moverSelecaoCatalogo(delta) {
      const modal = document.getElementById('modal-cat');
      if (!modal || !modal.classList.contains('active')) return false;
      const rows = Array.from(document.querySelectorAll('#cat-results .cat-row'));
      if (!rows.length) return false;
      let idx = rows.findIndex(el => el.classList.contains('selected') || el === document.activeElement);
      if (idx === -1) idx = 0;
      else idx = (idx + delta + rows.length) % rows.length;
      rows.forEach(r => r.classList.remove('selected'));
      rows[idx].classList.add('selected');
      rows[idx].focus();
      rows[idx].scrollIntoView({ block: 'nearest' });
      return true;
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key;
      const codeKey = e.code;
      const numpadOpen = document.getElementById('modal-numpad').classList.contains('active');
      const catOpen = document.getElementById('modal-cat').classList.contains('active');

      if (numpadOpen) {
        if (key >= '0' && key <= '9') { e.preventDefault(); teclaNumpad(key); return; }
        if (key === 'Backspace') { e.preventDefault(); state.numpadBuffer = state.numpadBuffer.slice(0, -1); atualizarNumpadDisplay(); return; }
        if (key === 'Enter' || codeKey === 'NumpadEnter') { e.preventDefault(); confirmarNumpad(); return; }
        if (key === 'Escape') { e.preventDefault(); fecharTecladoCodigo(); return; }
      }

      if (document.activeElement && document.activeElement.tagName === 'INPUT') {
        if (key === 'ArrowDown' && catOpen) {
          e.preventDefault();
          moverSelecaoCatalogo(1);
        } else if (key === 'Escape') {
          e.preventDefault();
          if (catOpen) fecharCatalogoVsk();
        }
        return;
      }

      if (catOpen) {
        if (key === 'ArrowDown') { e.preventDefault(); moverSelecaoCatalogo(1); return; }
        if (key === 'ArrowUp') { e.preventDefault(); moverSelecaoCatalogo(-1); return; }
        if (key === 'Enter' || codeKey === 'NumpadEnter') {
          e.preventDefault();
          const sel = document.querySelector('#cat-results .cat-row.selected') || (document.activeElement && document.activeElement.classList.contains('cat-row') ? document.activeElement : null);
          if (sel) sel.click();
          return;
        }
        if (key === 'Escape' || key === 'Backspace') {
          e.preventDefault();
          fecharCatalogoVsk();
          return;
        }
      }

      if (key >= '0' && key <= '9') {
        state.buffer += key;
        if (state.buffer === ROCKDOIDO_CODE) {
          clearTimeout(state.bufTimer);
          state.buffer = '';
          alternarModoRockdoido();
          return;
        }
        if (!state.rockdoidoActive) {
          atualizarOsd(state.buffer);
        }
        clearTimeout(state.bufTimer);
        state.bufTimer = setTimeout(() => {
          const val = state.buffer;
          state.buffer = '';
          if (processarCodigoEspecial(val)) return;
          const s = buscarMusicaPorCodigo(val);
          if (s) adicionarMusicaNaFila(s);
        }, 1400);
        return;
      }

      if (state.rockdoidoActive) return;

      if (key === 'MediaTrackNext' || key === 'n' || key === 'N') {
        e.preventDefault();
        vskSkip();
      } else if (key === 'MediaStop' || key === 's' || key === 'S') {
        e.preventDefault();
        vskStop();
      } else if (key === 'MediaPlayPause' || key === ' ') {
        if (state.songActive && video.style.display === 'block') {
          e.preventDefault();
          if (video.paused) video.play().catch(() => {});
          else video.pause();
        } else if (state.queue.length > 0) {
          e.preventDefault();
          vskStart();
        }
      } else if (key === 'c' || key === 'C' || key === 'F2') {
        e.preventDefault();
        abrirCatalogoVsk();
      } else if (key === 'Escape' || key === 'Backspace') {
        e.preventDefault();
        fecharTecladoCodigo();
        fecharCatalogoVsk();
        document.getElementById('vsk-queue-dropdown').classList.remove('open');
        document.getElementById('vsk-dots-menu').classList.remove('open');
      }
    });

    document.addEventListener('click', (e) => {
      const dotsBtn = document.getElementById('vsk-dots-btn');
      const dotsMenu = document.getElementById('vsk-dots-menu');
      const qDrop = document.getElementById('vsk-queue-dropdown');
      const qBtn = document.getElementById('vsk-btn-queue');
      if (dotsMenu && dotsBtn && !dotsMenu.contains(e.target) && !dotsBtn.contains(e.target)) {
        dotsMenu.classList.remove('open');
      }
      if (qDrop && !qDrop.contains(e.target) && (!qBtn || !qBtn.contains(e.target)) && !e.target.closest('#vsk-dots-menu')) {
        qDrop.classList.remove('open');
      }
    });

    function formatarLinhaFila(item) {
      return `${item.code} - ${item.title}${item.artist ? ' - ' + item.artist : ''}`;
    }

    function atualizarMiniContagem(valorTexto) {
      const mini = document.getElementById('vsk-mini-count');
      if (!mini) return;
      if (valorTexto) {
        mini.textContent = valorTexto;
        mini.classList.add('visible');
      } else {
        mini.textContent = '';
        mini.classList.remove('visible');
      }
    }

    function atualizarFilaVsk() {
      const itemsBox = document.getElementById('vsk-queue-items');
      const qrBox = document.getElementById('vsk-qr-box');
      document.getElementById('vsk-q-count').textContent = state.queue.length;
      const dotsCount = document.getElementById('vsk-dots-q-count');
      if (dotsCount) dotsCount.textContent = state.queue.length;

      itemsBox.innerHTML = '';
      if (state.queue.length === 0) {
        itemsBox.innerHTML = '<div class="q-empty">Fila vazia</div>';
        if (state.qrUrl && !state.qrHidden) {
          document.getElementById('vsk-qr-img').src = state.qrUrl;
          qrBox.classList.add('visible');
        } else qrBox.classList.remove('visible');
        if (!state.rockdoidoActive) {
          document.getElementById('vsk-marquee').textContent = '★ VIDEOKE SHOW ★ AGUARDANDO SELEÇÃO DE MÚSICAS ★';
        }
        return;
      }
      qrBox.classList.remove('visible');
      state.queue.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'q-item' + (i === 0 && state.songActive ? ' playing' : '');
        div.textContent = formatarLinhaFila(item);
        itemsBox.appendChild(div);
      });
      const cur = state.queue[0];
      if (!state.rockdoidoActive) {
        document.getElementById('vsk-marquee').textContent = `▶ TOCANDO AGORA: ${formatarLinhaFila(cur)}`;
      }
    }

    async function vskStart() {
      if (!state.queue.length || state.songActive || state.rockdoidoActive) return;
      state.songActive = true;
      state.introDone = true;
      state.introRunning = false;
      atualizarIndicadorLoad(null);
      aplicarEstadoTelaIntro();
      video.loop = false;
      video.pause();
      video.classList.add('song-mode');
      video.style.display = 'none';

      recolherBotoesParaPontinhos();

      const cur = state.queue[0];
      const cd = document.getElementById('vsk-countdown');
      const countNumEl = document.getElementById('vsk-count-num');
      const splash = document.getElementById('vsk-logo-splash');
      const wrap = document.getElementById('vsk-logo-wrap');
      const splashImg = document.getElementById('vsk-splash-logo');
      const coverImg = document.getElementById('vsk-artist-cover');

      const qtdCantor = contarMusicasArtista(cur.artist);
      const coverUrl = buscarCapaArtista(cur.artist);
      if (coverUrl && qtdCantor >= 1) {
        coverImg.src = coverUrl;
        coverImg.style.display = 'block';
      } else {
        coverImg.removeAttribute('src');
        coverImg.style.display = 'none';
      }

      document.getElementById('vsk-count-info').textContent = formatarLinhaFila(cur);
      cd.classList.add('active');
      for (let i = 5; i >= 1; i--) {
        if (!state.songActive || state.rockdoidoActive) {
          cd.classList.remove('active');
          atualizarMiniContagem('');
          return;
        }
        countNumEl.textContent = i;
        countNumEl.classList.remove('ticking');
        void countNumEl.offsetWidth;
        countNumEl.classList.add('ticking');
        atualizarMiniContagem(String(i));
        await new Promise(r => setTimeout(r, 1000));
      }
      countNumEl.classList.remove('ticking');
      cd.classList.remove('active');
      atualizarMiniContagem('');

      const logoSrc = state.logoUrl || resolverLogoPadrao();
      if (logoSrc && splashImg && !state.rockdoidoActive) {
        splashImg.src = logoSrc;
        await rodarZoomLogo(splash, wrap, splashImg);
      }

      if (!state.songActive || state.rockdoidoActive) return;
      video.muted = false;
      video.src = cur.url || (cur.file && (cur.file.contentUri || URL.createObjectURL(cur.file))) || '';
      if (!video.src) {
        video.dispatchEvent(new Event('ended'));
        return;
      }
      video.classList.add('song-mode');
      video.style.display = 'block';
      await video.play().catch(() => {});
      atualizarFilaVsk();
    }

    video.ontimeupdate = () => {
      if (!video.duration || !state.songActive) return;
      const rem = Math.max(0, Math.floor(video.duration - video.currentTime));
      atualizarMiniContagem(`-${String(Math.floor(rem / 60)).padStart(2,'0')}:${String(rem % 60).padStart(2,'0')}`);
    };

    video.onended = () => {
      if (!state.songActive) return;
      state.songActive = false;
      atualizarMiniContagem('');
      video.style.display = 'none';
      video.removeAttribute('src');
      video.load();
      state.queue.shift();
      atualizarFilaVsk();
      if (state.queue.length > 0 && !state.rockdoidoActive) {
        vskStart();
      } else {
        restaurarBarraCompleta();
      }
    };

    function vskStop() {
      state.songActive = false;
      atualizarMiniContagem('');
      document.getElementById('vsk-countdown').classList.remove('active');
      document.getElementById('vsk-logo-splash').classList.remove('active');
      video.pause();
      video.loop = false;
      video.style.display = 'none';
      video.removeAttribute('src');
      video.load();
      if (state.queue.length > 0) {
        state.queue.shift();
      }
      atualizarFilaVsk();
      restaurarBarraCompleta();
    }

    function vskSkip() {
      if (state.songActive && state.queue.length) {
        video.dispatchEvent(new Event('ended'));
      } else if (state.queue.length) {
        state.queue.shift();
        atualizarFilaVsk();
      }
    }

    function vskClear() {
      state.queue = state.songActive ? state.queue.slice(0, 1) : [];
      atualizarFilaVsk();
    }

    function abrirCatalogoVsk() {
      document.getElementById('modal-cat').classList.add('active');
      filtrarCatalogoVsk('');
      setTimeout(() => document.getElementById('cat-search').focus(), 60);
    }

    function fecharCatalogoVsk() {
      document.getElementById('modal-cat').classList.remove('active');
    }

    function filtrarCatalogoVsk(q) {
      const term = q.trim().toLowerCase();
      const res = state.list.filter(s => !term || s.code.includes(term) || s.title.toLowerCase().includes(term) || s.artist.toLowerCase().includes(term));
      const box = document.getElementById('cat-results');
      box.innerHTML = res.slice(0, 200).map((s, i) =>
        `<button class="cat-row${i === 0 ? ' selected' : ''}" onclick='selecionarDoCat("${s.code}")'><span><b style="color:var(--gold)">${s.code}</b> - ${s.title}</span><small style="color:var(--cyan)">${s.artist}</small></button>`
      ).join('');
    }

    function selecionarDoCat(code) {
      fecharCatalogoVsk();
      const s = buscarMusicaPorCodigo(code);
      if (s) adicionarMusicaNaFila(s);
    }

    document.getElementById('vsk-btn-exit').onclick = () => {
      if (window.AndroidHost && AndroidHost.exitApp) AndroidHost.exitApp();
      else window.close();
    };

    window.addEventListener('load', () => {
      state.logoUrl = resolverLogoPadrao();
      const splashImg = document.getElementById('vsk-splash-logo');
      if (splashImg && state.logoUrl) {
        splashImg.src = state.logoUrl;
      }
      if (!window.AndroidHost) {
        abrirPastaVsk();
      }
    });
  </script>
</body>
</html>
