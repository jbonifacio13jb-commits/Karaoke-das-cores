<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KARAOKÊ FESTA DAS CORES</title>

    <link rel="icon" id="app-icon-link" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><radialGradient id=%22g%22 cx=%2250%%22 cy=%2250%%22 r=%2250%%22><stop offset=%220%%22 stop-color=%22%230d0d14%22/><stop offset=%22100%%22 stop-color=%22%23050508%22/></radialGradient><linearGradient id=%22l%22 x1=%220%%22 y1=%220%%22 x2=%22100%%22 y2=%22100%%22><stop offset=%220%%22 stop-color=%22%2300ffff%22/><stop offset=%22100%%22 stop-color=%22%23ff00ff%22/></linearGradient></defs><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22url(%23g)%22/><g stroke=%22url(%23l)%22 fill=%22none%22 stroke-width=%224%22 stroke-linecap=%22round%22><path d=%22M50,20 L50,60 M35,45 C35,65 65,65 65,45%22/></g><circle cx=%2250%22 cy=%2250%22 r=%2240%22 stroke=%22url(%23l)%22 stroke-width=%221%22 fill=%22none%22 opacity=%220.3%22/></svg>">

    <style>
        @font-face { font-family: 'Orbitron'; src: url('fontes/Orbitron-Bold.ttf') format('truetype'), url('fontes/Orbitron-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
        @font-face { font-family: 'Orbitron'; src: url('fontes/Orbitron-Black.ttf') format('truetype'), url('fontes/Orbitron-Black.woff2') format('woff2'); font-weight: 900; font-display: swap; }
        @font-face { font-family: 'Rajdhani'; src: url('fontes/Rajdhani-SemiBold.ttf') format('truetype'), url('fontes/Rajdhani-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
        @font-face { font-family: 'Rajdhani'; src: url('fontes/Rajdhani-Bold.ttf') format('truetype'), url('fontes/Rajdhani-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }

        :root {
            --font-title: 'Orbitron', 'Arial Black', 'Impact', sans-serif;
            --font-body: 'Rajdhani', 'Arial', 'Helvetica', sans-serif;
            --neon: #29e7ff;
            --magenta: #ff2fb9;
            --violet: #8b5cf6;
            --vivid-yellow: #ffdd00;
            --emerald: #00ff88;
            --dark-bg: #05050b;
            --panel-bg: #0c0c18;
            --icone-size: 42px;
            --grad-neon: linear-gradient(135deg, #29e7ff 0%, #8b5cf6 52%, #ff2fb9 100%);
            --grad-neon-soft: linear-gradient(135deg, rgba(41, 231, 255, 0.16), rgba(139, 92, 246, 0.16), rgba(255, 47, 185, 0.16));
        }

        * {
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top left, #120b29 0%, var(--dark-bg) 55%, #070312 100%);
            color: #eef2ff;
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #ui-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            z-index: 10;
        }

        .stage {
            height: 320px;
            width: 100%;
            position: relative;
            background: #000;
            overflow: hidden;
            flex-shrink: 0;
            border-bottom: 2.5px solid transparent;
            border-image: var(--grad-neon) 1;
            box-shadow: 0 4px 26px rgba(139, 92, 246, 0.35);
            z-index: 200;
        }

        body.fullscreen-mode .stage {
            height: 100vh !important;
            width: 100vw !important;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            border: none;
        }

        /* TELA DE INTRO EM VÍDEO (IMEDIATA / PROTETOR DE TELA) */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999998;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #intro-screen.active {
            display: flex !important;
        }
        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
        #intro-curtain {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #000;
            pointer-events: none;
        }
        #intro-curtain.hidden {
            display: none;
        }
        #intro-error {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
            padding: 24px;
            color: #fff;
            text-align: center;
            font: 700 20px var(--font-title);
            background: rgba(0, 0, 0, .94);
        }
        #intro-error.active {
            display: flex;
        }
        #intro-error button {
            padding: 16px 24px;
            border: 0;
            border-radius: 12px;
            color: #000;
            background: linear-gradient(135deg, var(--emerald), var(--neon));
            font: 700 16px var(--font-title);
            cursor: pointer;
        }

        /* BACKGROUND 100% NÍTIDO SEM OPACIDADE REDUZIDA OU PELÍCULA ESCURA */
        .stage-background {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 1;
            opacity: 1 !important;
            filter: none !important;
            -webkit-filter: none !important;
            transition: opacity 0.35s ease;
        }
        body.countdown-ativo .stage-background {
            opacity: 0 !important;
        }

        #bg-singer-layer,
        #bg-singer-layer-2 {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            background-size: contain;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.35s ease-in-out;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            filter: none !important;
            -webkit-filter: none !important;
            will-change: opacity, transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }

        body.modo-jb #bg-singer-layer,
        body.modo-jb #bg-singer-layer-2 {
            filter: none !important;
            -webkit-filter: none !important;
            opacity: 1;
        }

        body.countdown-ativo #bg-singer-layer,
        body.countdown-ativo #bg-singer-layer-2 {
            filter: none !important;
        }

        .beat-impact {
            transform: scale(1.05) translateZ(0) !important;
            filter: none !important;
        }

        /* MODO ROCKDOIDO (1308801393) */
        #tornado-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                rgba(48, 8, 92, 0.35) 0%,
                rgba(10, 12, 36, 0.72) 55%,
                rgba(0, 0, 0, 0.9) 100%);
            will-change: transform;
        }
        body.modo-jb #tornado-layer {
            display: flex;
        }

        #ceu-rockdoido {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg,
                rgba(8, 12, 34, 0.68) 0%,
                rgba(24, 6, 52, 0.55) 50%,
                rgba(5, 10, 28, 0.72) 100%);
            z-index: 1001;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        body.modo-jb.tem-slide #ceu-rockdoido {
            opacity: 0.14;
        }

        #bg-singer-layer-rock {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center center;
            background-repeat: no-repeat;
            background-color: transparent !important;
            z-index: 1005;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
            will-change: opacity, background-image;
            pointer-events: none;
            filter: none !important;
            -webkit-filter: none !important;
        }
        #bg-singer-layer-rock.ativo {
            opacity: 1 !important;
        }

        #raio-flash {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            z-index: 1100;
            mix-blend-mode: screen;
        }
        #raio-flash.ativo.raio-branco {
            background: radial-gradient(ellipse at 50% 18%,
                rgba(255, 255, 255, 0.85) 0%,
                rgba(225, 245, 255, 0.45) 40%,
                rgba(0, 0, 0, 0) 100%);
            animation: flashRaio 0.36s ease-out;
        }
        #raio-flash.ativo.raio-azul {
            background: radial-gradient(ellipse at 50% 18%,
                rgba(30, 175, 255, 0.85) 0%,
                rgba(0, 110, 255, 0.45) 42%,
                rgba(0, 0, 0, 0) 100%);
            animation: flashRaio 0.36s ease-out;
        }
        @keyframes flashRaio {
            0% { opacity: 0; }
            8% { opacity: 1; }
            22% { opacity: 0.25; }
            36% { opacity: 0.95; }
            62% { opacity: 0.35; }
            100% { opacity: 0; }
        }

        #raio-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1105;
            opacity: 0;
            pointer-events: none;
        }
        #raio-svg.ativo {
            animation: relampago 0.38s ease-out;
        }
        @keyframes relampago {
            0% { opacity: 0; }
            7% { opacity: 1; }
            20% { opacity: 0.35; }
            34% { opacity: 1; }
            60% { opacity: 0.45; }
            100% { opacity: 0; }
        }

        .relampago-fundo {
            position: absolute;
            width: 200%;
            height: 110px;
            background: radial-gradient(ellipse at center,
                rgba(130, 215, 255, 0.55) 0%,
                rgba(40, 145, 255, 0.25) 40%,
                transparent 75%);
            filter: blur(18px);
            opacity: 0;
            pointer-events: none;
            z-index: 1020;
        }
        .relampago-fundo.ativo {
            animation: relampagoFundo 0.45s ease-out;
        }
        @keyframes relampagoFundo {
            0% { opacity: 0; transform: scaleY(0.6); }
            25% { opacity: 0.9; transform: scaleY(1.25); }
            65% { opacity: 0.4; }
            100% { opacity: 0; transform: scaleY(1); }
        }

        .chuva-zona {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1045;
        }

        .gota {
            position: absolute;
            top: -30px;
            background: linear-gradient(180deg,
                rgba(200, 225, 255, 0) 0%,
                rgba(160, 210, 255, 0.55) 45%,
                rgba(255, 255, 255, 0.95) 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: cairGota linear infinite;
            will-change: transform;
        }
        @keyframes cairGota {
            0% { transform: translateY(-30px) translateX(0) scaleY(1); opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { transform: translateY(110vh) translateX(-42px) scaleY(1.8); opacity: 0.2; }
        }
        .gota.gigante { width: 4px; height: 35px; }
        .gota.grande { width: 3px; height: 28px; }
        .gota.media { width: 2px; height: 20px; }
        .gota.fina { width: 1.5px; height: 14px; opacity: 0.65; }
        .gota.ultra-fina { width: 1px; height: 10px; opacity: 0.45; }

        @keyframes tremorTela {
            0% { transform: translate(0, 0) rotate(0deg); }
            15% { transform: translate(-4px, 2px) rotate(-0.35deg); }
            35% { transform: translate(4px, -2px) rotate(0.35deg); }
            55% { transform: translate(-3px, 3px) rotate(-0.25deg); }
            75% { transform: translate(3px, -1px) rotate(0.25deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        #tornado-layer.tremendo {
            animation: tremorTela 0.32s ease-out;
        }

        #jorge-voador {
            position: absolute;
            top: 9%;
            left: 0;
            width: 100%;
            font-family: var(--font-title);
            font-size: clamp(20px, 4vw, 42px);
            font-weight: 900;
            color: #fff;
            text-align: center;
            text-shadow: 0 0 20px var(--neon), 0 0 40px var(--magenta), 0 0 60px var(--neon);
            animation: twisterMove 4s infinite linear;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1200;
            letter-spacing: 4px;
        }
        @keyframes twisterMove {
            0% { transform: scale(0.1) rotate(0deg); opacity: 0; filter: blur(8px); }
            50% { transform: scale(1.3) rotate(720deg); opacity: 1; filter: blur(0px); }
            100% { transform: scale(0.1) rotate(1440deg); opacity: 0; filter: blur(8px); }
        }

        #clarão-geral {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            z-index: 1090;
            pointer-events: none;
            mix-blend-mode: overlay;
        }
        #clarão-geral.ativo {
            animation: clarãoOnda 0.3s ease-out;
        }
        @keyframes clarãoOnda {
            0% { opacity: 0; }
            20% { opacity: 0.9; }
            55% { opacity: 0.35; }
            100% { opacity: 0; }
        }

        #video-player {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 10;
            display: none;
            background: #000;
            opacity: 0;
            transition: opacity 0.4s;
        }

        /* CAPA DO ARTISTA NA CONTAGEM REGRESSIVA: PAISAGEM SEM CORTAR/DISTORCER + GLASS LATERAL */
        #artist-countdown-backdrop {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: none;
            overflow: hidden;
            pointer-events: none;
            background: #05050d;
        }
        body.countdown-ativo #artist-countdown-backdrop.has-artist-cover {
            display: block;
        }
        #artist-cover-blur {
            position: absolute;
            inset: -24px;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            filter: blur(22px) saturate(1.3) brightness(0.68);
            -webkit-filter: blur(22px) saturate(1.3) brightness(0.68);
            transform: scale(1.08);
        }
        #artist-cover-glass-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(5, 6, 18, 0.38), rgba(139, 92, 246, 0.16), rgba(5, 6, 18, 0.38));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #artist-cover-main {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            z-index: 2;
            filter: drop-shadow(0 0 26px rgba(0, 0, 0, 0.8));
        }

        #timer-screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent;
            pointer-events: none;
        }
        #timer-screen.active {
            display: flex !important;
        }

        #countdown-num {
            position: absolute;
            z-index: 10001;
            top: max(7vh, 28px);
            right: max(6vw, 24px);
            display: grid;
            place-items: center;
            color: rgba(255, 221, 0, .92);
            font: 900 clamp(72px, 14vw, 140px)/1 var(--font-title);
            letter-spacing: 2px;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 2px 12px rgba(0, 0, 0, .95), 0 0 22px rgba(255, 47, 185, .55);
            -webkit-text-stroke: 1px rgba(41, 231, 255, .45);
            transform-style: preserve-3d;
            transform-origin: top center;
            will-change: transform, opacity;
        }
        #countdown-num.rodando {
            animation: numeroContagemRotativo 0.95s cubic-bezier(.22,.68,.2,1) both;
        }
        @keyframes numeroContagemRotativo {
            0% { opacity: 0; transform: perspective(800px) rotateY(-270deg) scale(.35) scaleY(1.18); }
            32% { opacity: 1; transform: perspective(800px) rotateY(-12deg) scale(1.15) scaleY(1.18); }
            62% { opacity: 1; transform: perspective(800px) rotateY(0deg) scale(1) scaleY(1.18); }
            100% { opacity: 0; transform: perspective(800px) rotateY(270deg) scale(.55) scaleY(1.18); }
        }

        #song-display {
            position: absolute;
            left: 50%;
            bottom: calc(var(--icone-size) + 18px);
            transform: translateX(-50%);
            width: 92%;
            max-height: 74px;
            overflow: hidden;
            z-index: 10001;
            color: var(--vivid-yellow);
            font-family: var(--font-title);
            font-size: 14px !important;
            line-height: 1.35;
            font-weight: 700;
            text-align: center;
            white-space: pre-line;
            text-shadow: 0 2px 6px rgba(0, 0, 0, .98), 0 0 14px rgba(0, 0, 0, .92);
            pointer-events: none;
        }
        #song-display .countdown-singer {
            color: var(--emerald);
        }

        /* BARRA DE PROGRESSO TRANSPARENTE SEM GLASS E INTERATIVA */
        #stage-bottom-bar {
            position: absolute;
            bottom: 8px;
            left: 1.5%;
            width: 97%;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 99999;
            opacity: 0.96;
            transition: opacity 0.25s;
            pointer-events: auto;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
        }
        body.fullscreen-mode #stage-bottom-bar {
            position: fixed !important;
            bottom: 8px !important;
            left: 1.5% !important;
            width: 97% !important;
            z-index: 99999 !important;
        }
        #stage-bottom-bar:hover {
            opacity: 1;
        }

        .btn-bar-transp {
            background: transparent !important;
            border: 1.5px solid rgba(41, 231, 255, 0.72) !important;
            color: #fff;
            width: var(--icone-size);
            height: var(--icone-size);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            flex-shrink: 0;
            padding: 0;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 12px rgba(139, 92, 246, 0.45) !important;
        }
        .btn-bar-transp:hover,
        .btn-bar-transp:focus {
            background: var(--grad-neon) !important;
            border-color: var(--vivid-yellow) !important;
            color: #05050b;
            box-shadow: 0 0 18px rgba(41, 231, 255, 0.9), 0 0 22px rgba(255, 47, 185, 0.7) !important;
            transform: scale(1.08);
        }
        .btn-bar-transp:active {
            transform: scale(0.92);
        }
        .btn-bar-transp svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.95));
        }
        .btn-bar-transp:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        #stage-progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent !important;
            padding: 6px 12px;
            border-radius: 22px;
            border: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
            height: var(--icone-size);
            cursor: pointer;
            touch-action: none;
        }
        #stage-progress-bar-bg {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.28);
            border-radius: 6px;
            overflow: visible;
            position: relative;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.92);
        }
        #stage-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon), var(--magenta), var(--vivid-yellow));
            border-radius: 6px;
            transition: width 0.08s linear;
            box-shadow: 0 0 12px rgba(41, 231, 255, 0.9);
            position: relative;
        }
        #stage-progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--magenta);
            box-shadow: 0 0 10px var(--neon);
        }
        #stage-time-remaining {
            font-family: var(--font-title);
            font-size: 13px;
            font-weight: 800;
            color: var(--vivid-yellow);
            text-shadow: 0 1px 4px #000, 0 0 10px #000;
            min-width: 58px;
            text-align: right;
            pointer-events: none;
        }

        /* LETREIRO TRANSPARENTE EM TODA A LARGURA COM VELOCIDADE LEGÍVEL */
        #marquee-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            background: transparent !important;
            border: none !important;
            border-radius: 0;
            padding: 8px 0 !important;
            z-index: 99999;
            overflow: hidden;
            display: block;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
            pointer-events: none;
            min-height: 40px;
        }
        body.fullscreen-mode #marquee-container {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100vw !important;
            background: transparent !important;
            border: none !important;
            z-index: 99999 !important;
            padding-top: max(8px, env(safe-area-inset-top, 0px)) !important;
        }
        #marquee-text {
            display: inline-block;
            white-space: nowrap;
            color: var(--vivid-yellow);
            animation: marqueeAnim 32s linear infinite;
            font-family: var(--font-title);
            font-size: clamp(15px, 2.3vw, 28px);

<body>

    <script>
        (function () {
            'use strict';

            // 1. DETECÇÃO INTELIGENTE DE DISPOSITIVO (TV BOX / SMART TV / CELULAR APK)
            function detectarTipoDispositivo() {
                try {
                    if (window.AndroidHost && typeof window.AndroidHost.getDeviceKind === 'function') {
                        const kind = String(window.AndroidHost.getDeviceKind() || '').toLowerCase();
                        if (kind.includes('tv') || kind.includes('box')) return kind;
                        if (kind.includes('phone') || kind.includes('mobile')) return 'phone';
                    }
                } catch (_) {}
                const ua = navigator.userAgent || '';
                if (/AFT|BRAVIA|SmartTV|GoogleTV|TV Box|MXQ|X96|MiBox|Android TV/i.test(ua)) {
                    return 'tvbox';
                }
                if (/Android|iPhone|iPad|Mobile/i.test(ua) && Math.min(window.screen.width, window.screen.height) < 768) {
                    return 'phone';
                }
                return 'desktop';
            }

            const DEVICE_KIND = detectarTipoDispositivo();
            document.documentElement.dataset.deviceKind = DEVICE_KIND;
            document.body.dataset.deviceKind = DEVICE_KIND;

            function forcarPaisagemTelaCheia() {
                document.body.classList.add('fullscreen-mode');
                try {
                    if (window.AndroidHost && typeof window.AndroidHost.setOrientation === 'function') {
                        window.AndroidHost.setOrientation(0);
                    }
                } catch (_) {}
                try {
                    if (screen.orientation && typeof screen.orientation.lock === 'function') {
                        screen.orientation.lock('landscape').catch(() => {});
                    }
                } catch (_) {}
                try {
                    const stage = document.getElementById('stage') || document.documentElement;
                    if (!document.fullscreenElement && typeof stage.requestFullscreen === 'function') {
                        stage.requestFullscreen().catch(() => {});
                    }
                } catch (_) {}
            }

            // 2. RESOLUÇÃO DE PASTA RAIZ KARAOKÊ (COM OU SEM ACENTO) E SUBPASTAS
            const ROOT_CANDIDATES = ['KARAOKÊ', 'KARAOKE', 'karaokê', 'karaoke', '.'];
            let resolvedRootPrefix = '';

            async function verificarArquivoExiste(url) {
                try {
                    const resp = await fetch(url, { method: 'HEAD', cache: 'no-store' });
                    if (resp.ok) return true;
                } catch (_) {}
                try {
                    const respGet = await fetch(url, { method: 'GET', cache: 'no-store' });
                    return respGet.ok;
                } catch (_) {
                    return false;
                }
            }

            function montarCaminho(subPath) {
                const cleanSub = String(subPath || '').replace(/^\/+/, '');
                if (!resolvedRootPrefix) return cleanSub;
                return `${resolvedRootPrefix}/${cleanSub}`;
            }

            async function resolverPastaRaiz() {
                for (const candidate of ROOT_CANDIDATES) {
                    const probe = candidate === '.' ? 'intro.mp4' : `${candidate}/intro.mp4`;
                    if (await verificarArquivoExiste(probe)) {
                        resolvedRootPrefix = candidate === '.' ? '' : candidate;
                        return resolvedRootPrefix;
                    }
                }
                for (const candidate of ['KARAOKÊ', 'KARAOKE', 'karaokê', 'karaoke']) {
                    if (await verificarArquivoExiste(`${candidate}/qrlista.png`)) {
                        resolvedRootPrefix = candidate;
                        return resolvedRootPrefix;
                    }
                }
                resolvedRootPrefix = '';
                return '';
            }

            // 3. SEQUÊNCIA DE INTROS (intro.mp4 ATÉ intro5.mp4) + PROTETOR DE TELA APÓS 3 MINUTOS
            const INTRO_FILENAMES = ['intro.mp4', 'intro2.mp4', 'intro3.mp4', 'intro4.mp4', 'intro5.mp4'];
            const INACTIVITY_TIMEOUT_MS = 3 * 60 * 1000; // 3 minutos
            let availableIntroUrls = [];
            let introQueue = [];
            let introPlaying = false;
            let inactivityTimerId = null;

            const introScreen = document.getElementById('intro-screen');
            const introVideo = document.getElementById('intro-video');
            const introCurtain = document.getElementById('intro-curtain');
            const introError = document.getElementById('intro-error');
            const btnRetryIntro = document.getElementById('btn-retry-intro');

            async function descobrirIntrosDisponiveis() {
                const found = [];
                for (const file of INTRO_FILENAMES) {
                    const primary = montarCaminho(file);
                    if (await verificarArquivoExiste(primary)) {
                        found.push(primary);
                        continue;
                    }
                    const alt = montarCaminho(`vídeos/${file}`);
                    if (await verificarArquivoExiste(alt)) {
                        found.push(alt);
                    }
                }
                availableIntroUrls = found;
                return found;
            }

            function encerrarIntroEIrParaPalco() {
                introPlaying = false;
                introQueue = [];
                try {
                    introVideo.pause();
                    introVideo.removeAttribute('src');
                    introVideo.load();
                } catch (_) {}
                introScreen.classList.remove('active');
                introError.classList.remove('active');
                forcarPaisagemTelaCheia();
                resetarTimerInatividade();
            }

            function tocarProximaIntroDaFila() {
                if (!introQueue.length) {
                    encerrarIntroEIrParaPalco();
                    return;
                }
                const nextUrl = introQueue.shift();
                introPlaying = true;
                introScreen.classList.add('active');
                introError.classList.remove('active');
                introCurtain.classList.remove('hidden');

                introVideo.muted = false;
                introVideo.controls = false;
                introVideo.removeAttribute('controls');
                introVideo.src = nextUrl;
                introVideo.currentTime = 0;

                const onLoaded = () => {
                    introVideo.currentTime = 0;
                    introCurtain.classList.add('hidden');
                    const playPromise = introVideo.play();
                    if (playPromise && typeof playPromise.catch === 'function') {
                        playPromise.catch(() => {
                            introVideo.muted = true;
                            introVideo.play().catch(() => {
                                introError.classList.add('active');
                            });
                        });
                    }
                };

                introVideo.onloadeddata = onLoaded;
                introVideo.onended = () => {
                    tocarProximaIntroDaFila();
                };
                introVideo.onerror = () => {
                    tocarProximaIntroDaFila();
                };
                introVideo.load();
            }

            async function iniciarSequenciaIntros(isScreenSaver = false) {
                if (!availableIntroUrls.length) {
                    await descobrirIntrosDisponiveis();
                }
                if (!availableIntroUrls.length) {
                    if (!isScreenSaver) encerrarIntroEIrParaPalco();
                    return;
                }
                introQueue = [...availableIntroUrls];
                tocarProximaIntroDaFila();
            }

            function sistemaEstaEmReproducaoAtiva() {
                const videoPlayer = document.getElementById('video-player');
                const videoAtivo = videoPlayer && !videoPlayer.paused && !videoPlayer.ended && videoPlayer.currentTime > 0;
                const contagemAtiva = document.body.classList.contains('countdown-ativo');
                return Boolean(videoAtivo || contagemAtiva || introPlaying);
            }

            function resetarTimerInatividade() {
                if (inactivityTimerId) clearTimeout(inactivityTimerId);
                inactivityTimerId = setTimeout(() => {
                    if (!sistemaEstaEmReproducaoAtiva()) {
                        iniciarSequenciaIntros(true);
                    } else {
                        resetarTimerInatividade();
                    }
                }, INACTIVITY_TIMEOUT_MS);
            }

            ['pointerdown', 'touchstart', 'keydown', 'mousemove'].forEach(evt => {
                window.addEventListener(evt, () => {
                    if (introPlaying) {
                        encerrarIntroEIrParaPalco();
                    } else {
                        resetarTimerInatividade();
                    }
                }, { passive: true });
            });

            btnRetryIntro.addEventListener('click', () => {
                tocarProximaIntroDaFila();
            });

            // 4. ESTADO GLOBAL DO KARAOKÊ E CONTROLE DE FILA / QR / BOTÃO SAIR
            const state = {
                catalog: [],
                queue: [],
                currentSong: null,
                qrVisible: true,
                rockModeActive: false,
                rockSlideTimer: null,
                rockLightningTimer: null,
                rockAudio: null
            };

            const qrListaContainer = document.getElementById('qr-lista-container');
            const qrListaImg = document.getElementById('qr-lista-img');
            const btnSairPainel = document.getElementById('btn-sair-painel');
            const queueListEl = document.getElementById('queue-list');
            const queueCountEl = document.getElementById('queue-count');

            function atualizarEstadoQrLista() {
                if (!qrListaContainer) return;
                qrListaContainer.classList.toggle('visivel', Boolean(state.qrVisible));
            }

            function atualizarBotaoSairFila() {
                if (!btnSairPainel) return;

                return String(raw || '')
                    .normalize('NFD')
                    .replace(/[̀-ͯ]/g, '')
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-+|-+$/g, '');

            function extrairArtistaDeMusica(songObj) {
                if (songObj && songObj.artist && songObj.artist.trim()) {
                    return songObj.artist.trim();

                const fonte = (songObj && (songObj.fileName || songObj.title)) || '';
                const semExt = String(fonte).replace(/\.(mp4|mkv|avi|webm|mp3)$/i, '');
                const partes = semExt.split(/\s*-\s*/);
                if (partes.length >= 3) {
                    return partes[partes.length - 1].trim();
                }
                if (partes.length === 2 && !/^\d+$/.test(partes[1].trim())) {
                    return partes[1].trim();

                return '';
            }

            function gerarCaminhoRaio(xStart, yStart, xEnd, yEnd, segments = 14, jitter = 38) {
                let d = `M ${xStart} ${yStart}`;
                let curX = xStart;
                let curY = yStart;
                const stepY = (yEnd - yStart) / segments;
                const stepX = (xEnd - xStart) / segments;
                let branchesSvg = '';

                for (let i = 1; i <= segments; i++) {
                    const isLast = i === segments;
                    curX = isLast ? xEnd : curX + stepX + (Math.random() * 2 - 1) * jitter;
                    curY = isLast ? yEnd : curY + stepY + (Math.random() * 8 - 4);
                    d += ` L ${curX.toFixed(1)} ${curY.toFixed(1)}`;

                    if (!isLast && Math.random() < 0.42) {
                        let bx = curX;
                        let by = curY;
                        let bd = `M ${bx.toFixed(1)} ${by.toFixed(1)}`;
                        const dirX = (Math.random() < 0.5 ? -1 : 1) * (24 + Math.random() * 34);
                        const branchSteps = 4 + Math.floor(Math.random() * 4);
                        for (let b = 1; b <= branchSteps; b++) {
                            bx += dirX / branchSteps + (Math.random() - 0.5) * 18;
                            by += (28 + Math.random() * 26);
                            bd += ` L ${bx.toFixed(1)} ${by.toFixed(1)}`;
                        }
                        branchesSvg += `<path d="${bd}" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>`;
                    }
                }
                return { mainPath: d, branchesSvg };
            }

            function dispararRaioRealista() {
                if (!state.rockModeActive || !raioSvg || !raioFlash) return;
                const useBlue = Math.random() < 0.5;
                const coreColor = useBlue ? '#cfeaff' : '#ffffff';
                const glowColor = useBlue ? '#1eafff' : '#e8f6ff';

                const xTop = 120 + Math.random() * 960;
                const xBottom = Math.max(80, Math.min(1120, xTop + (Math.random() - 0.5) * 320));
                const { mainPath, branchesSvg } = gerarCaminhoRaio(xTop, 0, xBottom, 720, 16, 42);

                raioSvg.innerHTML = `
                    <defs>
                        <filter id="glowRaioReal" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur stdDeviation="8" result="blur1"/>
                            <feGaussianBlur stdDeviation="20" result="blur2"/>
                            <feMerge>
                                <feMergeNode in="blur2"/>
                                <feMergeNode in="blur1"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <g filter="url(#glowRaioReal)" stroke="${glowColor}">
                        ${branchesSvg}
                        <path d="${mainPath}" fill="none" stroke="${glowColor}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
                        <path d="${mainPath}" fill="none" stroke="${coreColor}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>
                `;

                raioFlash.classList.remove('raio-branco', 'raio-azul', 'ativo');
                raioSvg.classList.remove('ativo');
                void raioFlash.offsetWidth;
                void raioSvg.offsetWidth;

                raioFlash.classList.add(useBlue ? 'raio-azul' : 'raio-branco', 'ativo');
                raioSvg.classList.add('ativo');

                if (tornadoLayer) {
                    tornadoLayer.classList.remove('tremendo');
                    void tornadoLayer.offsetWidth;
                    tornadoLayer.classList.add('tremendo');
                }

                setTimeout(() => {
                    raioSvg.classList.remove('ativo');
                    raioFlash.classList.remove('ativo');
                }, 380);
            }

            function formatarTempo(seg) {
                if (!isFinite(seg) || seg < 0) return '00:00';
                const total = Math.floor(seg);
                const m = Math.floor(total / 60);
                const s = total % 60;
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }

            function atualizarProgressoBarra() {
                if (!videoPlayer || !isFinite(videoPlayer.duration) || videoPlayer.duration <= 0) {
                    if (progressFillEl) progressFillEl.style.width = '0%';
                    if (timeRemainingEl) timeRemainingEl.textContent = '00:00';
                    return;
                }
                const pct = Math.max(0, Math.min(100, (videoPlayer.currentTime / videoPlayer.duration) * 100));
                if (progressFillEl) progressFillEl.style.width = `${pct}%`;
                const restante = Math.max(0, videoPlayer.duration - videoPlayer.currentTime);
                if (timeRemainingEl) timeRemainingEl.textContent = `-${formatarTempo(restante)}`;
            }

            function buscarPosicaoNaBarra(clientX) {
                if (!progressContainer || !videoPlayer || !isFinite(videoPlayer.duration) || videoPlayer.duration <= 0) return;
                const rect = progressContainer.getBoundingClientRect();
                if (!rect.width) return;
                const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                videoPlayer.currentTime = ratio * videoPlayer.duration;
                atualizarProgressoBarra();
            }

            let isScrubbing = false;
            if (progressContainer) {
                progressContainer.addEventListener('pointerdown', (e) => {
                    isScrubbing = true;
                    progressContainer.setPointerCapture(e.pointerId);
                    buscarPosicaoNaBarra(e.clientX);
                });
                progressContainer.addEventListener('pointermove', (e) => {
                    if (!isScrubbing) return;
                    buscarPosicaoNaBarra(e.clientX);
                });
                const pararArraste = (e) => {
                    if (!isScrubbing) return;
                    isScrubbing = false;
                    try { progressContainer.releasePointerCapture(e.pointerId); } catch (_) {}
                };
                progressContainer.addEventListener('pointerup', pararArraste);
                progressContainer.addEventListener('pointercancel', pararArraste);
            }

            function rodarContagemEIniciar(songObj, segundos = 5) {
                return new Promise((resolve) => {
                    state.currentSong = songObj;
                    atualizarLetreiro();

                    timerScreen.classList.add('active');
                    videoPlayer.style.display = 'none';

                    carregarCapaArtistaParaContagem(songObj);

                    songDisplayEl.innerHTML =
                        `${songObj.title || ''}${songObj.artist ? ` — ${songObj.artist}` : ''}
` +
                        `<span class="countdown-singer">Cantor(a): ${songObj.singer || 'Convidado'}</span>`;

                    let atual = segundos;
                    const tick = () => {
                        if (atual <= 0) {
                            timerScreen.classList.remove('active');
                            document.body.classList.remove('countdown-ativo');
                            limparCapaArtistaContagem();
                            resolve();
                            return;
                        }
                        countdownNumEl.textContent = String(atual);
                        countdownNumEl.classList.remove('rodando');
                        void countdownNumEl.offsetWidth;
                        countdownNumEl.classList.add('rodando');
                        atual--;
                        setTimeout(tick, 1000);
                    };
                    tick();
                });
            }

            async function reproduzirMusica(songObj) {

            function montarObjetoMusicaPorCodigo(codeRaw, singerRaw) {
                const code = String(codeRaw || '').trim();
                const singer = String(singerRaw || '').trim() || 'Convidado';
                const found = state.catalog.find(m => String(m.code).padStart(4, '0') === code.padStart(4, '0') || String(m.code) === code);
                if (found) {
                    return { ...found, singer };
                }
                const padded = code.padStart(4, '0');
                return {
                    code: padded,
                    title: `Faixa ${padded}`,
                    artist: '',
                    singer,
                    fileName: `${padded}.mp4`
                };
            }

                    return;
                }
                if (!val) {
                    previewText.textContent = 'Nenhuma música selecionada';

                const previewObj = montarObjetoMusicaPorCodigo(val, singerInput.value);
                previewText.textContent = `${previewObj.code} - ${previewObj.title}${previewObj.artist ? ` (${previewObj.artist})` : ''}`;

                if (/^[0-9]$/.test(e.key)) {

                        const bgUrl = montarCaminho(bgName);
                        if (await verificarArquivoExiste(bgUrl)) {
                            bgStage.style.backgroundImage = `url("${bgUrl}")`;
                            break;
                        }
                    }
                }
                await carregarCatalogoInicial();
                atualizarEstadoQrLista();
                renderizarFila();
                atualizarLetreiro();
                resetarTimerInatividade();
                await iniciarSequenciaIntros(false);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', inicializarApp);
            } else {
                inicializarApp();
            }
        })();
    </script>
</body>
</html>
